<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enchanted Cauldron — Magical Reading</title><style>
*{box-sizing:border-box}body{margin:0;background:#090819;color:#ffe9bc;font-family:Georgia,serif}.scene{width:100%;min-height:100vh;display:flex;justify-content:center;align-items:center}.game{width:min(100vw,1600px);aspect-ratio:16/9;position:relative;background:url('magic_castle.png') center/100% 100% no-repeat;overflow:hidden;box-shadow:0 0 80px #000}.hit{position:absolute;cursor:pointer;border:0;background:transparent;color:transparent}.hit:focus-visible{outline:3px solid #ffe68c}.hit.words{left:77%;top:33%;width:22%;height:11%}.hit.sentences{left:77%;top:45%;width:22%;height:11%}.hit.mixed{left:77%;top:57%;width:22%;height:11%}.hit.cast{left:35%;top:81%;width:32%;height:14%}.hit.cauldron{left:31%;top:53%;width:39%;height:27%}.hit.rules{left:5%;top:43%;width:24%;height:35%}.prompt{position:absolute;top:30%;left:36%;width:31%;height:20%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(14px,3vw,43px);font-weight:bold;color:#2d1335;text-shadow:0 1px 1px #fff8d6;background:#f4dfb9e8;border:3px solid #f4ce8d;border-radius:30% 15% 28% 12%;padding:1%;box-shadow:0 0 30px 12px #e53affaa;z-index:3;line-height:1.15;overflow-wrap:anywhere}.prompt.hide{display:none}.bubble{position:absolute;border-radius:50%;border:2px solid #e7a5ff;box-shadow:0 0 16px #ec6cff,inset 0 0 9px #c82dff;pointer-events:none;animation:rise 2s linear forwards;z-index:4}@keyframes rise{to{transform:translateY(-220px) scale(1.6);opacity:0}}.spark{position:absolute;width:5px;height:5px;background:#fff7bd;box-shadow:0 0 12px 5px #ff8dfc;border-radius:50%;z-index:6;pointer-events:none;animation:burst 1.2s ease-out forwards}@keyframes burst{to{transform:translate(var(--dx),var(--dy));opacity:0}}.glow{position:absolute;left:34%;top:49%;width:33%;height:18%;border-radius:50%;background:radial-gradient(ellipse,#fa8bff77,transparent 70%);filter:blur(16px);pointer-events:none;animation:pulse 1.4s infinite alternate}@keyframes pulse{to{opacity:.25;transform:scale(1.12)}}.status{position:absolute;bottom:1%;left:38%;width:25%;text-align:center;font-size:clamp(10px,1.15vw,18px);text-shadow:0 2px 5px #000;background:#1c1028b8;border-radius:15px;padding:4px}.settings{position:absolute;z-index:9;left:2%;top:3%;font-size:clamp(10px,1.1vw,16px);padding:8px 12px;border-radius:8px;background:#26132acb;color:#ffe5a7;border:1px solid #c5a064;cursor:pointer}.drawer{position:absolute;z-index:10;top:8%;left:2%;width:min(360px,70%);max-height:86%;overflow:auto;background:#170f21f5;border:2px solid #d2a75e;border-radius:12px;padding:16px;display:none;box-shadow:0 0 40px #000}.drawer.open{display:block}.drawer h2{margin:4px 0 12px;color:#f4d59a}.drawer button{background:#42244b;border:1px solid #b99064;color:#fff0c9;padding:7px;border-radius:5px;margin:3px;cursor:pointer}.drawer button.active{background:#bc8a4b;color:#17101a}.drawer textarea{width:100%;min-height:100px;background:#25162c;color:white;border:1px solid #a9875a;padding:8px}.tags{display:flex;flex-wrap:wrap}.tag{font-size:12px}.drawer p{font-size:13px}.rule{font-size:13px;padding:4px;border-bottom:1px solid #775c64}.rule strong{color:#f8d79b}.example{color:#e2c6e7}.small{font-size:12px}.toast{position:absolute;z-index:12;top:23%;left:35%;width:33%;text-align:center;color:#fff4cf;font-size:clamp(12px,1.4vw,21px);text-shadow:0 0 8px #160d20;pointer-events:none}.hidden{display:none!important}@media(max-width:650px){.game{width:100vw;min-height:65vh;aspect-ratio:16/10;background-size:100% 100%}.prompt{font-size:15px}.settings{font-size:10px;padding:4px}}
</style><style>
.game{background-size:100% 100%}.game:before{content:'THE ENCHANTED CAULDRON';position:absolute;z-index:2;top:2%;left:27%;width:50%;text-align:center;font-size:clamp(17px,3vw,46px);font-weight:bold;color:#fbe3a4;text-shadow:0 3px 4px #32131a,0 0 18px #ffbe6a;pointer-events:none}
.prompt{left:30%;top:28%;width:43%;height:19%;border:5px ridge #e8bd6b;border-radius:25px;background:linear-gradient(135deg,#fff4d5,#f8d9a4 65%,#f4e4c0);color:#351336;text-shadow:none;box-shadow:0 0 0 4px #5c2865,0 0 42px 14px #f3d2ffb3;z-index:7;font-size:clamp(16px,3.4vw,53px);padding:1.5%;line-height:1.12;opacity:1}.prompt.appear{animation:cardpop .55s cubic-bezier(.2,1.4,.3,1)}@keyframes cardpop{from{opacity:0;transform:translateY(35px) scale(.45) rotate(-5deg);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
.hit.words,.hit.sentences,.hit.mixed{left:78%;width:20%;height:10%;z-index:5;color:#fff5cc;border:3px ridge #dfb65d;border-radius:20px;font-size:clamp(12px,1.8vw,28px);font-weight:bold;text-shadow:0 2px 3px #000;box-shadow:0 0 16px #db86ff99,inset 0 0 16px #ffffff40}.hit.words{top:33%;background:linear-gradient(#a225c2dd,#4d1279ee)}.hit.sentences{top:45%;background:linear-gradient(#16bde5dd,#065376ee)}.hit.mixed{top:57%;background:linear-gradient(#30b56ddd,#125c38ee)}.hit.cast{left:36%;top:82%;width:30%;height:12%;color:#fff1ba;font-size:clamp(13px,1.85vw,29px);font-weight:bold;text-shadow:0 2px 5px #000;border:3px ridge #e8b66e;border-radius:40px;background:linear-gradient(#bc37c8d9,#5a167bea);box-shadow:0 0 28px 8px #d948ff99}.hit.cast:hover,.hit.words:hover,.hit.sentences:hover,.hit.mixed:hover{filter:brightness(1.4);transform:scale(1.03)}.hit.cauldron{top:56%;left:32%;width:37%;height:25%;z-index:4}.settings{z-index:11}.status{z-index:8;bottom:0;left:32%;width:36%;background:#1c1028dc}.glow{z-index:1;pointer-events:none;background:conic-gradient(from 0deg,#fa3aff66,#2bffdf66,#ffea4666,#6d51ff66,#fa3aff66);filter:blur(35px);animation:spin 5s linear infinite alternate}@keyframes spin{to{transform:rotate(360deg) scale(1.2)}}.bubble{z-index:9;animation:rainbowrise 2s ease-out forwards}@keyframes rainbowrise{to{transform:translate(var(--drift),-600px) scale(1.6);opacity:0}}.spark{z-index:9}.booming{animation:flash .4s 2}@keyframes flash{50%{filter:saturate(1.8) brightness(1.23)}}.drawer{z-index:15}.toast{z-index:12}
@media(max-width:650px){.game{min-height:unset;aspect-ratio:16/9}.prompt{font-size:clamp(13px,3vw,22px)}.hit.words,.hit.sentences,.hit.mixed{font-size:11px;border-width:1px}.hit.cast{font-size:11px;border-width:1px}.game:before{font-size:17px}}
</style></head><body><div class="scene"><div class="game" id="game"><div class="glow"></div><button class="settings" id="settings">SPELLBOOK / SETTINGS</button><div class="drawer" id="drawer"><button id="close">Close</button><h2>Book of Sounds</h2><div class="small">First review the rules, then cast reading spells.</div><p>Stage</p><div id="stage"><button data-stage="review" class="active">Review rules</button><button data-stage="play">Cast & read</button></div><p>Mode</p><div id="mode"><button data-mode="words" class="active">Words</button><button data-mode="sentences">Sentences</button><button data-mode="mixed">Mixed</button></div><p>Sound families</p><div class="tags" id="families"></div><button id="all">Select all / clear</button><div id="rules"></div><p>Own words and sentences (one per line)</p><textarea id="custom" placeholder="moon&#10;I ride my bike."></textarea><button id="save">Save own spells</button><button id="reset">New round</button><span id="saved"></span></div><div class="prompt hide" id="floating"></div><div class="toast" id="toast"></div><button class="hit rules" id="rulesHit" aria-label="Review rules">Rules</button><button class="hit words" data-quick="words" aria-label="Words">Words</button><button class="hit sentences" data-quick="sentences" aria-label="Sentences">Sentences</button><button class="hit mixed" data-quick="mixed" aria-label="Mixed">Mixed</button><button class="hit cast" id="castHit" aria-label="Cast spell">CAST THE SPELL!</button><button class="hit cauldron" id="potHit" aria-label="Stir cauldron">Stir</button><div class="status" id="status">Choose Words, Sentences or Mixed</div><div class="hidden"><div id="spell"><div id="prompt"></div><div id="hint"></div></div><div id="instruction"></div><div id="count"></div><button id="cast"></button><div id="cauldron"></div></div></div></div><script>
const groups=[
['-at','cat,bat,hat,mat,rat,sat','The cat sat on the mat.|A bat is in the hat.','Short a: /æ/'],['-an','man,pan,fan,can,van','The man has a pan.|A fan is on.','Short a: /æ/'],['-am / -ad','jam,ham,ram,mad,sad,dad','Dad has jam.|The ram is mad.','Short a: /æ/'],['-ag / -ap','bag,tag,rag,map,cap,nap','The map is in the bag.|I have a cap.','Short a: /æ/'],['-e','bed,red,hen,pen,ten,net','The hen is red.|The pen is on the bed.','Short e: /e/'],['-id / -ib / -it','kid,lid,bib,rib,sit,hit','The kid can sit.|The lid is big.','Short i: /ɪ/'],['-ig / -ix','pig,big,dig,wig,mix,six','The pig is big.|Mix it with six.','Short i: /ɪ/'],['-in / -ip','pin,fin,win,bin,lip,zip','The pin is in the bin.|Zip it up.','Short i: /ɪ/'],['-o','dog,log,hot,pot,fox,box','The fox is in the box.|The pot is hot.','Short o: /ɒ/ or /ɑ/'],['-un / -ut','sun,run,fun,bun,cut,nut','Run in the sun.|The bun is hot.','Short u: /ʌ/'],['-ug / -ub','bug,mug,rug,hug,cub,tub','The bug is on the rug.|The cub is in the tub.','Short u: /ʌ/'],
['-ape / -ane / -ame','cape,tape,grape,cane,lane,name,game,same','My name is Jane.|I play a game.','Magic e: a_e says /eɪ/'],['-ake / -ave','cake,lake,make,bake,wave,save,cave','I can bake a cake.|Wave at the lake.','Magic e: a_e says /eɪ/'],['-ate','gate,late,date,plate,skate','I can skate.|The gate is open.','Magic e: a_e says /eɪ/'],['-ite / -ipe / -ine','bite,kite,site,pipe,ripe,line,fine,nine','I fly a kite.|The kite is mine.','Magic e: i_e says /aɪ/'],['-ime / -ive','time,lime,dime,five,drive,dive','It is time to drive.|I have five limes.','Magic e: i_e says /aɪ/'],['-ike / -ide','bike,like,hike,ride,hide,side','I ride my bike.|I like to hike.','Magic e: i_e says /aɪ/'],['-one / -oke','bone,cone,stone,phone,joke,poke,smoke','The dog has a bone.|I have a phone.','Magic e: o_e says /oʊ/'],['-ose / -ole','rose,nose,hose,close,hole,pole,mole','The rose is red.|The mole is in a hole.','Magic e: o_e says /oʊ/'],['long u','cube,tube,cute,mule,use,huge','The cube is huge.|The mule is cute.','u_e can say /juː/ or /uː/'],['-ai-','rain,train,main,tail,mail,paint','The rain is cold.|The train is late.','ai usually says /eɪ/'],['-ay','day,play,stay,way,may,say','We play all day.|Stay and play.','ay usually says /eɪ/'],['-ee-','see,tree,bee,feet,green,sheep','I see a green tree.|The bee is on my knee.','ee usually says /iː/'],['-ea / -y / -ey','sea,tea,leaf,clean,happy,baby,key,monkey','The baby is happy.|I see a key.','ea, final y, and ey can say /iː/'],['-igh','night,light,right,high,bright,flight','The light is bright.|It is a dark night.','igh usually says /aɪ/'],['-y / -ie','my,fly,cry,sky,pie,tie,lie','I see a pie.|The bird can fly.','Final y and ie can say /aɪ/'],['-oa','boat,coat,goat,road,soap,toast','The goat is on the road.|I have a coat.','oa usually says /oʊ/'],['-ow','snow,slow,show,grow,blow,window','The snow is white.|I see snow at the window.','ow can say /oʊ/'],['-oo','moon,spoon,food,room,boot,soon','The moon is bright.|The spoon is in the room.','oo often says /uː/']
];
let selected=new Set(groups.map(x=>x[0])),stage='review',mode='words',deck=[],seen=0,last=null;
const $=x=>document.getElementById(x), shuffle=a=>a.sort(()=>Math.random()-.5);
function renderTags(){$('families').innerHTML='';groups.forEach(g=>{let b=document.createElement('button');b.className='tag'+(selected.has(g[0])?' active':'');b.textContent=g[0];b.onclick=()=>{selected.has(g[0])?selected.delete(g[0]):selected.add(g[0]);renderTags();reset();};$('families').append(b)})}
function rules(){let chosen=groups.filter(g=>selected.has(g[0]));$('rules').innerHTML=chosen.slice(0,5).map(g=>`<div class="rule"><strong>${g[0]}</strong><div class="example">${g[1].split(',').slice(0,3).join(' · ')}</div><small>${g[3]}</small></div>`).join('')+(chosen.length>5?`<p class="small">+ ${chosen.length-5} more selected sound families</p>`:'<p class="small">Choose a sound family on the left.</p>')}
function setPrompt(t,h){$('prompt').textContent=t;$('hint').textContent=h;$('spell').classList.toggle('empty',!last)}
function reset(){deck=[];seen=0;last=null;rules();if(stage==='review'){let g=groups.find(g=>selected.has(g[0]));setPrompt(g?g[0]+' · '+g[1].split(',').slice(0,3).join(' · '):'Choose a sound family',g?g[3]:'Select at least one family');$('cast').textContent='START READING';$('instruction').textContent='First, review the reading rule.';$('count').textContent='Rule review';}else{setPrompt('Touch the cauldron','A new reading spell awaits');$('cast').textContent='REVEAL A SPELL';$('instruction').textContent='Tap the potion to reveal a reading challenge.';$('count').textContent='Ready to begin';}}
function buildDeck(){let d=[];groups.filter(g=>selected.has(g[0])).forEach(g=>{if(mode!=='sentences')g[1].split(',').forEach(w=>d.push([w,g[0]]));if(mode!=='words')g[2].split('|').forEach(s=>d.push([s,g[0]]))});let own=$('custom').value.split('\n').map(x=>x.trim()).filter(Boolean);own.forEach(t=>{if(mode==='mixed'||(mode==='sentences'&&t.includes(' '))||(mode==='words'&&!t.includes(' ')))d.push([t,'Your spell'])});return shuffle(d)}
function burst(){let z=$('cauldron');z.classList.add('casting');setTimeout(()=>z.classList.remove('casting'),900);for(let i=0;i<26;i++){let s=document.createElement('i');s.className='spark';s.style.left=(35+Math.random()*30)+'%';s.style.top=(28+Math.random()*30)+'%';s.style.setProperty('--x',(Math.random()*420-210)+'px');s.style.setProperty('--y',(Math.random()*-270-20)+'px');z.append(s);setTimeout(()=>s.remove(),1000)}}
function next(){if(stage==='review'){stage='play';sync();reset()}if(!deck.length&&seen===0)deck=buildDeck();if(!deck.length){setPrompt('The spellbook is complete!','All reading cards finished — start a new round.');$('count').textContent=`${seen} spells completed`;return}last=deck.pop();seen++;setPrompt(last[0],last[1]);$('count').textContent=`Spell ${seen} · ${deck.length} remaining`;burst();$('cast').textContent='NEXT SPELL'}
function sync(){document.querySelectorAll('[data-stage]').forEach(b=>b.classList.toggle('active',b.dataset.stage===stage));document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=b.dataset.stage;sync();reset()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;sync();reset()});$('cast').onclick=next;$('cauldron').onclick=next;$('cauldron').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();next()}};$('all').onclick=()=>{selected=selected.size===groups.length?new Set():new Set(groups.map(g=>g[0]));renderTags();reset()};$('save').onclick=()=>{localStorage.setItem('enchanted-spells', $('custom').value);$('saved').textContent='Your spells are saved in this browser.';reset()};$('reset').onclick=reset;$('custom').value=localStorage.getItem('enchanted-spells')||'';renderTags();reset();

const game=document.getElementById('game'),floating=document.getElementById('floating'),status=document.getElementById('status');
const palette=['#ffdf58','#19efff','#ff4fea','#70ff8c','#a87aff','#ff7b3b','#fff'];
function magic(){game.classList.remove('booming');void game.offsetWidth;game.classList.add('booming');setTimeout(()=>game.classList.remove('booming'),1100);for(let i=0;i<115;i++){let s=document.createElement('i');s.className='spark';s.style.left=(39+Math.random()*25)+'%';s.style.top=(52+Math.random()*13)+'%';let c=palette[Math.floor(Math.random()*palette.length)];s.style.background=c;s.style.boxShadow='0 0 14px 5px '+c;s.style.setProperty('--dx',(Math.random()*1500-750)+'px');s.style.setProperty('--dy',(Math.random()*-900-40)+'px');s.style.animationDuration=(.8+Math.random()*1.3)+'s';game.append(s);setTimeout(()=>s.remove(),2300)}for(let i=0;i<65;i++){let b=document.createElement('i');b.className='bubble';b.style.left=(39+Math.random()*27)+'%';b.style.top=(51+Math.random()*13)+'%';let c=palette[Math.floor(Math.random()*palette.length)];b.style.borderColor=c;b.style.boxShadow='0 0 17px '+c+', inset 0 0 14px '+c;let size=8+Math.random()*43;b.style.width=size+'px';b.style.height=size+'px';b.style.animationDuration=(1.1+Math.random()*2)+'s';b.style.setProperty('--drift',(Math.random()*900-450)+'px');game.append(b);setTimeout(()=>b.remove(),3300)} }
let casting=false;function showCard(){floating.classList.remove('appear');floating.classList.add('hide');void floating.offsetWidth;floating.textContent=document.getElementById('prompt').textContent;floating.classList.remove('hide');floating.classList.add('appear');status.textContent=document.getElementById('count').textContent;magic()}
function castNow(){if(casting)return;casting=true;floating.classList.add('hide');magic();setTimeout(()=>{next();showCard();casting=false},470)}
document.getElementById('castHit').onclick=castNow;document.getElementById('potHit').onclick=castNow;document.getElementById('rulesHit').remove();document.getElementById('settings').onclick=()=>document.getElementById('drawer').classList.toggle('open');document.getElementById('close').onclick=()=>document.getElementById('drawer').classList.remove('open');document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{mode=b.dataset.quick;stage='play';sync();reset();document.getElementById('drawer').classList.remove('open');floating.classList.add('hide');status.textContent=mode.toUpperCase()+' · Tap the cauldron!';magic()});document.getElementById('cast').onclick=castNow;document.getElementById('cauldron').onclick=castNow;document.getElementById('reset').addEventListener('click',()=>{floating.classList.add('hide');status.textContent='New round ready'});document.querySelectorAll('[data-mode],[data-stage]').forEach(b=>b.addEventListener('click',()=>{floating.classList.add('hide');status.textContent='Tap the cauldron to begin'}));status.textContent='Choose a mode, then cast your spell!';
</script></body></html>
