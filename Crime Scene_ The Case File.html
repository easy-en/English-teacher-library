<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Crime Scene: The Case File</title><style>
:root{--cream:#f3e6c8;--wine:#6b1426;--red:#b3202f;--gold:#c9a24b;--char:#1d1918;--brown:#8a5a36;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(#3a2a26,#161211);color:var(--cream);font-family:Georgia,"Times New Roman",serif;min-height:100vh}
#app{max-width:1000px;margin:0 auto;padding:12px;text-align:center}h1{font-size:clamp(26px,5.5vw,50px);letter-spacing:2px;margin:.2em;color:var(--gold);text-shadow:2px 2px 0 #000}.tw{font-family:"Courier New",monospace}
.btn{font:inherit;font-weight:700;letter-spacing:1px;background:var(--red);color:#fff;border:2px solid #000;border-radius:6px;padding:12px 24px;margin:6px;cursor:pointer;box-shadow:0 4px 0 #000}.btn:hover{background:#d02a3b}.btn:active{transform:translateY(3px)}.btn.alt{background:#3b312d}
.file{background:var(--cream);color:#2b211c;border-radius:6px;padding:20px;box-shadow:0 10px 30px #000a;max-width:640px;margin:14px auto;text-align:left}
input[type=text],input[type=password],select{font:inherit;font-size:18px;padding:9px;border:2px solid #5b4636;border-radius:4px;background:#fffaf0;color:#222;max-width:100%}
.sw{display:inline-block;width:34px;height:34px;border-radius:50%;margin:4px;border:3px solid #fff0;cursor:pointer;outline:2px solid #0006}.sw.on{border-color:#000}
.pick{display:inline-block;margin:6px;padding:6px;border:3px solid transparent;border-radius:8px;cursor:pointer;background:#e6d6b1;width:96px}.pick.on{border-color:var(--red);background:#fff}.pick svg{width:100%}
.stamp{display:inline-block;border:5px solid var(--red);color:var(--red);font:900 clamp(20px,5vw,38px) Impact,sans-serif;padding:2px 14px;transform:rotate(-8deg);letter-spacing:4px;opacity:.85}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;background:#0008;border-radius:8px;padding:8px;margin-bottom:8px}.bar svg{width:42px;height:48px;background:#e6d6b1;border-radius:50%}
.lt{display:inline-block;width:26px;height:32px;line-height:32px;background:#e6d6b1;color:#222;border-radius:3px;margin:1px;font:700 18px "Courier New",monospace}.lt.on{background:var(--gold);animation:pop .5s}
.lens{font-size:22px}.lens.x{filter:grayscale(1);opacity:.35}
.scroll{overflow-x:auto}.cork{position:relative;min-width:720px;aspect-ratio:16/11;border:14px solid #4a2f1b;border-radius:8px;background:radial-gradient(circle at 30% 20%,#b98355,#9a6a40 60%,#86582f);box-shadow:inset 0 0 40px #0008,0 10px 30px #000}
.cork svg.str{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.str line{stroke:#d3202f;stroke-width:3;vector-effect:non-scaling-stroke;stroke-linecap:round;filter:drop-shadow(1px 2px 1px #0007)}.str line.d{stroke-dasharray:1;stroke-dashoffset:0;animation:dr 1s}
.nd{position:absolute;width:19%;transform:translate(-50%,-50%) rotate(var(--r));background:#fbf3dc;color:#2b211c;border:0;padding:8px 6px 6px;border-radius:3px;box-shadow:2px 5px 8px #0007;font:inherit;cursor:pointer;text-align:center;transition:transform .2s}.nd:hover:not(.lk){transform:translate(-50%,-50%) rotate(0) scale(1.08);z-index:5}.nd.lk{filter:grayscale(.9) brightness(.8);cursor:not-allowed}.nd:before{content:"";position:absolute;top:-6px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff7b7b,#a01020)}
.nd b{display:block;font-size:clamp(11px,1.6vw,15px);line-height:1.15}.nd i{font-style:normal;font-size:clamp(18px,3vw,28px)}.nd small{display:block;font:11px "Courier New",monospace;color:#6b1426}.nd.ok{background:#e9f2dc}.nd.ok:after{content:"SOLVED";position:absolute;right:-6px;bottom:6px;color:#1c7a3a;border:2px solid #1c7a3a;font:900 11px Impact,sans-serif;padding:0 4px;transform:rotate(-12deg);background:#fff9}.nd.nx{animation:pulse 1.4s infinite}
.ov{position:fixed;inset:0;background:#000b;z-index:10;display:flex;align-items:center;justify-content:center;padding:10px;overflow:auto}.ov .file{margin:auto;width:100%}
.o{display:block;width:100%;text-align:left;font:inherit;font-size:18px;padding:12px;margin:7px 0;border:2px solid #5b4636;border-radius:6px;background:#fffaf0;color:#222;cursor:pointer}.o.on{background:var(--gold);border-color:#000}.fb{min-height:24px;color:var(--red);font-weight:700}
.m2{display:flex;gap:20px;justify-content:space-around}.m2>div{flex:1}.m2 .o.dn{opacity:.55}
.paper{background:#efe3c3;color:#1c1612;max-width:760px;margin:12px auto;padding:20px;border:1px solid #000;box-shadow:0 10px 40px #000;text-align:center}.paper h1{color:#1c1612;text-shadow:none;font-family:"Times New Roman",serif;border-top:4px double #000;border-bottom:4px double #000;padding:6px;font-size:clamp(28px,7vw,60px)}.paper .cols{display:flex;gap:16px;flex-wrap:wrap;text-align:left}.paper .cols>*{flex:1;min-width:230px}.paper svg{width:100%}
.fly{display:inline-block;font:900 clamp(24px,6vw,44px) "Courier New",monospace;background:#1c1612;color:var(--gold);padding:2px 6px;margin:2px;animation:fl .8s backwards}
.esc{animation:flash .5s 6}.run{position:fixed;bottom:12%;left:-120px;width:90px;animation:rn 3s linear forwards;z-index:11}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid #8a7a5a;padding:4px;text-align:left;vertical-align:top}.bad{color:#b3202f;font-weight:700}.good{color:#1c7a3a}
@keyframes pop{50%{transform:scale(1.5)}}@keyframes dr{from{stroke-dashoffset:1}}@keyframes pulse{50%{box-shadow:0 0 18px 4px var(--gold)}}@keyframes fl{from{transform:translateY(-80px) rotate(40deg);opacity:0}}@keyframes flash{50%{box-shadow:inset 0 0 120px 30px #f00}}@keyframes rn{to{left:110%}}
@media print{body *{visibility:hidden}#rp,#rp *{visibility:visible}#rp{position:absolute;left:0;top:0;width:100%}}
.map{position:relative;min-width:720px;aspect-ratio:160/110;border:12px solid #3b2415;border-radius:10px;background:#1a1520;box-shadow:0 10px 40px #000,inset 0 0 60px #000;overflow:hidden}.map>svg{position:absolute;inset:0;width:100%;height:100%}
.loc{position:absolute;width:13%;transform:translate(-50%,-55%);background:none;border:0;cursor:pointer;color:#fff;font:inherit;padding:0;transition:transform .2s}.loc:hover:not(.lk){transform:translate(-50%,-60%) scale(1.12);z-index:5}.loc svg{width:100%;display:block;filter:drop-shadow(0 4px 4px #000)}.loc .lb{display:block;background:#000c;border:1px solid var(--gold);border-radius:12px;font-size:clamp(10px,1.4vw,14px);padding:1px 4px;margin-top:-4px}.loc.lk{filter:grayscale(1) brightness(.5);cursor:not-allowed}.loc.nx:before{content:"";position:absolute;left:10%;right:10%;top:12%;bottom:22%;border:3px solid var(--gold);border-radius:50%;animation:ring 1.4s infinite}.loc .ck{position:absolute;top:-4px;right:6%;background:#1c9a4a;border-radius:50%;width:24px;height:24px;line-height:24px;font:700 14px 'Courier New';z-index:2}
.lit{animation:lit 3s infinite}.pl1{animation:pl 0.6s infinite}.pl2{animation:pl .6s .3s infinite}.tw2{animation:tw 2.5s infinite}.road{stroke-dasharray:3 5;animation:rd 2s linear infinite}.th{stroke:#d3202f;stroke-width:1.1;fill:none;stroke-linecap:round;filter:drop-shadow(.5px 1px .5px #000)}.th.d{stroke-dasharray:1;animation:dr 1.2s}
.file.fly{animation:fm .6s cubic-bezier(.2,.8,.2,1)}
@keyframes ring{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.3);opacity:0}}@keyframes lit{50%{opacity:.5}}@keyframes pl{0%,49%{opacity:1}50%,100%{opacity:.1}}@keyframes tw{50%{opacity:.15}}@keyframes rd{to{stroke-dashoffset:-16}}@keyframes fm{from{transform:translate(var(--fx,0),var(--fy,0)) scale(.1) rotate(-25deg);opacity:0}}
.sm{font-size:13px;padding:6px 12px;margin:2px}
</style></head><body><div id="app"></div><div id="ov"></div><script>
const WORD='INVESTIGATE',KEY='csi_case017_v2',$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

const C=[
{n:'Corner Shop',x:20,y:20,e:'🛒',c:'#7a5a44',r:'#b3202f',t:'Who did it?',...G('1) A person who steals things from a shop is a {0}.<br>2) A person who breaks into houses to steal is a {1}.<br>3) A person who takes money from a bank by force is a {2}.<br>4) A person who secretly takes money from people\'s pockets is a {3}.<br>5) A person who damages buildings and public property is a {4}.',[S3('shoplifter','shoplifting','shoplift'),S3('burglar','burglary','burgle'),S3('robber','robbery','rob'),S3('pickpocket','pickpocketing','pick pockets'),S3('vandal','vandalism','vandalise')])},
{n:'City Bank',x:57,y:14,e:'🏦',c:'#6b7a8a',r:'#34495e',t:'The crime report',...G('1) Two men with masks took £5,000 from the bank. The police are investigating a {0}.<br>2) A teenager put a jacket in his bag and left without paying. That is {1}.<br>3) The family came home and found a broken window. There was a {2} at number 12.',[S3('robbery','robber','rob'),S3('shoplifting','shoplifter','shoplift'),S3('burglary','burglar','burgle')])},
{n:'Police Station',x:97,y:22,e:'🚓',c:'#3f5d8a',r:'#1f2f4d',t:'Complete the sentence',...G('1) The thief tried to {0} a valuable painting.<br>2) The boys wanted to {1} the school walls with spray paint. (British spelling!)',[{t:['steal']},{t:['vandalise']}])},
{n:'Old Park',x:136,y:17,e:'🌳',c:'#4b7a4a',r:'#2e5a33',t:'Word-form lab',...G('1) The police arrested a {0} who stole a phone.<br>2) The {1} of the jewellery shocked the town.<br>3) Two masked men wanted to {2} the bank.<br>4) Someone decided to {3} the empty house while the family was on holiday.<br>5) Some teenagers {4} from shops: they put things in their bags and leave without paying.',[S3('thief','theft','steal'),S3('theft','thief','steal'),S3('rob','robber','robbery'),S3('burgle','burglar','burglary'),S3('shoplift','shoplifter','shoplifting')])},
{n:'Night Café',x:140,y:52,e:'☕',c:'#8a5a36',r:'#5a3822',t:'Break into',...G('1) Someone tried to {0} the house during the night.<br>2) The burglar {1} the shop through the back window yesterday.',[{t:['break into']},{t:['broke into']}])},
{n:'Museum',x:104,y:55,e:'🏛️',c:'#a89878',r:'#6b5a40',t:'Damage report',...G('1) The police investigated the {0} of public property.<br>2) Vandals {1} bus stops and benches.<br>3) The boys wanted to {2} the car, so they broke the windows.',[S3('vandalism','vandal','vandalise'),S3('vandalise','vandal','vandalism'),S3('damage','damaged','damages')])},
{n:'High School',x:66,y:46,e:'🏫',c:'#9a5a4a',r:'#6b2e26',t:"The suspect's statement",...G('1) The suspect {0} the crime last night.<br>2) He says he did not {1} the robbery.<br>3) The detective has {2} the case.<br>4) The thief {3} the window with a stone.',[S3('committed','commit','committing'),S3('commit','committed','committing'),S3('solved','solve','solving'),S3('broke','break','broken')])},
{n:'Old Market',x:26,y:54,e:'🧺',c:'#8a7a3a',r:'#c9a24b',t:'Pickpocket case',...G("1) Pickpocketing means secretly taking money from someone's {0}.<br>2) A {1} works in crowded places like markets and buses.<br>3) The man tried to {2} her pocket on the train.",[S3('pocket','robbery','burglar'),S3('pickpocket','pickpocketing','thief'),S3('pick','rob','steal')])},

{n:'Jewellery Shop',x:124,y:90,e:'💎',c:'#2f6a7a',r:'#c9a24b',t:'Catch the criminal',...G('1) The {0} ran away with the diamond ring.<br>2) Ten people reported {1} in the market last week.<br>3) The vandals decided to {2} the old statue.<br>4) Officer Brown {3} the case and caught the criminal.',[S3('thief','theft','steal'),S3('pickpocketing','pickpocket','pick'),{t:['vandalise']},S3('solved','solve','solving')])}];

const EX=c=>c.k=='m'?PR.map(p=>p.join('–')).join('; '):c.g.map(x=>x.o?x.a:x.t[0]).join(' | ');
const HAIR=['#2b1b12','#7a4a22','#d9b45a','#b5341f','#1a1a22'];

function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function av(g,v,h){const f=g=='f';return `<svg viewBox="0 0 120 140" role="img" aria-label="Detective"><rect x="22" y="100" width="76" height="44" rx="18" fill="${v==2?'#4a4a55':'#7a5c3e'}"/><path d="M48 100l12 20 12-20z" fill="#f3e9d2"/><rect x="52" y="84" width="16" height="20" fill="#e8b98f"/>${f?`<path d="M29 58q0-42 31-42t31 42v38q-9-8-11-30H40q-2 22-11 30z" fill="${h}"/>`:''}<ellipse cx="60" cy="58" rx="26" ry="30" fill="#f1c9a0"/><path d="M34 54q1-31 26-31t26 31q-13-14-26-12q-13-2-26 12z" fill="${h}"/><circle cx="50" cy="60" r="3" fill="#222"/><circle cx="70" cy="60" r="3" fill="#222"/><path d="M51 73q9 7 18 0" stroke="#a04a3a" stroke-width="3" fill="none"/>${v==0?`<ellipse cx="60" cy="34" rx="42" ry="8" fill="#3b2f2a"/><path d="M38 33q0-24 22-24t22 24z" fill="#4b3b34"/><rect x="38" y="26" width="44" height="6" fill="#8a1f2d"/>`:v==1?`<path d="M32 40q28-26 56 0z" fill="#3a4a63"/><path d="M30 40h46" stroke="#222" stroke-width="5"/>`:`<circle cx="49" cy="60" r="9" fill="#fff4" stroke="#222" stroke-width="2.5"/><circle cx="71" cy="60" r="9" fill="#fff4" stroke="#222" stroke-width="2.5"/><path d="M58 60h4" stroke="#222" stroke-width="2.5"/>`}</svg>`}
function shop(sil){return `<svg viewBox="0 0 400 220"><rect width="400" height="220" fill="#2a2230"/><rect y="170" width="400" height="50" fill="#3a3238"/><rect x="60" y="60" width="280" height="115" fill="#7a5a44"/><path d="M50 60h300l-20-30H70z" fill="#b3202f"/><path d="M70 30h40l-10 30H60zM150 30h40l-5 30h-40zM230 30h40l5 30h-40zM310 30h20l20 30h-40z" fill="#f3e6c8"/><rect x="80" y="90" width="100" height="60" fill="#e8c76a" opacity=".85"/><rect x="215" y="90" width="50" height="85" fill="#3b2a20"/><rect x="280" y="90" width="45" height="60" fill="#e8c76a" opacity=".85"/><text x="200" y="52" font-size="14" fill="#6b1426" text-anchor="middle" font-family="Georgia" font-weight="700">CORNER SHOP</text><circle cx="365" cy="108" r="9" fill="#ffe28a"/>${sil?`<g fill="#000" opacity=".85"><circle cx="30" cy="132" r="9"/><path d="M18 142h24l6 36H12z"/></g>`:''}</svg>`}
function bld(c,i){const w=[0,1,2,3,4,5].map(k=>`<rect class="lit" style="animation-delay:${k*.5}s" x="${10+(k%3)*14}" y="${24+Math.floor(k/3)*11}" width="9" height="7" fill="#ffd36a"/>`).join('');return `<svg viewBox="0 0 60 52"><rect x="6" y="18" width="48" height="32" fill="${c.c}"/><path d="M2 20L30 4l28 16z" fill="${c.r}"/>${w}<rect x="42" y="34" width="8" height="16" fill="#2b1a10"/>${i==2?'<circle class="pl1" cx="22" cy="10" r="4" fill="#ff2a2a"/><circle class="pl2" cx="38" cy="10" r="4" fill="#2a7aff"/>':''}<text x="30" y="17" font-size="11" text-anchor="middle">${c.e}</text></svg>`}
const Q=(i)=>{const a=C[i],b=C[i+1],mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.y-a.y,dy=a.x-b.x,l=Math.hypot(dx,dy)||1,o=(i%2?1:-1)*9;return `M${a.x} ${a.y} Q${mx+dx/l*o} ${my+dy/l*o} ${b.x} ${b.y}`};
function mapSVG(){const nx=S.done.indexOf(0);let t='';for(let i=0;i<10;i++)t+=`<path class="th ${S.done[i]?'d':''}" ${S.done[i]?'pathLength="1"':'stroke-opacity=".25" stroke-dasharray="1 3"'} d="${Q(i)}"/>`;
[[0,6],[2,7],[4,9],[1,5],[3,10],[7,10]].forEach(([a,b])=>t+=`<path d="M${C[a].x} ${C[a].y} L${C[b].x} ${C[b].y}" stroke="#7a1520" stroke-width=".35" fill="none" opacity=".55"/>`);

function render(){const A=$('app'),won=S.state=='won';
if(S.state=='profile'){A.innerHTML=`<h1>CRIME SCENE: THE CASE FILE</h1><p><i>Every clue matters. Every word counts.</i></p><div class="file"><div style="text-align:center"><div style="width:150px;margin:auto">${av(P.g,P.v,P.h)}</div></div><p><label>Detective name<br><input type="text" id="nm" maxlength="20" value="${esc(P.name)}" oninput="P.name=this.value;$('er').textContent=''"></label></p><p>Detective: <button class="btn ${P.g=='f'?'':'alt'}" onclick="P.g='f';render()">FEMALE</button><button class="btn ${P.g=='m'?'':'alt'}" onclick="P.g='m';render()">MALE</button></p><p>Style: ${[0,1,2].map(v=>`<span class="pick ${P.v==v?'on':''}" onclick="P.v=${v};render()">${av(P.g,v,P.h)}</span>`).join('')}</p><p>Hair: ${HAIR.map(h=>`<span class="sw ${P.h==h?'on':''}" style="background:${h}" onclick="P.h='${h}';render()"></span>`).join('')}</p><p class="fb" id="er"></p><div style="text-align:center"><button class="btn" onclick="begin()">START INVESTIGATION</button></div></div>${S.hist.length?`<button class="btn alt sm" onclick="report()">📋 Previous results</button>`:''}`}
else if(S.state=='intro'){A.innerHTML=`<div class="file" style="text-align:center"><span class="stamp">CONFIDENTIAL</span><h2 class="tw">CASE FILE #017</h2><div style="background:#2a2230;border-radius:6px;padding:6px">${shop(1)}</div><p class="tw"><i>A valuable item has disappeared from a local shop. Several suspicious people have been seen nearby. Your job is to investigate the evidence, identify the criminal activities and catch the suspect before they escape.</i></p><p>Detective ${esc(S.name)}, the suspect is still unknown. Follow the red threads on the map!</p><button class="btn alt" onclick="S.state='profile';save();render()">← BACK</button><button class="btn" onclick="S.state='board';S.t0=Date.now();save();render()">OPEN THE CASE</button></div>`}
else if(S.state=='board'||(won&&S.rv)){const n=S.done.filter(Boolean).length,nx=S.done.indexOf(0);A.innerHTML=`<div class="bar"><div style="display:flex;align-items:center;gap:8px">${av(S.g,S.v,S.h)}<b>Detective ${esc(S.name)}</b></div><span>Clues: <b>${n}/11</b></span><span>Mistakes left: ${[0,1,2].map(i=>`<span class="lens ${i<3-S.mis?'':'x'}">🔎</span>`).join('')}</span><span>${[...WORD].map((l,i)=>`<span class="lt ${S.done[i]?'on':''}">${S.done[i]?l:'?'}</span>`).join('')}</span><span><button class="btn alt sm" onclick="report()">📋 REPORT</button><button class="btn alt sm" onclick="askRestart()">↺ START OVER</button>${won?`<button class="btn sm" onclick="S.rv=0;render()">🏆 NEWSPAPER</button>`:''}</span></div><div class="scroll"><div class="map">${mapSVG()}${C.map((c,i)=>{const lk=i>nx&&nx>=0;return `<button class="loc ${lk?'lk':''} ${i==nx?'nx':''}" style="left:${c.x/1.6}%;top:${c.y/1.1}%" ${lk?'disabled aria-label="Locked"':''} onclick="openClue(${i},event)">${S.done[i]?`<span class="ck">${WORD[i]}</span>`:''}${bld(c,i)}<span class="lb">${lk?'🔒':i+1+'.'} ${c.n}</span></button>`}).join('')}</div></div><p class="tw" style="font-size:13px">Click the glowing place where the red thread leads.</p>`}
else if(S.state=='failed'){A.innerHTML=`<div class="esc" style="padding:30px 10px"><h1 style="color:#ff4b5c">THE SUSPECT ESCAPED!</h1><div class="file" style="text-align:center"><p><i>The evidence wasn't strong enough this time. Start a new investigation and try again.</i></p><button class="btn" onclick="restart()">RESTART INVESTIGATION</button><button class="btn alt" onclick="report()">📋 REPORT FOR TEACHER</button></div></div><svg class="run" viewBox="0 0 60 90"><g fill="#000"><circle cx="30" cy="12" r="10"/><path d="M18 26h26l8 30-10 4-6-18-2 22 10 26h-10l-10-22-8 22H6l10-28-4-30z"/></g></svg>`}
else{const m=Math.max(1,Math.round((S.t1-S.t0)/60000));A.innerHTML=`<div class="paper"><div class="tw" style="font-size:12px">THE DAILY DETECTIVE · CASE FILE #017</div><h1>DETECTIVE OF THE YEAR</h1><h2 style="font-family:Impact,sans-serif;color:#b3202f;letter-spacing:3px">CASE SOLVED!</h2><p><i>Local Teen Detective ${esc(S.name)} Solves Mystery After Brilliant Investigation</i></p><div class="cols"><div><div style="background:#2a2230">${shop(0)}</div></div><div style="text-align:center"><div style="width:130px;margin:auto">${av(S.g,S.v,S.h)}</div><b>${esc(S.name)}</b><p style="text-align:left">Clues completed: <b>11/11</b><br>Incorrect answers: <b>${S.mis}</b><br>Answer attempts: <b>${S.att}</b><br>First-attempt correct: <b>${S.first}/11</b><br>Time: <b>about ${m} min</b></p></div></div><p><i>You followed the evidence, solved the clues and caught the suspect!</i></p><div>${[...WORD].map((l,i)=>`<span class="fly" style="animation-delay:${i*.2}s">${l}</span>`).join('')}</div><p><span class="stamp">CASE CLOSED</span></p><button class="btn" onclick="S.rv=1;render()">← BACK TO THE MAP</button><button class="btn alt" onclick="report()">📋 REPORT FOR TEACHER</button><button class="btn alt" onclick="askRestart()">↺ PLAY AGAIN</button></div>`}}
function begin(){const n=P.name.trim();if(!n){$('er').textContent='Please enter your name, detective.';$('nm').focus();return}const h=S.hist;S=fresh(h);Object.assign(S,{name:n,g:P.g,v:P.v,h:P.h,state:'intro'});save();render()}
function endLog(res){S.hist.push({d:new Date().toLocaleString(),n:S.name,res,c:S.done.filter(Boolean).length,m:S.mis,a:S.att})}
function restart(){const h=S.hist;S=fresh(h);P={name:'',g:'f',v:0,h:HAIR[0]};save();closeO();render()}
function askRestart(){ovl(`<h2>Start over?</h2><p>The current attempt will be cleared and you will go back to the profile screen.</p><button class="btn" onclick="if(S.state=='board'&&S.att)endLog('restarted');restart()">YES, START OVER</button><button class="btn alt" onclick="closeO()">NO, GO BACK</button>`)}
function openClue(i,ev){const c=C[i];if(!(S.state=='board'||S.state=='won'))return;const nx=S.done.indexOf(0);let o={};if(ev&&ev.currentTarget){const r=ev.currentTarget.getBoundingClientRect();o={x:r.left+r.width/2-innerWidth/2,y:r.top+r.height/2-innerHeight/2}}
if(S.done[i]){cur={i,ro:1};ovl(`<h2>Clue ${i+1}: ${c.t}</h2><p class="tw">${c.k=='m'?'Matched: '+EX(c):c.s.replace(/\{(\d)\}/g,(m,d)=>`<b>${c.g[d].o?c.g[d].a:c.g[d].t[0]}</b>`)}</p><p class="good">✔ Solved. Letter ${WORD[i]} already collected.</p><button class="btn alt" onclick="closeO()">← BACK TO THE MAP</button>`,o);return}
if(nx>=0&&i>nx)return;cur={i,pairs:{},p:null,so:c.g?c.g.map(x=>x.o?sh(x.o):null):null,cr:c.k=='m'?sh(PR.map(p=>p[1])):null};drawClue(o)}
function drawClue(o){const i=cur.i,c=C[i];let b='';
if(c.k=='m')b=`<p>Connect each criminal to the crime.</p><div class="m2"><div>${PR.map(p=>`<button class="o ${cur.p==p[0]?'on':''} ${cur.pairs[p[0]]?'dn':''}" onclick="cur.p='${p[0]}';drawClue()">${p[0]}${cur.pairs[p[0]]?' → '+cur.pairs[p[0]]:''}</button>`).join('')}</div><div>${cur.cr.map(x=>`<button class="o" onclick="mp('${x}')">${x}</button>`).join('')}</div></div>`;
else b=`<p class="tw" style="font-size:18px;line-height:2.1">${c.s.replace(/\{(\d)\}/g,(m,d)=>c.g[d].o?`<select id="g${d}"><option value="">…</option>${cur.so[d].map(x=>`<option>${x}</option>`).join('')}</select>`:`<input type="text" id="g${d}" size="12" autocomplete="off" autocapitalize="off" placeholder="type…">`)}</p>`;
ovl(`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><h2 style="margin:0;font-size:clamp(20px,3vw,28px)">Clue ${i+1}: ${c.t}</h2><button class="btn alt sm" onclick="closeO()">← BACK</button></div>${b}<p class="fb" id="fb"></p><button class="btn" onclick="sub()">CHECK</button>`,o)}
function mp(x){if(!cur.p)return $('fb').textContent='Pick a criminal first.';for(const k in cur.pairs)if(cur.pairs[k]==x)delete cur.pairs[k];cur.pairs[cur.p]=x;cur.p=null;drawClue()}
function sub(){const i=cur.i,c=C[i];let rec;
if(c.k=='m'){if(Object.keys(cur.pairs).length<6)return $('fb').textContent='Make all six pairs first.';rec=PR.map(p=>({v:p[0]+'→'+cur.pairs[p[0]],ok:cur.pairs[p[0]]==p[1]}))}
else{const v=c.g.map((x,d)=>$('g'+d).value.trim().replace(/\s+/g,' '));if(v.includes(''))return $('fb').textContent='Fill in every gap first.';rec=c.g.map((x,d)=>({v:v[d],ok:x.o?v[d]==x.a:x.t.includes(v[d].toLowerCase())}))}
const ok=rec.every(r=>r.ok),L=S.log[i];L.att++;L.ans.push(rec);S.att++;
if(ok){S.done[i]=1;if(L.att==1)S.first++;if(S.done.every(Boolean)){S.state='won';S.rv=0;S.t1=Date.now();endLog('solved')}save();closeO();render()}
else{S.mis++;if(S.mis>=3){S.state='failed';endLog('suspect escaped');save();closeO();render();return}save();$('fb').textContent=`Not quite: ${rec.filter(r=>r.ok).length} of ${rec.length} correct. Think: person, crime or action? Mistakes left: ${3-S.mis}.`}}
function ovl(h,o={}){$('ov').innerHTML=`<div class="ov"><div class="file fly" role="dialog" aria-modal="true" style="--fx:${(o.x||0)}px;--fy:${(o.y||0)}px">${h}</div></div>`}function closeO(){$('ov').innerHTML='';cur=null}
function csv(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"',r=[['Student',S.name],['Date',new Date().toLocaleString()],['Clues completed',S.done.filter(Boolean).length],['Incorrect answers',S.mis],['Attempts',S.att],['First-attempt correct',S.first],[],['Clue','Attempts','Answers']];C.forEach((c,i)=>{const L=S.log[i];r.push([c.t,L.att,L.ans.map(a=>a.map(x=>x.v+(x.ok?'':' (wrong)')).join('; ')).join(' / ')])});return r.map(x=>x.map(q).join(',')).join('\n')}
function report(){const st=S.state=='won'?'CASE SOLVED':S.state=='failed'?'SUSPECT ESCAPED':'In progress';ovl(`<div id="rp"><h2>📋 Report for the teacher</h2><p><b>${esc(S.name||'—')}</b> · ${new Date().toLocaleString()} · <b>${st}</b><br>Clues solved: <b>${S.done.filter(Boolean).length}/11</b> · Mistakes: <b class="bad">${S.mis}/3</b> · Attempts: ${S.att} · First-try correct: ${S.first}</p><table><tr><th>#</th><th>Clue</th><th>Att.</th><th>Student's answers (✘ = wrong)</th></tr>${C.map((c,i)=>{const L=S.log[i];return `<tr><td>${i+1}</td><td>${c.t}${S.done[i]?' ✔':''}</td><td>${L.att}</td><td>${L.ans.map((a,k)=>`<div>${k+1}) ${a.map(x=>`<span class="${x.ok?'good':'bad'}">${esc(x.v)}${x.ok?'':' ✘'}</span>`).join(' · ')}</div>`).join('')||'—'}</td></tr>`}).join('')}</table>${S.hist.length?`<p><b>Earlier attempts:</b><br>${S.hist.map(h=>`${h.d} · ${esc(h.n)} · ${h.res} · clues ${h.c}/11 · mistakes ${h.m}`).join('<br>')}</p>`:''}<p style="font-size:12px">Take a screenshot of this window. Results are saved only in this browser.</p></div><details><summary>CSV</summary><textarea readonly rows="4" style="width:100%;font:12px monospace">${esc(csv())}</textarea></details><button class="btn alt" onclick="closeO()">CLOSE</button><button class="btn alt" onclick="window.print()">Print</button>`)}
S=load();if(!S.hist)S.hist=[];render();
</script></body></html>
