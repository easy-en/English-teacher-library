/* ================= CHESS ENGINE (full legal rules) ================= */
const DIRS={N:[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]],B:[[-1,-1],[-1,1],[1,-1],[1,1]],R:[[-1,0],[1,0],[0,-1],[0,1]]};
DIRS.Q=DIRS.B.concat(DIRS.R);DIRS.K=DIRS.Q;
const inb=(r,f)=>r>=0&&r<8&&f>=0&&f<8,FILES="abcdefgh",sqn=i=>FILES[i&7]+(8-(i>>3));
const START="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq -";
function parseFen(f){const [pl,t,c,ep]=f.split(" "),b=[];
 for(const ch of pl.replace(/\//g,""))if(/\d/.test(ch))for(let k=0;k<+ch;k++)b.push(null);else b.push((ch==ch.toUpperCase()?"w":"b")+ch.toUpperCase());
 return {b,t,c:{wK:+c.includes("K"),wQ:+c.includes("Q"),bK:+c.includes("k"),bQ:+c.includes("q")},ep:ep&&ep!="-"?(8-ep[1])*8+FILES.indexOf(ep[0]):-1}}
function attacked(b,sq,by){
 const r=sq>>3,f=sq&7,pr=by=="w"?r+1:r-1;
 for(const df of[-1,1])if(inb(pr,f+df)&&b[pr*8+f+df]==by+"P")return true;
 for(const[dr,df]of DIRS.N)if(inb(r+dr,f+df)&&b[(r+dr)*8+f+df]==by+"N")return true;
 for(const[dr,df]of DIRS.K)if(inb(r+dr,f+df)&&b[(r+dr)*8+f+df]==by+"K")return true;
 for(const k of["B","R"])for(const[dr,df]of DIRS[k]){let rr=r+dr,ff=f+df;
  while(inb(rr,ff)){const p=b[rr*8+ff];if(p){if(p[0]==by&&(p[1]==k||p[1]=="Q"))return true;break}rr+=dr;ff+=df}}
 return false}
function pseudo(s){
 const m=[],t=s.t,o=t=="w"?"b":"w",b=s.b;
 const add=(from,to,p,cap,x)=>{const pr=p[1]=="P"&&(to>>3==(t=="w"?0:7));
  if(pr)["Q","R","B","N"].forEach(q=>m.push({from,to,p,cap,promo:q}));else m.push({from,to,p,cap,...x})};
 for(let i=0;i<64;i++){const p=b[i];if(!p||p[0]!=t)continue;const k=p[1],r=i>>3,f=i&7;
  if(k=="P"){const d=t=="w"?-1:1,r1=r+d;
   if(inb(r1,f)&&!b[r1*8+f]){add(i,r1*8+f,p,null);if(r==(t=="w"?6:1)&&!b[(r+2*d)*8+f])add(i,(r+2*d)*8+f,p,null,{dbl:1})}
   for(const df of[-1,1]){if(!inb(r1,f+df))continue;const to=r1*8+f+df;
    if(b[to]&&b[to][0]==o)add(i,to,p,b[to]);else if(to==s.ep)add(i,to,p,o+"P",{ep:1})}}
  else if(k=="N"||k=="K"){for(const[dr,df]of DIRS[k]){if(!inb(r+dr,f+df))continue;const to=(r+dr)*8+f+df,q=b[to];
    if(!q)add(i,to,p,null);else if(q[0]==o)add(i,to,p,q)}}
  else for(const[dr,df]of DIRS[k]){let rr=r+dr,ff=f+df;
   while(inb(rr,ff)){const to=rr*8+ff,q=b[to];if(!q)add(i,to,p,null);else{if(q[0]==o)add(i,to,p,q);break}rr+=dr;ff+=df}}}
 const ks=t=="w"?60:4,c=s.c;
 if(b[ks]==t+"K"&&!attacked(b,ks,o)){
  if(c[t+"K"]&&!b[ks+1]&&!b[ks+2]&&b[ks+3]==t+"R"&&!attacked(b,ks+1,o)&&!attacked(b,ks+2,o))m.push({from:ks,to:ks+2,p:t+"K",cap:null,castle:"K"});
  if(c[t+"Q"]&&!b[ks-1]&&!b[ks-2]&&!b[ks-3]&&b[ks-4]==t+"R"&&!attacked(b,ks-1,o)&&!attacked(b,ks-2,o))m.push({from:ks,to:ks-2,p:t+"K",cap:null,castle:"Q"})}
 return m}
function make(s,mv){
 const b=s.b.slice(),t=s.t,c={...s.c};
 b[mv.to]=mv.promo?t+mv.promo:mv.p;b[mv.from]=null;
 if(mv.ep)b[mv.to+(t=="w"?8:-8)]=null;
 if(mv.castle=="K"){b[mv.to-1]=b[mv.to+1];b[mv.to+1]=null}
 if(mv.castle=="Q"){b[mv.to+1]=b[mv.to-2];b[mv.to-2]=null}
 if(mv.p[1]=="K"){c[t+"K"]=0;c[t+"Q"]=0}
 const rk={0:"bQ",7:"bK",56:"wQ",63:"wK"};if(rk[mv.from])c[rk[mv.from]]=0;if(rk[mv.to])c[rk[mv.to]]=0;
 return {b,t:t=="w"?"b":"w",c,ep:mv.dbl?(mv.from+mv.to)/2:-1}}
const legal=s=>{const t=s.t,o=t=="w"?"b":"w";return pseudo(s).filter(m=>{const n=make(s,m);return !attacked(n.b,n.b.indexOf(t+"K"),o)})};
const inCheck=s=>attacked(s.b,s.b.indexOf(s.t+"K"),s.t=="w"?"b":"w");
function perft(s,d){if(!d)return 1;const L=legal(s);if(d==1)return L.length;let n=0;for(const m of L)n+=perft(make(s,m),d-1);return n}

const PAT={};["ape","ane","ame","ake","ave","ate","ite","ipe","ine","ime","ive","ike","ide","one","oke","ose","ole"].forEach(p=>PAT[p]={src:p+"(?=s?\\b)",lab:"-"+p.toUpperCase()});

const rx=p=>new RegExp(PAT[p].src,"gi");
function parseBank(txt){const out=[];let bad=0;
 txt.split("\n").forEach(l=>{l=l.trim();if(!l)return;const [t,tg]=l.split("|");
  const tags=(tg||"").split(/[\s,]+/).filter(x=>PAT[x]&&rx(x).test(t||""));
  if(t&&t.trim()&&tags.length)out.push({t:t.trim(),tags});else bad++});
 return {out,bad}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function hl(text,tags){
 return text.split(/(\b\w+\b)/).map(tok=>{
  if(!/^\w+$/.test(tok))return esc(tok);
  const R=[];tags.forEach(g=>{for(const m of tok.matchAll(rx(g)))R.push([m.index,m.index+m[0].length])});
  if(!R.length)return esc(tok);R.sort((a,b)=>a[0]-b[0]);
  let h="",p=0;for(const[a,b]of R){if(a<p)continue;h+=esc(tok.slice(p,a))+"<mark>"+esc(tok.slice(a,b))+"</mark>";p=b}
  return h+esc(tok.slice(p))}).join("")}

N:'<path d="M14 38C14 30 17 27 21 24l-6 1c-3 0-5-2-5-4 0-3 4-8 8-10l1-6 4 4c9 0 12 9 12 29z"/><path d="M11 39.5h23V36H11z"/><circle class="e" cx="21" cy="14.5" r="1.7"/>',
B:'<path d="M22.5 5.5a3 3 0 0 0-1.6 5.5C17 13.5 15 18 15 22c0 3 1.5 5 3 6.5h-3.5V32h16v-3.5H27c1.5-1.5 3-3.5 3-6.5 0-4-2-8.5-5.9-11a3 3 0 0 0-1.6-5.5z"/><path d="M12.5 39.5h20V35h-20z"/><path class="ln" d="M22.5 14v6M19.5 17h6"/>',
Q:'<path d="M9.5 15L14 30h17l4.5-15L30 22l-1-13-3.5 12-3-13-3 13L16 9l-1 13z"/><circle cx="9.5" cy="13" r="2.3"/><circle cx="16" cy="7" r="2.3"/><circle cx="22.5" cy="6" r="2.3"/><circle cx="29" cy="7" r="2.3"/><circle cx="35.5" cy="13" r="2.3"/><path d="M13 30h19v4H13zM11 35h23v4.5H11z"/>',
K:'<path d="M20.5 3h4v4h4v4h-4v4h-4v-4h-4V7h4z"/><path d="M13 31c-2-6 0-11 5-13.5h9c5 2.5 7 7.5 5 13.5z"/><path d="M12 35h21v4.5H12z"/>'};
const pcSvg=c=>`<svg viewBox="0 0 45 45" class="${c[0]=="w"?"pw":"pb"}" aria-hidden="true">${PG[c[1]]}</svg>`;
const NAMES={K:"King",Q:"Queen",R:"Rook",B:"Bishop",N:"Knight",P:"Pawn"},VAL={P:1,N:2,B:2,R:3,Q:4};

/* ================= GAME STATE ================= */
const $=id=>document.getElementById(id);
const reduce=typeof matchMedia!="undefined"&&matchMedia("(prefers-reduced-motion:reduce)").matches;
let BANK=parseBank(DEFAULT_BANK).out,PE={};
const G={mode:"pvp",n:["PLAYER 1","PLAYER 2"],dur:180,bonus:true,hl:true,snd:true,phase:"idle",paused:false,rem:180,endAt:0,s:null,sel:null,targets:[],last:null,anim:false,pend:false,card:null,deck:[],di:0,P:null,msg:["",""],fresh:false,tm:null};
const teacher=()=>G.mode=="tvs"&&G.s.t=="b";
const running=()=>G.phase!="idle"&&G.phase!="ended"&&!G.paused;
const canMove=()=>running()&&G.phase=="move"&&!G.anim;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* sound (Web Audio, no files) */
let AC=null;
function tone(f,d,ty,g,w){if(!G.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),v=AC.createGain(),t=AC.currentTime+(w||0);o.type=ty||"sine";o.frequency.value=f;v.gain.setValueAtTime(g||.06,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const SND={move:()=>tone(330,.09,"triangle",.07),cap:()=>{tone(170,.16,"square",.04);tone(110,.22,"triangle",.07,.04)},ok:()=>{tone(523,.1);tone(784,.18,"sine",.06,.1)},end:()=>{tone(392,.25);tone(294,.45,"sine",.06,.25)}};

/* ================= RESET / BUILD ================= */
function resetGame(){
 clearTimeout(G.tm);G.s=parseFen(START);G.phase="idle";G.paused=false;G.rem=G.dur;G.sel=null;G.targets=[];G.last=null;G.anim=false;G.pend=false;G.fresh=false;
 G.P={w:{rp:0,cb:0,reads:0,caps:[]},b:{rp:0,cb:0,reads:0,caps:[]}};G.deck=shuf(BANK.map((_,i)=>i));G.di=0;G.card=null;G.msg="";
 buildBoard();$("promo").className="";render()}
function buildBoard(){
 let h="";for(let i=0;i<64;i++){const r=i>>3,f=i&7;h+=`<div class="sq ${(r+f)%2?"d":"l"}">${f==0?`<i class="co r">${8-r}</i>`:""}${r==7?`<i class="co f">${FILES[f]}</i>`:""}</div>`}
 $("sqs").innerHTML=h;$("pcs").innerHTML="";PE={};G.s.b.forEach((p,i)=>{if(p)mkPiece(i,p)})}
const pos=(e,i)=>{e.style.left=(i&7)*12.5+"%";e.style.top=(i>>3)*12.5+"%"};
function mkPiece(i,p){const e=document.createElement("div");e.className="pc";e.innerHTML=pcSvg(p);pos(e,i);$("pcs").appendChild(e);PE[i]=e}
function paint(){
 const q=$("sqs").children,ck=G.s&&inCheck(G.s)?G.s.b.indexOf(G.s.t+"K"):-1;
 for(let i=0;i<64;i++){const c=q[i].classList;c.toggle("lm",!!G.last&&(G.last.from==i||G.last.to==i));c.toggle("sel",G.sel===i);c.toggle("lg",false);c.toggle("lc",false);c.toggle("chk",i===ck)}
 G.targets.forEach(m=>q[m.to].classList.add(m.cap?"lc":"lg"))}

/* ================= RENDER ================= */
const fmt=r=>{const s=Math.ceil(r);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function clock(){$("clock").textContent=fmt(G.rem);$("clock").classList.toggle("warn",G.phase!="idle"&&G.phase!="ended"&&G.rem<=30)}
function panel(c){const p=G.P[c],name=G.n[c=="w"?0:1],act=G.phase!="idle"&&G.phase!="ended"&&G.s.t==c;
 const h=`<div class="pn${act?" act":""}"><div class="pt"><i class="dot ${c}"></i><b>${esc(name)}</b><small>${c=="w"?"WHITE":"BLACK"}</small></div>
 <div class="tot"><span>TOTAL SCORE</span><b>${p.rp+p.cb}</b></div>
 <div class="kv"><span>Reading points</span><b>${p.rp}</b></div><div class="kv"><span>Capture bonus</span><b>${p.cb}</b></div>
 <div class="kv"><span>Correct readings</span><b>${p.reads}</b></div><div class="kv"><span>Pieces captured</span><b>${p.caps.length}</b></div>
 <div class="cp" aria-label="Captured pieces">${p.caps.map((x,i)=>`<span class="mini${G.fresh==c&&i==p.caps.length-1?" new":""}">${pcSvg(x)}</span>`).join("")}</div></div>`;return h}
function render(){
 $("p1").innerHTML=panel("w");$("p2").innerHTML=panel("b");G.fresh=false;clock();
 const t=G.s.t,nm=esc(G.n[t=="w"?0:1]);$("turn").innerHTML=G.phase=="ended"?"Game over":G.phase=="idle"?"Ready":`<i class="dot ${t}"></i>${nm} · ${G.phase=="move"?"MOVE":G.phase=="read"?"READ":"—"}`;
 $("bHl").textContent="Highlight: "+(G.hl?"ON":"OFF");$("bPass").style.display=G.phase=="move"?"":"none";
 $("bGo").textContent=G.phase=="idle"?"Start":G.paused?"Resume":"Pause";$("bGo").disabled=G.phase=="ended";
 $("bSnd").textContent="Sound: "+(G.snd?"on":"off");
 readUI();paint()}
function readUI(){
 const R=$("read"),t=G.s.t,name=esc(G.n[t=="w"?0:1]);R.classList.remove("paused");
 if(G.phase!="move")$("toast").className="";const set=h=>{R.classList.remove("off");R.innerHTML=h};
 if(G.paused&&G.phase!="ended"&&G.phase!="idle")return set(`<div class="msg big">PAUSED</div><div class="row"><button class="pri" data-a="go">RESUME</button></div>`);
 const msg=G.msg?`<div class="msg ${G.msgc||""}" aria-live="polite">${esc(G.msg)}</div>`:"";
 if(G.phase=="idle")return set(`<div class="msg big">Ready? ${esc(G.n[0])} vs ${esc(G.n[1])}</div><div class="row"><button class="pri" data-a="go">START</button></div>`);
 if(G.phase=="ended")return set(`<div class="msg big">The match is over.</div><div class="row"><button class="pri" data-a="results">Show results</button></div>`);
 if(G.phase=="stuck")return set(`<div class="msg big">${inCheck(G.s)?"CHECKMATE":"STALEMATE"} — ${name} has no legal move.</div><div class="row"><button class="pri" data-a="newpos">Reset the pieces (keep scores)</button><button data-a="pass">Pass the turn</button></div>`);
 if(G.phase=="move"){R.classList.add("off");R.innerHTML="";return}
 const c=G.card,lab=G.hl?"TARGET PATTERN: "+c.tags.map(x=>PAT[x].lab).join(" / "):"&nbsp;";
 set(`<div class="lab">${lab}</div><div class="sent">${G.hl?hl(c.t,c.tags):esc(c.t)}</div>${msg}<div class="row"><button class="pri" data-a="ok">CORRECT — UNLOCK MOVE</button><button data-a="again">TRY AGAIN</button><button data-a="skip">SKIP CARD</button>${teacher()?`<button class="gold" data-a="just">JUST MOVE (no reading)</button>`:""}</div>`)}
function toast(m,c){const e=$("toast");e.textContent=m;e.className="on"+(c=="err"?" err":"");clearTimeout(G.tt);G.tt=setTimeout(()=>{e.className=""},2600)}
const say=(m,c)=>{if(G.phase=="move"){toast(m,c);return}G.msg=m;G.msgc=c||"";readUI()};

/* ================= TURN FLOW ================= */
function drawCard(){if(!BANK.length)return;if(G.di>=G.deck.length){G.deck=shuf(BANK.map((_,i)=>i));G.di=0}G.card=BANK[G.deck[G.di++]]}
function beginTurn(){
 if(G.phase=="ended")return;
 G.sel=null;G.targets=[];
 if(!legal(G.s).length){G.phase="stuck";G.msg="";render();return}
 G.phase="read";drawCard();G.msg=inCheck(G.s)?"CHECK! Protect your king.":teacher()?"Teacher: read the card, or just move.":"Read the sentence aloud.";G.msgc=inCheck(G.s)?"err":"";render()}
function startPause(){
 if(G.phase=="ended")return;
 if(G.phase=="idle"){G.endAt=performance.now()+G.rem*1000;G.paused=false;beginTurn();return}
 if(G.paused){G.endAt=performance.now()+G.rem*1000;G.paused=false}else{tick();G.paused=true}
 render()}
function tick(){if(!running())return;G.rem=Math.max(0,(G.endAt-performance.now())/1000);clock();if(G.rem<=0)endGame()}
function endGame(){
 if(G.phase=="ended")return;if(G.anim){G.pend=true;return}
 G.phase="ended";G.paused=false;G.sel=null;G.targets=[];SND.end();render();results()}
function action(a){
 if(a=="ok"&&G.phase=="read"&&running()){const t=G.s.t;G.P[t].rp++;G.P[t].reads++;G.phase="move";G.msg="";SND.ok();render();toast("Move unlocked: move ONE piece.","ok")}
 else if(a=="just"&&G.phase=="read"&&running()&&teacher()){G.phase="move";G.msg="";render();toast("Teacher: move one piece.")}
 else if(a=="again"&&G.phase=="read"&&running())say("Try again. Read the sentence once more.","err");
 else if(a=="skip"&&G.phase=="read"&&running()){drawCard();G.msg="New card. No point for skipping.";G.msgc="";render()}
 else if(a=="pass"&&(G.phase=="stuck"||(G.phase=="move"&&canMove()))){G.s={...G.s,t:G.s.t=="w"?"b":"w",ep:-1};G.sel=null;G.targets=[];beginTurn()}
 else if(a=="newpos"&&G.phase=="stuck"){const t=G.s.t;G.s=parseFen(START);G.s.t=t;G.last=null;buildBoard();beginTurn()}
 else if(a=="hl"){G.hl=!G.hl;render()}}

/* ================= MOVES ================= */
function pickMove(to){
 const ms=G.targets.filter(m=>m.to==to);if(!ms.length)return false;
 if(ms.length>1){const t=G.s.t;$("promo").innerHTML="<div>"+["Q","R","B","N"].map(k=>`<button data-pr="${k}" aria-label="Promote to ${NAMES[k]}">${pcSvg(t+k)}</button>`).join("")+"</div>";$("promo").className="on";G.pm=ms}
 else doMove(ms[0]);return true}
function select(sq){G.sel=sq;G.targets=legal(G.s).filter(m=>m.from==sq);const p=G.s.b[sq];say(NAMES[p[1]].toUpperCase()+" SELECTED","");paint()}
function doMove(mv){
 if(!canMove())return;G.anim=true;
 const t=G.s.t,pe=PE[mv.from],cs=mv.ep?mv.to+(t=="w"?8:-8):mv.to,ce=mv.cap?PE[cs]:null;
 G.sel=null;G.targets=[];G.last={from:mv.from,to:mv.to};$("promo").className="";
 if(ce)ce.classList.add("cap");pos(pe,mv.to);
 let re=null,rf,rt;if(mv.castle){rf=mv.castle=="K"?mv.to+1:mv.to-2;rt=mv.castle=="K"?mv.to-1:mv.to+1;re=PE[rf];pos(re,rt)}
 paint();(mv.cap?SND.cap:SND.move)();
 setTimeout(()=>{
  if(ce){ce.remove();delete PE[cs]}
  delete PE[mv.from];PE[mv.to]=pe;if(re){delete PE[rf];PE[rt]=re}
  if(mv.promo)pe.innerHTML=pcSvg(t+mv.promo);
  G.s=make(G.s,mv);
  if(mv.cap){const P=G.P[t];P.caps.push(mv.cap);G.fresh=t;if(G.bonus)P.cb+=VAL[mv.cap[1]]||0}
  G.anim=false;G.msg="";
  if(G.pend){G.pend=false;endGame();return}
  beginTurn()},reduce?0:(ce?420:300))}

/* pointer input: click-select, click-move, drag-and-drop */
let drag=null;
const sqAt=e=>{const r=$("sqs").getBoundingClientRect(),f=Math.floor((e.clientX-r.left)/r.width*8),rw=Math.floor((e.clientY-r.top)/r.height*8);return f<0||f>7||rw<0||rw>7?null:rw*8+f};
$("board").addEventListener("pointerdown",e=>{
 if(e.target.closest("#promo,#read"))return;const sq=sqAt(e);if(sq==null)return;
 if(!canMove()){if(G.phase=="read"&&running())say("Read the sentence first!","err");return}
 if(G.sel!=null&&G.targets.some(m=>m.to==sq)){pickMove(sq);return}
 const p=G.s.b[sq];
 if(p&&p[0]==G.s.t){select(sq);drag={sq,x:e.clientX,y:e.clientY,el:PE[sq],moved:false};try{$("board").setPointerCapture(e.pointerId)}catch(_){}}
 else{G.sel=null;G.targets=[];paint();if(G.sel==null&&!p)say("Move unlocked: move ONE piece.","ok")}});
$("board").addEventListener("pointermove",e=>{
 if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(!drag.moved&&Math.hypot(dx,dy)>6){drag.moved=true;drag.el.classList.add("drag")}
 if(drag.moved)drag.el.style.transform=`translate(${dx}px,${dy}px)`});
$("board").addEventListener("pointerup",e=>{
 if(!drag)return;const d=drag;drag=null;d.el.classList.remove("drag");d.el.style.transform="";
 if(d.moved){const to=sqAt(e);if(to!=null&&to!=d.sq&&!pickMove(to))say("That move is not allowed. Try another square.","err")}});
$("board").addEventListener("pointercancel",()=>{if(drag){drag.el.classList.remove("drag");drag.el.style.transform="";drag=null}});

/* ================= OVERLAYS ================= */
const ov=h=>{$("ov").innerHTML=`<div class="card">${h}</div>`;$("ov").className="ov on"};
const closeOv=()=>{$("ov").className="ov";$("ov").innerHTML=""};
function settings(){
 ov(`<h2>MATCH SETTINGS</h2>
 <div class="seg" role="group" aria-label="Mode"><button data-m="pvp" class="${G.mode=="pvp"?"on":""}">Player vs Player</button><button data-m="tvs" class="${G.mode=="tvs"?"on":""}">Student vs Teacher</button></div>
 <label>White — Player 1<input type="text" id="n1" maxlength="20" value="${esc(G.n[0])}"></label>
 <label>Black — Player 2<input type="text" id="n2" maxlength="20" value="${esc(G.n[1])}"></label>
 <div>Timer (maximum 5 minutes)</div><div class="seg" role="group" aria-label="Timer">${[1,2,3,4,5].map(m=>`<button data-t="${m}" class="${G.dur==m*60?"on":""}">${m} min</button>`).join("")}</div>
 <div class="seg"><button data-tg="bonus" class="${G.bonus?"on":""}">Capture bonus: ${G.bonus?"ON":"OFF"}</button><button data-tg="hl" class="${G.hl?"on":""}">Highlight: ${G.hl?"ON":"OFF"}</button></div>
 <details><summary>Edit sentences (${BANK.length} cards)</summary><p class="msg">One per line: <b>sentence | pattern</b>. Patterns: ape ane ame ake ave ate ite ipe ine ime ive ike ide one oke ose ole u ai ay ee</p>
 <textarea id="bank" rows="8" spellcheck="false">${esc(BANK.map(b=>b.t+"|"+b.tags.join(" ")).join("\n"))}</textarea>
 <div class="row"><button data-a="bapply">Apply sentences</button><button data-a="breset">Reset to default</button></div><div class="msg" id="bmsg"></div></details>
 <div class="row"><button class="pri" data-a="apply">Apply &amp; new match</button><button data-a="closeov">Cancel</button></div>`)}
function results(){
 const a=G.P.w,b=G.P.b,ta=a.rp+a.cb,tb=b.rp+b.cb,col=(c,p,n)=>`<div class="pn"><div class="pt"><i class="dot ${c}"></i><b>${esc(n)}</b></div><div class="tot"><span>TOTAL</span><b>${p.rp+p.cb}</b></div><div class="kv"><span>Reading points</span><b>${p.rp}</b></div><div class="kv"><span>Capture bonus</span><b>${p.cb}</b></div><div class="kv"><span>Correct readings</span><b>${p.reads}</b></div><div class="kv"><span>Pieces captured</span><b>${p.caps.length}</b></div></div>`;
 ov(`<h2>MATCH RESULT</h2><div class="win">${ta==tb?"DRAW":esc(G.n[ta>tb?0:1])+" WINS!"}</div><div class="res">${col("w",a,G.n[0])}${col("b",b,G.n[1])}</div>
 <div class="row"><button class="pri" data-a="again2">PLAY AGAIN</button><button data-a="timer">CHANGE TIMER</button><button data-a="restart2">RESTART MATCH</button><button data-a="closeov">BACK TO BOARD</button></div>`)}
function info(){ov(`<h2>PIECE GUIDE</h2><div class="leg">${["K","Q","R","B","N","P"].map(k=>`<div>${pcSvg("w"+k)}<div>${NAMES[k]}</div></div>`).join("")}</div><p class="msg">Standard chess rules: check, checkmate, castling, en passant and pawn promotion. Capture bonus: Pawn +1, Knight +2, Bishop +2, Rook +3, Queen +4.</p><div class="row"><button data-a="closeov">Close</button></div>`)}

/* ================= EVENTS ================= */
document.addEventListener("click",e=>{
 const pr=e.target.closest("[data-pr]");if(pr&&G.pm){const m=G.pm.find(x=>x.promo==pr.dataset.pr);G.pm=null;if(m)doMove(m);return}
 const b=e.target.closest("button");if(!b||b.disabled)return;const d=b.dataset,a=d.a;
 if(d.m){G.mode=d.m;if(d.m=="tvs"&&$("n2").value.trim().toUpperCase()=="PLAYER 2")$("n2").value="TEACHER";if(d.m=="pvp"&&$("n2").value.trim().toUpperCase()=="TEACHER")$("n2").value="PLAYER 2";const n1=$("n1").value,n2=$("n2").value;G.n=[n1,n2];settings();return}
 if(d.t){G.dur=+d.t*60;G.n=[$("n1").value,$("n2").value];settings();return}
 if(d.tg){G[d.tg]=!G[d.tg];G.n=[$("n1").value,$("n2").value];settings();return}
 switch(a){
  case"go":startPause();break;
  case"restart":case"restart2":closeOv();resetGame();break;
  case"again2":closeOv();resetGame();startPause();break;
  case"timer":case"set":settings();break;
  case"end":if(G.phase!="idle")endGame();break;
  case"results":results();break;
  case"snd":G.snd=!G.snd;$("bSnd").textContent="Sound: "+(G.snd?"on":"off");break;
  case"info":info();break;
  case"closeov":closeOv();break;
  case"apply":{const n1=$("n1").value.trim().slice(0,20)||"PLAYER 1",n2=$("n2").value.trim().slice(0,20)||"PLAYER 2";G.n=[n1,n2];closeOv();resetGame();break}
  case"bapply":{const r=parseBank($("bank").value);if(r.out.length<1){$("bmsg").textContent="Need at least one valid line.";break}BANK=r.out;$("bmsg").textContent=`${r.out.length} cards ready. ${r.bad?r.bad+" invalid line(s) ignored.":""}`;break}
  case"breset":{BANK=parseBank(DEFAULT_BANK).out;$("bank").value=BANK.map(b=>b.t+"|"+b.tags.join(" ")).join("\n");$("bmsg").textContent="Default sentences restored.";break}
  default:action(a)}});
setInterval(tick,200);
resetGame();settings();
</script></body></html>
