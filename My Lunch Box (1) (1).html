<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>My Lunch Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fff4e4;--ink:#3d2f5c;--muted:#7d6f9c;--card:#ffffff;
  --coral:#ff7a8a;--mint:#5fcfa8;--sky:#62b3ee;--sun:#ffd35c;--lilac:#b7a0f7;--peach:#ffb48a;
  --good:#3cbf8a;--bad:#ff6b7a;--line:#5a3a4e;
  --font:'Fredoka','Trebuchet MS','Comic Sans MS','Segoe UI',sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:var(--font);font-weight:500;font-size:19px;line-height:1.35;color:var(--ink);overflow-x:hidden;
  background:
   radial-gradient(circle at 12% 8%,#ffd9e3 0,transparent 38%),radial-gradient(circle at 92% 12%,#d9ecff 0,transparent 36%),
   radial-gradient(circle at 80% 95%,#d9f6e9 0,transparent 40%),radial-gradient(circle at 6% 92%,#fff0b8 0,transparent 34%),var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(#ffffff 2px,transparent 2.5px);background-size:34px 34px}
#app{position:relative;max-width:1320px;margin:0 auto;padding:14px 18px 40px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
h1,h2,h3{margin:0;line-height:1.1}
.screen{display:none}.screen.active{display:block;animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:28px;padding:22px;box-shadow:0 8px 0 rgba(90,58,78,.12),0 14px 34px rgba(90,58,78,.14);border:3px solid #fff}
.btn{font-weight:700;font-size:1.2rem;border:0;border-radius:20px;padding:14px 28px;min-height:56px;color:#fff;background:var(--coral);box-shadow:0 6px 0 #d9566a;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d9566a}
.btn.green{background:var(--mint);box-shadow:0 6px 0 #34a483}.btn.green:active{box-shadow:0 2px 0 #34a483}
.btn.blue{background:var(--sky);box-shadow:0 6px 0 #3d8cc9}.btn.blue:active{box-shadow:0 2px 0 #3d8cc9}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 6px 0 #d9ac2a}.btn.sun:active{box-shadow:0 2px 0 #d9ac2a}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d8cfee;border:3px solid #e6ddfa}
.btn.small{font-size:1rem;padding:8px 16px;min-height:42px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{justify-content:center;text-align:center}
.gear{position:fixed;right:max(12px,env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top,0px));z-index:30;width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.8);box-shadow:0 4px 12px rgba(90,58,78,.2);display:grid;place-items:center;opacity:.7}
.gear:hover{opacity:1}

/* START */
.start-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:22px;align-items:center;min-height:calc(100vh - 70px)}
@media(max-width:940px){.start-grid{grid-template-columns:1fr;min-height:0}}
.hero{position:relative;text-align:center}
.title{font-size:clamp(2.6rem,8vw,5.2rem);font-weight:700;letter-spacing:.01em;color:var(--coral);text-shadow:0 5px 0 #fff,0 9px 0 rgba(90,58,78,.18)}
.title span{display:inline-block;animation:wob 3s ease-in-out infinite}
.title span:nth-child(2n){color:var(--sky)}.title span:nth-child(3n){color:var(--mint)}.title span:nth-child(5n){color:#ffb400}
@keyframes wob{50%{transform:translateY(-6px) rotate(-3deg)}}
.subtitle{font-size:clamp(1.2rem,3vw,1.7rem);color:var(--muted);margin:6px 0 10px}
.hero-box{position:relative;width:min(100%,520px);margin:0 auto}
.floaty{position:absolute;width:15%;animation:bob 3.2s ease-in-out infinite}
.floaty svg{width:100%;height:auto;filter:drop-shadow(0 4px 0 rgba(90,58,78,.15))}
@keyframes bob{50%{transform:translateY(-12px) rotate(6deg)}}
.setup h2{font-size:1.7rem;margin-bottom:10px}
.count-pick{display:flex;gap:10px;margin:8px 0 14px}
.count-pick button{flex:1;font-size:1.3rem;font-weight:700;border-radius:18px;border:3px solid #e6ddfa;background:#fff;padding:10px 6px;min-height:58px}
.count-pick button.sel{border-color:var(--sky);background:#e6f3ff;box-shadow:0 4px 0 #b8dcf8}
.pcards{display:grid;gap:12px}
.pcard{border-radius:22px;padding:12px 14px;border:3px solid var(--pc);background:color-mix(in srgb,var(--pc) 10%,#fff)}
.pcard .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pcard .nm{flex:1 1 150px;min-width:0;font:600 1.2rem var(--font);padding:10px 14px;border-radius:14px;border:3px solid #fff;background:#fff;color:var(--ink)}
.seg{display:flex;gap:6px}
.seg button{border:3px solid #fff;background:#fff;border-radius:14px;padding:8px 14px;font-weight:700;font-size:1rem;min-height:44px}
.seg button.sel{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 25%,#fff)}
.avs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.avs button{width:64px;height:64px;padding:2px;border-radius:50%;border:4px solid #fff;background:#fff}
.avs button.sel{border-color:var(--pc);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 40%,#fff)}
.avs svg{width:100%;height:100%;display:block}
.avatar{width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid var(--pc);flex:none;overflow:hidden}
.avatar svg{width:100%;height:100%;display:block}

/* BUILD */
.turnbar{display:flex;align-items:center;gap:12px;margin:2px 0 14px;flex-wrap:wrap;padding-right:56px}
.turnchip{display:flex;align-items:center;gap:10px;padding:6px 18px 6px 8px;border-radius:99px;background:#fff;border:3px solid var(--pc);box-shadow:0 4px 0 color-mix(in srgb,var(--pc) 40%,#fff);font-weight:700;font-size:1.25rem}
.turnchip .avatar{width:44px;height:44px;border-width:2px}
.dots{display:flex;gap:6px}.dots i{width:14px;height:14px;border-radius:50%;background:#e6ddfa}.dots i.done{background:var(--mint)}.dots i.cur{background:var(--coral);transform:scale(1.25)}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:700px){.split{grid-template-columns:1fr}.split>.card:nth-child(2){order:-1}}
@media(min-width:701px){.split>.card:nth-child(2){position:sticky;top:12px}}
@media(max-width:1100px){.split{gap:12px}.split>.card{padding:16px}}
.q-head{font-size:clamp(1.5rem,3.2vw,2.1rem);font-weight:700;color:var(--ink);margin-bottom:10px}
.inrow{display:flex;gap:10px;flex-wrap:wrap}
.inrow input{flex:1 1 200px;min-width:0;font:600 1.5rem var(--font);padding:14px 18px;border-radius:20px;border:4px solid var(--sky);background:#f7fbff;color:var(--ink)}
.inrow input::placeholder{color:#b3b0cc}
.inrow .btn{flex:none}
.pulse{animation:pls .8s ease-in-out infinite}
@keyframes pls{50%{box-shadow:0 6px 0 #34a483,0 0 0 10px rgba(95,207,168,.45)}}
.msg{min-height:3.1em;margin:10px 0;padding:10px 14px;border-radius:18px;font-size:1.15rem;font-weight:600;display:flex;align-items:center;gap:10px}
.msg.ok{background:#e1f8ee;color:#1f7a58}.msg.bad{background:#ffe4e7;color:#b8394a}.msg.info{background:#eef4ff;color:#4a5f9a}
.chooser{display:none;gap:10px;margin:10px 0;padding:12px;border-radius:20px;background:#fff8dc;border:3px dashed var(--sun);animation:in .3s ease both}
.chooser.show{display:grid}
.chooser .pic{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.2rem}
.chooser .pic svg{width:50px;height:50px}
.chooser .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.chooser .two{grid-template-columns:1fr}}
.foods{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
.foods.nolab .fbtn{min-height:0;aspect-ratio:1;justify-content:center;padding:6px}
.foods.nolab .fbtn svg{width:100%;height:100%;max-width:86px;max-height:86px}
@media(max-width:1100px){.foods{grid-template-columns:repeat(4,1fr);gap:8px}.fbtn svg{width:54px;height:54px}.fbtn b{font-size:.92rem}}
@media(max-width:520px){.foods{grid-template-columns:repeat(3,1fr)}}
.fbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border-radius:20px;border:3px solid #eee6ff;background:#fff;box-shadow:0 4px 0 #e6ddfa;transition:transform .12s;min-height:110px}
.fbtn:hover{transform:translateY(-3px)}
.fbtn svg{width:64px;height:64px;pointer-events:none}
.fbtn b{font-size:1.02rem;line-height:1.1;text-align:center}
.fbtn.sel{border-color:var(--sun);background:#fff8dc;transform:scale(1.05)}
.fbtn.has{border-color:var(--good);background:#eafaf2}
.fbtn.no{border-color:var(--bad);background:#fff0f2}
.fbtn .mk{position:absolute;top:-8px;right:-6px;width:28px;height:28px;border-radius:50%;display:none;place-items:center;color:#fff;font-weight:700;border:3px solid #fff;font-size:.95rem}
.fbtn.has .mk{display:grid;background:var(--good)}.fbtn.no .mk{display:grid;background:var(--bad)}
.right-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.right-h h2{font-size:clamp(1.4rem,3vw,2rem)}
.slist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;max-height:230px;overflow:auto}
.slist li{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:14px;background:#f6f2ff;font-weight:600;font-size:1.08rem}
.slist li.no{background:#fff0f2}
.slist .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.8rem;flex:none;background:var(--good)}
.slist li.no .ic{background:var(--bad)}
.slist .t{flex:1}
.slist.compact{max-height:none;font-size:.95rem}
.xbtn,.spk{border:0;background:transparent;border-radius:10px;padding:4px;display:grid;place-items:center;min-width:32px;min-height:32px}
.xbtn:hover,.spk:hover{background:rgba(0,0,0,.08)}
.empty-note{color:var(--muted);font-weight:500;padding:6px 2px}

/* LUNCH BOX */
.lb{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:4/3;filter:drop-shadow(0 8px 0 rgba(90,58,78,.12))}
.lb-svg{position:absolute;inset:0;width:100%;height:100%}
.tray{position:absolute;left:10%;top:34.5%;width:80%;height:56.5%;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:0.8%}
.fd{width:calc(var(--s,.3)*100% - 1%);aspect-ratio:1;transition:width .45s cubic-bezier(.3,1.4,.5,1);position:relative}
.fd svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 0 rgba(90,58,78,.14))}
.fd.pop{animation:popin .6s cubic-bezier(.2,1.7,.4,1) both}
.fd.incoming{visibility:hidden}
.fd.poof{animation:poof .45s ease-in both}
@keyframes popin{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
@keyframes poof{to{transform:scale(0) rotate(30deg);opacity:0}}
.lb.look{animation:look .7s ease-in-out 3}
@keyframes look{50%{transform:scale(1.04);filter:drop-shadow(0 0 22px #ffd35c)}}
.flyer{position:fixed;z-index:80;pointer-events:none}
.flyer svg{width:100%;height:100%}
.empty-lb{position:absolute;left:10%;top:34.5%;width:80%;height:56.5%;display:grid;place-items:center;text-align:center;color:#c2b7d9;font-weight:600;font-size:1.1rem;pointer-events:none}

/* PASS */
.pass{max-width:620px;margin:6vh auto 0;text-align:center}
.pass .avatar{width:150px;height:150px;margin:0 auto 12px;border-width:6px}
.pass h2{font-size:clamp(1.8rem,5vw,2.8rem);margin-bottom:8px}

/* RESULTS */
.res-title{font-size:clamp(2rem,6vw,3.6rem);text-align:center;font-weight:700;color:var(--coral);text-shadow:0 4px 0 #fff,0 7px 0 rgba(90,58,78,.15);margin:0 0 14px;padding:0 50px}
.rgrid{display:grid;gap:16px;margin-bottom:18px}
.rgrid.n1{grid-template-columns:minmax(0,640px);justify-content:center}
.rgrid.n2{grid-template-columns:1fr 1fr}
.rgrid.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1000px){.rgrid.n3{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.rgrid.n2,.rgrid.n3{grid-template-columns:1fr}}
.rcard{border:4px solid var(--pc)}
.rcard .rh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.rcard .rh h3{font-size:1.5rem;flex:1}

/* TALK */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding-right:56px}
.tab{border:3px solid #fff;background:rgba(255,255,255,.7);border-radius:18px;padding:10px 20px;font-weight:700;font-size:1.15rem;min-height:50px}
.tab.sel{background:#fff;border-color:var(--sky);box-shadow:0 5px 0 #b8dcf8}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chips .lab{font-weight:700;color:var(--muted)}
.pchip{display:flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:99px;border:3px solid #fff;background:rgba(255,255,255,.75);font-weight:700;font-size:1.05rem}
.pchip .avatar{width:36px;height:36px;border-width:2px}
.pchip.sel{border-color:var(--pc);background:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--pc) 40%,#fff)}
.talk-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:760px){.talk-grid{grid-template-columns:1fr}}
.who-h{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:6px}
.who-h h2{font-size:clamp(1.6rem,3.6vw,2.4rem)}
.bigq{font-size:clamp(1.8rem,4.4vw,2.9rem);font-weight:700;color:var(--coral);text-align:center;margin:2px 0 8px}
.starters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 12px}
.starter{padding:6px 14px;border-radius:99px;background:#eef4ff;border:2px dashed var(--sky);font-weight:600;font-size:1.02rem;color:#3f6aa8}
.answers{display:grid;gap:10px;margin:8px 0}
.ans{font:700 1.3rem var(--font);text-align:left;padding:14px 18px;border-radius:20px;border:4px solid #e6ddfa;background:#fff;box-shadow:0 5px 0 #e6ddfa;min-height:62px;transition:transform .12s}
.ans:hover:not(:disabled){transform:translateY(-2px);border-color:var(--sky)}
.ans.right{border-color:var(--good);background:#e1f8ee;box-shadow:0 5px 0 #a5e2c8}
.ans.wrong{border-color:var(--bad);background:#ffe4e7;box-shadow:0 5px 0 #ffc2c9;animation:shk .4s}
.ans:disabled{cursor:default}
@keyframes shk{25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
.fb{min-height:2.4em;text-align:center;font-weight:700;font-size:1.5rem;margin:6px 0}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}.fb.look{color:#d98e00}
.say-h{font-weight:700;color:var(--muted);margin:12px 0 6px}
.say{display:grid;gap:6px}
.sayb{display:flex;gap:8px;align-items:center;text-align:left;border:3px solid #e6ddfa;background:#fff;border-radius:16px;padding:8px 12px;font:600 1.12rem var(--font)}
.sayb:hover{border-color:var(--lilac)}
.cmp-boxes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.cmp-boxes{grid-template-columns:1fr}}
.cmp-sec{margin-top:14px}
.cmp-sec h3{font-size:1.25rem;margin-bottom:8px;color:var(--ink)}
.frame{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:16px;background:#fff8dc;border:3px dashed var(--sun);margin-bottom:8px;font-weight:600;font-size:1.15rem}
.blank{display:inline-block;min-width:90px;border-bottom:4px solid var(--ink);text-align:center;font-weight:700;color:var(--coral)}
.stars{font-weight:700;font-size:1.1rem;background:#fff;border-radius:99px;padding:6px 14px;border:3px solid var(--sun)}

/* MODAL */
#modal{position:fixed;inset:0;z-index:90;background:rgba(61,47,92,.5);display:none;place-items:center;padding:14px;overflow:auto}
#modal.open{display:grid}
#modalBox{max-width:560px;width:100%}
.menu h2{font-size:1.5rem;margin-bottom:6px}
.menu .sec{margin:12px 0;padding-top:10px;border-top:2px dashed #e6ddfa}
.menu .sec>b{display:block;margin-bottom:6px;color:var(--muted);font-size:.95rem;text-transform:uppercase;letter-spacing:.04em}
.menu input[type=text]{font:600 1.05rem var(--font);padding:8px 12px;border-radius:12px;border:3px solid #e6ddfa;width:100%;margin-bottom:6px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600}
.toggle input{width:26px;height:26px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <button class="gear" id="btnGear" aria-label="Teacher menu" title="Teacher menu">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3d2f5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>

  <!-- START -->
  <section id="s-start" class="screen active">
    <div class="start-grid">
      <div class="hero">
        <h1 class="title" id="title" aria-label="My Lunch Box"></h1>
        <div class="subtitle">What's in your lunch box?</div>
        <div class="hero-box" id="heroBox"></div>
      </div>
      <div class="card setup">
        <h2>Who is playing?</h2>
        <div class="count-pick" id="countPick" role="group" aria-label="Number of students"></div>
        <div class="pcards" id="pcards"></div>
        <div class="row center" style="margin-top:16px"><button class="btn green" id="btnStart" style="font-size:1.5rem;padding:16px 38px">Let's Start!</button></div>
      </div>
    </div>
  </section>

  <!-- BUILD -->
  <section id="s-build" class="screen">
    <div class="turnbar" id="turnbar"></div>
    <div class="split">
      <div class="card">
        <h2 class="q-head">What do you have in your lunch box?</h2>
        <div class="inrow">
          <input id="sIn" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="I have a banana." aria-label="Type your sentence">
          <button class="btn green" id="btnAdd">Add to my lunch box</button>
        </div>
        <div class="msg info" id="msg">Type a sentence, or click a food below!</div>
        <div class="chooser" id="chooser"></div>
        <div class="foods" id="foods"></div>
      </div>
      <div class="card">
        <div class="right-h"><span class="avatar" id="rAv"></span><h2 id="rName"></h2></div>
        <div class="lb" id="lbMain"></div>
        <ul class="slist" id="sList" aria-label="My sentences"></ul>
        <div class="row center" style="margin-top:14px">
          <button class="btn ghost small" id="btnClearBox">Start again</button>

(function(){
"use strict";
/*ENGINE_START*/
/* ====================== FOOD DATA ====================== */
/* t: 'a' = a + noun, 'an' = an + noun, 'u' = uncountable (no article), 'p' = plural (no article) */
const FOODS=[
 {id:"chicken",label:"Chicken",t:"u",al:["chicken","chickens"]},
 {id:"meatballs",label:"Meatballs",t:"p",al:["meatballs","meatball"]},
 {id:"soup",label:"Soup",t:"u",al:["soup"]},
 {id:"banana",label:"Banana",t:"a",al:["banana","bananas"]},
 {id:"tomato",label:"Tomato",t:"a",al:["tomato","tomatoes","tomatos"]},
 {id:"sandwich",label:"Sandwich",t:"a",al:["sandwich","sandwiches","sandwitch","sandwhich"]},
 {id:"chips",label:"Chips",t:"p",al:["chips","chip","fries"]},
 {id:"rice",label:"Rice",t:"u",al:["rice"]},
 {id:"egg",label:"Egg",t:"an",al:["egg","eggs"]},
 {id:"noodles",label:"Noodles",t:"p",al:["noodles","noodle"]},
 {id:"cheese",label:"Cheese",t:"u",al:["cheese"]},
 {id:"salad",label:"Salad",t:"a",al:["salad","salads"]},
 {id:"juice",label:"Juice",t:"u",al:["juice"]},
 {id:"bread",label:"Bread",t:"u",al:["bread"]},
 {id:"olives",label:"Olives",t:"p",al:["olives","olive"]},
 {id:"pizza",label:"Pizza",t:"a",al:["pizza","pizzas"]},
 {id:"icecream",label:"Ice cream",t:"an",al:["icecream","icecreams"]},
 {id:"cereal",label:"Cereal",t:"u",al:["cereal","cereals"]},
 {id:"biscuits",label:"Biscuits",t:"p",al:["biscuits","biscuit","cookie","cookies"]},
 {id:"yoghurt",label:"Yoghurt",t:"u",al:["yoghurt","yogurt","yogourt","yoghourt"]}
];
const FBY={};FOODS.forEach(f=>FBY[f.id]=f);
const low=f=>f.label.toLowerCase();
const art=f=>f.t==="a"?"a ":f.t==="an"?"an ":"";
/* "I have a banana." / "I don't have rice." */
function sentenceFor(id,has){const f=FBY[id];return"I "+(has?"have ":"don't have ")+art(f)+low(f)+"."}
/* "a banana" / "some rice"  (positive: has got ...) */
function gotPos(id){const f=FBY[id];return(f.t==="a"||f.t==="an")?art(f)+low(f):"some "+low(f)}
/* "a banana" / "any rice"  (hasn't got ... / Has she got ...?) */
function gotAny(id){const f=FBY[id];return(f.t==="a"||f.t==="an")?art(f)+low(f):"any "+low(f)}
const PRON={girl:{s:"she",S:"She",o:"her"},boy:{s:"he",S:"He",o:"him"}};

/* ====================== SENTENCE PARSER ====================== */
const STOP=new Set(["i","a","an","some","any","and","the","my","have","has","got","dont","don't","do","not","no","in","lunch","box","lunchbox","also","too","with","is","am","it","hav","ive","i've","but","please","there","of","for","we","he","she","never","havent","haven't","hasnt","hasn't","much","many","lots","little","big","small","nice","yummy","good","favourite","favorite"]);
const NEG=new Set(["dont","don't","not","no","never","havent","haven't","hasnt","hasn't","doesnt","doesn't"]);
const HAVE=new Set(["have","has","hav","hve","ive","i've","got"]);
const ALIAS={};FOODS.forEach(f=>f.al.forEach(a=>{ALIAS[a]=f.id}));
const BIGRAM={"ice cream":"icecream","ice creams":"icecream","meat balls":"meatballs","meat ball":"meatballs","french fries":"chips"};
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d[i]=[i]}for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function matchFood(tok){
  if(ALIAS[tok])return ALIAS[tok];
  if(STOP.has(tok)||tok.length<4)return null;
  const lim=tok.length>=7?2:1;let best=null,bd=9;
  for(const a in ALIAS){if(a.length<4)continue;const d=lev(tok,a);if(d<=lim&&d<bd){bd=d;best=ALIAS[a]}}
  return best;
}
function parseSentence(text){
  let s=String(text).toLowerCase().replace(/[’`]/g,"'").replace(/-/g," ").replace(/[^a-z', ;.!?]/g," ");
  const clauses=s.split(/[,;.!?]|\bbut\b|\band\s+(?=i\b)/).map(c=>c.trim()).filter(Boolean);
  const items=[];let pol=null,unknown=[],unclear=false;
  clauses.forEach(c=>{
    let toks=c.split(/\s+/).filter(Boolean);
    const neg=toks.some(t=>NEG.has(t)),hv=toks.some(t=>HAVE.has(t)||t.replace(/'/g,"")==="ive");
    if(neg)pol=false;else if(hv)pol=true;
    /* merge bigrams */
    const t2=[];for(let i=0;i<toks.length;i++){const bg=toks[i]+" "+toks[i+1];if(BIGRAM[bg]){t2.push(BIGRAM[bg]);i++}else t2.push(toks[i])}
    t2.forEach(t=>{
      const id=ALIAS[t]&&FBY[ALIAS[t]]?ALIAS[t]:(FBY[t]?t:matchFood(t));
      if(id){if(pol===null)unclear=true;else items.push({food:id,has:pol})}
      else if(!STOP.has(t))unknown.push(t);
    });
  });
  if(!items.length){
    if(unclear)return{ok:false,code:"unclear",msg:"Start with “I have …” or “I don't have …”. Try: I have a banana."};
    if(!clauses.length)return{ok:false,code:"empty",msg:"Type a sentence or click a food! Try: I have a banana."};
    return{ok:false,code:"unknown",msg:"Hmm, I don't know "+(unknown[0]?"“"+unknown[0]+"”":"that food")+" yet. Try: banana, rice, chicken, pizza…"};
  }
  /* de-duplicate inside one sentence (last one wins) */
  const seen=new Map();items.forEach(it=>seen.set(it.food,it.has));
  return{ok:true,items:[...seen].map(([food,has])=>({food,has}))};
}

/* ====================== LUNCH BOX STATE ====================== */
/* A box keeps an ordered list of statements: [{food, has}] (one per food, latest wins) */
function applyStatement(box,food,has){
  const old=box.find(x=>x.food===food);
  const changed=!old||old.has!==has;
  const i=box.findIndex(x=>x.food===food);if(i>-1)box.splice(i,1);
  box.push({food,has});
  return{changed,wasIn:!!(old&&old.has),nowIn:has};
}
const foodsIn=box=>box.filter(x=>x.has).map(x=>x.food);
const foodsOut=box=>FOODS.map(f=>f.id).filter(id=>!foodsIn(box).includes(id));
function trayScale(n){
  for(let s=.42;s>=.1;s-=.01){const cols=Math.floor(1/s),rows=Math.ceil(n/cols);if(rows*s<=.5)return +s.toFixed(2)}
  return .1;
}

/* ====================== DISCUSSION ENGINE ====================== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* sentence about player P having food */
const hasGot=(p,id)=>PRON[p.gender].S+" has got "+gotPos(id)+".";
function makeQuestion(p,others,kind,avoidFood){
  const F=foodsIn(p.box),N=foodsOut(p.box),P=PRON[p.gender];
  if(kind==="what"&&F.length){
    const pool=F.filter(f=>f!==avoidFood);const f=(pool.length?shuffle(pool):shuffle(F))[0];
    const otherFoods=[];others.forEach(o=>foodsIn(o.box).forEach(x=>{if(N.includes(x)&&!otherFoods.includes(x))otherFoods.push(x)}));
    const rest=shuffle(N.filter(x=>!otherFoods.includes(x)));
    const dis=shuffle(otherFoods).concat(rest).slice(0,2);
    const opts=shuffle([{t:hasGot(p,f),ok:true,food:f}].concat(dis.map(x=>({t:hasGot(p,x),ok:false,food:x}))));
    return{kind:"what",text:"What has "+P.s+" got?",options:opts,food:f,model:hasGot(p,f)};
  }
  /* yes/no */
  let g;
  const wantYes=Math.random()<.5;
  if((wantYes&&F.length)||!N.length)g=shuffle(avoidFood?F.filter(x=>x!==avoidFood).concat(F.length?[]:F):F)[0]||F[0];
  else g=shuffle(N)[0];
  if(!g)return null;
  const yes=F.includes(g);
  return{kind:"yn",text:"Has "+P.s+" got "+gotAny(g)+"?",options:[{t:"Yes, "+P.s+" has.",ok:yes},{t:"No, "+P.s+" hasn't.",ok:!yes}],food:g,
    model:yes?"Yes, "+P.s+" has. "+hasGot(p,g):"No, "+P.s+" hasn't."};
}
/* subject words for comparing: pronouns if different genders, names if the same */
function subj(a,b,cap){
  if(a.gender!==b.gender)return cap?PRON[a.gender].S:PRON[a.gender].s;
  return a.name;
}
function compareData(a,b){
  const A=foodsIn(a.box),B=foodsIn(b.box);
  return{aOnly:A.filter(x=>!B.includes(x)),bOnly:B.filter(x=>!A.includes(x)),both:A.filter(x=>B.includes(x))};
}
function compareSentences(a,b){
  const d=compareData(a,b),sa=subj(a,b,true),sb=subj(b,a,false);
  const sA=subj(b,a,true);
  const out=[];
  d.aOnly.forEach(f=>out.push({kind:"diff",t:sa+" has got "+gotPos(f)+", but "+sb+" hasn't got "+gotAny(f)+"."}));
  d.bOnly.forEach(f=>out.push({kind:"diff",t:sA+" has got "+gotPos(f)+", but "+subj(a,b,false)+" hasn't got "+gotAny(f)+"."}));
  d.both.forEach(f=>out.push({kind:"same",t:sa+" has got "+gotPos(f)+" and "+sb+" has got "+gotPos(f)+" too."}));
  return out;
}

/* sound */
let AC=null;
function tone(f,d,type,t0,v){if(!G.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(t0||0);o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+(d||.15));o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(d||.15)+.03)}catch(e){}}
const sfx={pop(){tone(520,.1,"triangle");tone(780,.14,"triangle",.08)},poof(){tone(400,.12,"sine");tone(240,.16,"sine",.08)},ok(){tone(660,.12,"triangle");tone(880,.12,"triangle",.1);tone(1100,.16,"triangle",.2)},bad(){tone(200,.2,"sawtooth",0,.04)},click(){tone(460,.06,"square",0,.03)},fin(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,"triangle",i*.1))}};
function speak(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}

function renderList(sel,p,editable){

/* tray: keeps one element per food so animations work */
function syncTray(tray,ids,incoming,animate){
  const have=new Map();[...tray.children].forEach(el=>have.set(el.dataset.f,el));
  have.forEach((el,id)=>{if(!ids.includes(id)){if(animate){el.classList.add("poof");setTimeout(()=>el.remove(),420)}else el.remove()}});
  ids.forEach(id=>{
    if(have.has(id)&&!have.get(id).classList.contains("poof"))return;
    const d=document.createElement("div");d.className="fd"+(incoming.includes(id)?" incoming":"");d.dataset.f=id;d.innerHTML=foodSVG(id);tray.appendChild(d);
  });
  tray.style.setProperty("--s",trayScale(Math.max(ids.length,1)));
  let em=tray.parentElement.querySelector(".empty-lb");
  if(!ids.length){if(!em){em=document.createElement("div");em.className="empty-lb";em.textContent="Your lunch box is empty. Add some food!";tray.parentElement.appendChild(em)}}else if(em)em.remove();
}
function flyIn(id,delay){
  const tray=$("#lbMain .tray"),el=tray.querySelector('[data-f="'+id+'"]');
  const src=document.querySelector('.fbtn[data-food="'+id+'"] svg')||$("#btnAdd");
  const done=()=>{if(el){el.classList.remove("incoming");el.classList.add("pop")}sfx.pop()};
  setTimeout(()=>{
    try{
      if(!el||!el.animate){done();return}
      const from=src.getBoundingClientRect(),to=el.getBoundingClientRect();
      if(!to.width){done();return}
      const sz=Math.max(56,Math.min(90,to.width));
      const fl=document.createElement("div");fl.className="flyer";fl.innerHTML=foodSVG(id);
      Object.assign(fl.style,{left:from.left+from.width/2-sz/2+"px",top:from.top+from.height/2-sz/2+"px",width:sz+"px",height:sz+"px"});
      document.body.appendChild(fl);
      const dx=to.left+to.width/2-(from.left+from.width/2),dy=to.top+to.height/2-(from.top+from.height/2);
      const a=fl.animate([{transform:"translate(0,0) scale(1)"},{transform:"translate("+dx*.5+"px,"+(dy*.5-90)+"px) scale(1.25) rotate(12deg)",offset:.5},{transform:"translate("+dx+"px,"+dy+"px) scale("+(to.width/sz)+") rotate(0)"}],{duration:650,easing:"ease-in-out"});
      a.onfinish=()=>{fl.remove();done()};
    }catch(e){done()}
  },delay);
}
function submitSentence(){
  const p=P(),inp=$("#sIn");
  $("#btnAdd").classList.remove("pulse");
  const r=parseSentence(inp.value);
  if(!r.ok){sfx.bad();setMsg("bad",'<span>🙂</span><span>'+esc(r.msg)+'</span>');inp.focus();return}
  const added=[],removed=[],notes=[];
  r.items.forEach(it=>{
    const res=applyStatement(p.box,it.food,it.has);
    if(it.has){if(!res.wasIn)added.push(it.food);else notes.push("You already have "+gotPos(it.food)+"!")}
    else{if(res.wasIn)removed.push(it.food);else notes.push("OK, no "+low(FBY[it.food])+".")}
  });
  const tray=$("#lbMain .tray");
  syncTray(tray,foodsIn(p.box),added,true);
  added.forEach((id,k)=>flyIn(id,k*220));
  if(removed.length)sfx.poof();
  const sentences=r.items.map(it=>sentenceFor(it.food,it.has));
  let txt='<span>✔</span><span><b>'+esc(sentences.join(" "))+'</b> ';
  if(added.length)txt+="Into the lunch box!";
  else if(removed.length)txt+="Out of the lunch box!";
  else txt+=esc(notes.join(" "));
  txt+="</span>";
  setMsg("ok",txt);
  renderList("#sList",p,true);renderFoodButtons();
  selFood=null;renderChooser();inp.value="";inp.focus({preventScroll:true});
}
function removeStatement(food){
  const p=P(),i=p.box.findIndex(x=>x.food===food);if(i<0)return;
  p.box.splice(i,1);sfx.poof();
  syncTray($("#lbMain .tray"),foodsIn(p.box),[],true);renderList("#sList",p,true);renderFoodButtons();
  setMsg("info","Sentence removed.");
}
function clearCurrentBox(){
  const p=P();p.box=[];p.done=false;sfx.poof();
  syncTray($("#lbMain .tray"),[],[],true);renderList("#sList",p,true);renderFoodButtons();selFood=null;renderChooser();
  setMsg("info","Fresh start! What do you have in your lunch box?");
}
function finishBox(){
  const p=P();
  if(!p.box.length){sfx.bad();setMsg("bad","<span>🙂</span><span>Add at least one sentence first!</span>");return}
  p.done=true;sfx.fin();
  if(G.editing){G.editing=false;showResults();return}
  if(G.cur<G.players.length-1){showPass(G.cur+1)}else showResults();
}

/* ================= RESULTS ================= */
function showResults(){
  showScreen("results");
  const n=G.players.length,g=$("#rgrid");g.className="rgrid n"+n;g.innerHTML="";
  G.players.forEach((p,i)=>{
    const c=document.createElement("div");c.className="card rcard";c.style.setProperty("--pc",PCOL[i%3]);
    c.innerHTML='<div class="rh">'+avHTML(p,i)+'<h3></h3><button type="button" class="btn ghost small">Change</button></div><div class="lb">'+lunchboxHTML(i)+'</div><ul class="slist compact" id="rl'+i+'"></ul>';
    c.querySelector("h3").textContent=p.name;
    c.querySelector("button").addEventListener("click",()=>{G.editing=true;beginBuild(i)});
    g.appendChild(c);
    syncTray(c.querySelector(".tray"),foodsIn(p.box),[],false);
    c.querySelectorAll(".tray .fd").forEach((el,k)=>{el.classList.add("pop");el.style.animationDelay=(i*.15+k*.05)+"s"});
    renderList("#rl"+i,p,false);
  });
}

/* ================= TALK ================= */
function goTalk(){
  const T=G.talk;if(T.who>=G.players.length)T.who=0;
  if(T.a>=G.players.length)T.a=0;if(T.b>=G.players.length||T.b===T.a)T.b=(T.a+1)%G.players.length;
  if(G.players.length<2)T.mode="who";
  T.q=null;showScreen("talk");renderTalk();
}
function renderTalk(){
  const T=G.talk,n=G.players.length;
  const tabs=$("#tabs");tabs.innerHTML="";
  [["who","What has he/she got?"],["cmp","Compare lunch boxes"]].forEach(([m,l])=>{
    const b=document.createElement("button");b.type="button";b.className="tab"+(T.mode===m?" sel":"");b.textContent=l;
    if(m==="cmp"&&n<2){b.disabled=true;b.title="You need two students to compare"}
    b.addEventListener("click",()=>{T.mode=m;T.q=null;sfx.click();renderTalk()});tabs.appendChild(b);
  });
  const back=document.createElement("button");back.type="button";back.className="tab";back.textContent="← Our lunch boxes";back.addEventListener("click",()=>showResults());tabs.appendChild(back);
  if(T.mode==="who")renderWho();else renderCmp();
}
function chipsHTML(label,sel,key){
  return'<div class="chips"><span class="lab">'+label+'</span>'+G.players.map((p,i)=>'<button type="button" class="pchip'+(sel===i?" sel":"")+'" style="--pc:'+PCOL[i%3]+'" data-k="'+key+'" data-i="'+i+'">'+avHTML(p,i)+esc(p.name)+'</button>').join("")+'</div>';
}
function bindChips(root,fn){root.querySelectorAll(".pchip").forEach(b=>b.addEventListener("click",()=>{sfx.click();fn(b.dataset.k,+b.dataset.i)}))}
function boxCard(p,i,big){
  const d=document.createElement("div");d.className="card";
  d.innerHTML='<div class="who-h">'+avHTML(p,i)+'<h2></h2></div><div class="lb">'+lunchboxHTML(i)+'</div>';
  d.querySelector("h2").textContent=p.name;
  syncTray(d.querySelector(".tray"),foodsIn(p.box),[],false);
  return d;
}
function newQuestion(){
  const T=G.talk,p=G.players[T.who],others=G.players.filter((_,i)=>i!==T.who);
  T.qn++;
  const kind=(T.qn%2===1)?"what":"yn";
  const q=makeQuestion(p,others,kind,T.last)||makeQuestion(p,others,"yn",null);
  T.q=q;T.tries=0;T.solved=false;if(q)T.last=q.food;
}
function renderWho(){
  const T=G.talk,body=$("#talkBody"),p=G.players[T.who],i=T.who,pr=PRON[p.gender];
  body.innerHTML=chipsHTML("Talk about:",T.who,"who")+'<div class="talk-grid"><div id="lbCol"></div><div class="card" id="qCol"></div></div>';
  bindChips(body,(k,v)=>{T.who=v;T.q=null;renderTalk()});
  $("#lbCol").appendChild(boxCard(p,i));
  const q=$("#qCol"),F=foodsIn(p.box);
  if(!F.length){q.innerHTML='<div class="bigq">This lunch box is empty!</div><p style="text-align:center">'+esc(p.name)+' has not added any food yet.</p><div class="row center"><button class="btn green" id="btnGoBuild">Add food</button></div>';
    $("#btnGoBuild").addEventListener("click",()=>{G.editing=true;beginBuild(T.who)});return}
  if(!T.q)newQuestion();
  const Q=T.q;
  let h='<div class="row" style="justify-content:space-between"><span class="stars">⭐ '+T.stars+'</span></div><div class="bigq">'+esc(Q.text)+'</div>';
  h+='<div class="starters"><span class="starter">'+pr.S+' has got …</span><span class="starter">'+pr.S+' hasn\'t got …</span><span class="starter">Has '+pr.s+' got …?</span></div>';
  h+='<div class="answers" id="answers"></div><div class="fb" id="fb" aria-live="polite"></div>';
  h+='<div class="row center"><button class="btn blue" id="btnNextQ">Next question</button></div>';
  h+='<div class="say-h">Say it aloud! (tap to listen)</div><div class="say" id="say"></div>';
  q.innerHTML=h;
  const ans=$("#answers");
  Q.options.forEach(o=>{
    const b=document.createElement("button");b.type="button";b.className="ans";b.textContent=o.t;
    b.addEventListener("click",()=>answerWho(b,o));ans.appendChild(b);
  });
  $("#btnNextQ").addEventListener("click",()=>{sfx.click();newQuestion();renderWho()});
  const say=$("#say");
  F.forEach(f=>{const b=document.createElement("button");b.type="button";b.className="sayb";b.innerHTML=SPK+'<span></span>';b.querySelector("span").textContent=hasGot(p,f);b.addEventListener("click",()=>speak(hasGot(p,f)));say.appendChild(b)});
}
function answerWho(btn,o){
  const T=G.talk,Q=T.q;if(T.solved)return;
  const fb=$("#fb");
  if(o.ok){
    T.solved=true;btn.classList.add("right");T.stars+=T.tries===0?2:1;sfx.ok();
    document.querySelectorAll("#answers .ans").forEach(b=>b.disabled=true);
    fb.className="fb good";fb.textContent="Great job! "+Q.model;speak(Q.model);
    const s=document.querySelector(".stars");if(s)s.textContent="⭐ "+T.stars;
  }else{
    T.tries++;btn.classList.add("wrong");btn.disabled=true;sfx.bad();
    if(T.tries>=2){fb.className="fb look";fb.textContent="Look at the lunch box!";const lb=document.querySelector("#lbCol .lb");lb.classList.remove("look");void lb.offsetWidth;lb.classList.add("look")}
    else{fb.className="fb bad";fb.textContent="Try again!"}
  }
}
function renderCmp(){
  const T=G.talk,body=$("#talkBody"),A=G.players[T.a],B=G.players[T.b];
  body.innerHTML=chipsHTML("Talk about:",T.a,"a")+chipsHTML("Compare with:",T.b,"b")+'<div class="cmp-boxes" id="cb"></div><div id="cmpSecs"></div>';
  bindChips(body,(k,v)=>{if(k==="a"){T.a=v;if(T.b===v)T.b=(v+1)%G.players.length}else{T.b=v;if(T.a===v)T.a=(v+1)%G.players.length}T.q=null;renderCmp()});
  $("#cb").appendChild(boxCard(A,T.a));$("#cb").appendChild(boxCard(B,T.b));
  const S=compareSentences(A,B),d=compareData(A,B);
  let h='';
  h+='<div class="card cmp-sec"><h3>Read it! (tap to listen)</h3><div class="say" id="cmpSay"></div></div>';
  h+='<div class="card cmp-sec"><h3>Complete it!</h3><div id="frames"></div></div>';
  h+='<div class="card cmp-sec"><h3>Question time!</h3><div id="cmpQ"></div></div>';
  $("#cmpSecs").innerHTML=h;
  const say=$("#cmpSay");
  if(!S.length)say.innerHTML='<p class="empty-note">Add some food to the lunch boxes to compare them.</p>';
  S.forEach(s=>{const b=document.createElement("button");b.type="button";b.className="sayb";b.innerHTML=SPK+'<span></span>';b.querySelector("span").textContent=s.t;b.addEventListener("click",()=>speak(s.t));say.appendChild(b)});
  /* frames */
  const fr=$("#frames");const sa=subj(A,B,true),sb=subj(B,A,false);
  const diffs=[];d.aOnly.forEach(f=>diffs.push({who:"a",f}));d.bOnly.forEach(f=>diffs.push({who:"b",f}));
  shuffle(diffs).slice(0,3).forEach(x=>{
    const P1=x.who==="a"?A:B,P2=x.who==="a"?B:A;
    const s1=x.who==="a"?sa:subj(B,A,true),s2=x.who==="a"?sb:subj(A,B,false);
    const row=document.createElement("div");row.className="frame";
    row.innerHTML='<span>'+esc(s1)+' has got</span><span class="blank">&nbsp;</span><span>, but '+esc(s2)+' hasn\'t got</span><span class="blank">&nbsp;</span><span>.</span><button type="button" class="btn small sun">Show</button>';
    const bl=row.querySelectorAll(".blank");
    row.querySelector("button").addEventListener("click",()=>{bl[0].textContent=gotPos(x.f);bl[1].textContent=gotAny(x.f);sfx.ok();speak(s1+" has got "+gotPos(x.f)+", but "+s2+" hasn't got "+gotAny(x.f)+".")});
    fr.appendChild(row);
  });
  d.both.slice(0,1).forEach(f=>{
    const row=document.createElement("div");row.className="frame";
    row.innerHTML='<span>'+esc(sa)+' has got</span><span class="blank">&nbsp;</span><span>. '+esc(subj(B,A,true))+' has got</span><span class="blank">&nbsp;</span><span>too.</span><button type="button" class="btn small sun">Show</button>';
    const bl=row.querySelectorAll(".blank");row.querySelector("button").addEventListener("click",()=>{bl[0].textContent=gotPos(f);bl[1].textContent=gotPos(f);sfx.ok()});fr.appendChild(row);
  });
  if(!fr.children.length)fr.innerHTML='<p class="empty-note">No differences to complete yet.</p>';
  renderCmpQ();
}
function renderCmpQ(){
  const T=G.talk,A=G.players[T.a],B=G.players[T.b],box=$("#cmpQ");
  const who=Math.random()<.5?A:B,other=who===A?B:A;
  const Q=makeQuestion(who,[other],"yn",T.last);
  if(!Q){box.innerHTML='<p class="empty-note">Add some food first.</p>';return}
  T.last=Q.food;
  const pr=PRON[who.gender];
  box.innerHTML='<div class="row" style="margin-bottom:6px"><span class="avatar" style="--pc:'+PCOL[G.players.indexOf(who)%3]+'">'+avatarSVG(who.gender,who.av)+'</span><span style="font-size:1.1rem;font-weight:600">'+esc(who.name)+'</span></div><div class="bigq" style="font-size:clamp(1.5rem,3.6vw,2.2rem)">'+esc(Q.text)+'</div><div class="answers" id="cans"></div><div class="fb" id="cfb"></div><div class="row center"><button class="btn blue" id="cnext">Next question</button></div>';
  Q.options.forEach(o=>{const b=document.createElement("button");b.type="button";b.className="ans";b.textContent=o.t;b.addEventListener("click",()=>{
    const fb=$("#cfb");
    if(o.ok){b.classList.add("right");document.querySelectorAll("#cans .ans").forEach(x=>x.disabled=true);fb.className="fb good";fb.textContent="Great job! "+Q.model;sfx.ok();speak(Q.model)}
    else{b.classList.add("wrong");b.disabled=true;fb.className="fb bad";fb.textContent="Look at the lunch box!";sfx.bad()}
  });$("#cans").appendChild(b)});
  $("#cnext").addEventListener("click",()=>{sfx.click();renderCmpQ()});
}

/* ================= TEACHER MENU ================= */
function openMenu(){
  const n=G.players.length;
  const hasGame=n>0;
  let h='<h2>Teacher menu</h2>';
  h+='<div class="sec"><b>Number of students</b><div class="count-pick" id="mCount"></div></div>';
  if(hasGame){
    h+='<div class="sec"><b>Student names</b><div id="mNames"></div></div>';
    h+='<div class="sec"><b>Describe which student?</b><div class="row" id="mWho"></div></div>';
    h+='<div class="sec"><b>Game controls</b><div class="row"><button class="btn small ghost" id="mRestart">Restart this student\'s turn</button><button class="btn small ghost" id="mSkip">Skip to discussion</button><button class="btn small ghost" id="mReset">Reset the whole game</button></div></div>';
  }
  h+='<div class="sec"><label class="toggle"><input type="checkbox" id="mLabels"'+(G.labels?" checked":"")+'> Show food words on the buttons</label></div>';
  h+='<div class="sec"><label class="toggle"><input type="checkbox" id="mSound"'+(G.sound?" checked":"")+'> Sound effects</label></div>';
  h+='<div class="row center"><button class="btn green" id="mClose">Close</button></div>';
  $("#modalBox").innerHTML=h;$("#modal").classList.add("open");
  const mc=$("#mCount");
  [1,2,3].forEach(k=>{const b=document.createElement("button");b.type="button";b.className=(hasGame?k===n:k===SETUP.n)?"sel":"";b.textContent=k;b.addEventListener("click",()=>{setCount(k);openMenu()});mc.appendChild(b)});
  if(hasGame){
    const mn=$("#mNames");G.players.forEach((p,i)=>{const inp=document.createElement("input");inp.type="text";inp.maxLength=12;inp.value=p.name;inp.setAttribute("aria-label","Name "+(i+1));inp.addEventListener("input",()=>{p.name=inp.value.trim()||DEFAULT_NAMES[i];refreshNames()});mn.appendChild(inp)});
    const mw=$("#mWho");G.players.forEach((p,i)=>{const b=document.createElement("button");b.type="button";b.className="pchip"+(G.talk.who===i?" sel":"");b.style.setProperty("--pc",PCOL[i%3]);b.innerHTML=avHTML(p,i)+esc(p.name);b.addEventListener("click",()=>{G.talk.who=i;G.talk.a=i;if(G.talk.b===i)G.talk.b=(i+1)%G.players.length;G.talk.q=null;closeMenu();goTalk()});mw.appendChild(b)});
    $("#mRestart").addEventListener("click",()=>{closeMenu();G.editing=false;G.players[G.cur].box=[];G.players[G.cur].done=false;beginBuild(G.cur)});
    $("#mSkip").addEventListener("click",()=>{closeMenu();goTalk()});
    $("#mReset").addEventListener("click",()=>{closeMenu();resetAll()});
  }
  $("#mSound").addEventListener("change",e=>{G.sound=e.target.checked});
  $("#mLabels").addEventListener("change",e=>{G.labels=e.target.checked;if(G.screen==="build"){renderFoodButtons();renderChooser()}});
  $("#mClose").addEventListener("click",closeMenu);
}
function closeMenu(){$("#modal").classList.remove("open")}
function refreshNames(){
  if(G.screen==="build")renderBuild(false),selFoodKeep();
  else if(G.screen==="results")showResults();
  else if(G.screen==="talk")renderTalk();
}
function selFoodKeep(){}
function setCount(k){
  if(!G.players.length){SETUP.n=k;renderSetup();return}
  while(G.players.length<k){const i=G.players.length;const s=SETUP.players[i];G.players.push({name:DEFAULT_NAMES[i],gender:s.gender,av:s.av,box:[],done:false})}
  while(G.players.length>k)G.players.pop();
  SETUP.n=k;
  if(G.cur>=k)G.cur=k-1;
  const T=G.talk;if(T.who>=k)T.who=0;if(T.a>=k)T.a=0;if(T.b>=k||T.b===T.a)T.b=(T.a+1)%k;T.q=null;
  refreshNames();
}
function resetAll(){
  G.players=[];G.cur=0;G.editing=false;G.talk={mode:"who",who:0,a:0,b:1,q:null,tries:0,solved:false,stars:0,last:null,qn:0};
  renderSetup();showScreen("start");
}

/* ================= WIRING ================= */
$("#btnStart").addEventListener("click",startGame);
$("#btnAdd").addEventListener("click",submitSentence);
$("#sIn").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submitSentence()}});
$("#sIn").addEventListener("input",()=>$("#btnAdd").classList.remove("pulse"));
$("#btnFinish").addEventListener("click",finishBox);
$("#btnClearBox").addEventListener("click",clearCurrentBox);
$("#btnTalk").addEventListener("click",()=>{sfx.click();goTalk()});
$("#btnGear").addEventListener("click",openMenu);
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeMenu()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});
buildTitle();renderSetup();
window.__LB={G,SETUP,parseSentence,applyStatement,makeQuestion,compareSentences,sentenceFor,FOODS};
})();
</script>
