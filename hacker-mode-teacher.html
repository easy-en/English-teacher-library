*{box-sizing:border-box}body{margin:0;background:#080b20;color:#effaff;font:16px system-ui}main{max-width:1250px;margin:auto;padding:14px}header,.bar,.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:4px 0;font-size:clamp(23px,4vw,38px);letter-spacing:2px}small{color:#a3b8e6}button,input,textarea{font:inherit}button{cursor:pointer;color:white;background:#222b51;border:1px solid #6276ab;border-radius:12px;padding:11px 16px}button:hover,button.selected{background:#315b77;border-color:#69ffdb}button:disabled{opacity:.45;cursor:default}.primary{background:#61f4ce;color:#08182b;font-weight:800;border:0}input,textarea{background:#090e24;color:white;border:1px solid #7385bb;border-radius:10px;padding:12px;width:100%}textarea{min-height:90px;resize:vertical}progress{width:100%;height:12px;accent-color:#61f4ce}.map{display:flex;gap:6px;margin:12px 0}.map div{flex:1;text-align:center;border:1px solid #39476e;border-radius:10px;padding:8px;font-size:12px}.map .active{border-color:#61f4ce;background:#21465b}.map .done{background:#18554e}.scene{--glow:#61f4ce;position:relative;isolation:isolate;overflow:hidden;border:1px solid #53659a;border-radius:24px;min-height:590px;background:radial-gradient(ellipse at 50% 20%,#263b70,#080c22 80%);display:flex;align-items:center;justify-content:flex-end;padding:24px;gap:20px}.world{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.panel{width:min(100%,620px);background:#10172fee;border:1px solid #687eae;border-radius:20px;padding:20px;box-shadow:0 15px 50px #0009}.panel h2{color:var(--glow);margin:8px 0}blockquote{margin:12px 0;padding:12px;background:#232d50;border-left:4px solid var(--glow);line-height:1.45}.options{display:grid;gap:8px}.options button{text-align:left}.status{min-height:26px;color:#ffe39a;margin:8px 0}.avatar{width:clamp(130px,24vw,300px);flex-shrink:0;filter:drop-shadow(0 0 18px #54e9ff55)}.robot{animation:bob 2.4s ease-in-out infinite;transform-origin:center function world(m,k){let c=colors[m];let items=Array.from({length:counts[m]},(_,n)=>`<g transform="translate(${80+n*80} 470)"><path class="cube" style="animation-delay:${n*.17}s" d="M0 -23L24 -10 24 16 0 30 -24 16 -24 -10Z" fill="${n<k?c:'#172746'}" stroke="${c}" stroke-width="2"/><text y="7" text-anchor="middle" fill="${n<k?'#071323':c}" font-size="15">${n+1}</text></g>`).join('');let detail=[`<g stroke="${c}" fill="#142344">${[0,1,2].map(n=>`<rect x="${35+n*155}" y="70" width="140" height="150" rx="12"/><path d="M${50+n*155} 105h100m-100 25h80m-80 25h95" stroke-width="5"/>`).join('')}</g><path class="scan" d="M30 100H500" stroke="${c}" stroke-width="4"/>`,`<g fill="#1b294d" stroke="${c}" stroke-width="3"><rect x="80" y="55" width="330" height="320" rx="60"/><circle cx="245" cy="210" r="100"/><path d="M245 110V310M145 210H345"/></g><circle class="cube" cx="245" cy="210" r="${25+k*12}" fill="${c}" opacity=".5"/>`,`<g fill="#18294d" stroke="${c}">${Array.from({length:8},(_,n)=>`<rect x="${n*65}" y="${100+(n%3)*50}" width="52" height="350"/><path d="M${n*65+12} ${130+(n%3)*50}v180" stroke-dasharray="8 12" stroke-width="8"/>`).join('')}</g><g class="robot"><path d="M180 120h100l-25 25h-50Z" fill="${c}"/><circle cx="230" cy="155" r="15" fill="#fff"/></g>`,`<g class="ring" fill="none" stroke="${c}"><circle cx="500" cy="260" r="210" stroke-width="14" stroke-dasharray="35 18"/><circle cx="500" cy="260" r="180" stroke-width="4" stroke-dasharray="8 12"/></g><circle cx="500" cy="260" r="150" fill="${c}" opacity="${.08+k*.08}"/>`,`<rect x="60" y="60" width="420" height="350" rx="30" fill="#1b2947" stroke="${c}" stroke-width="5"/><circle cx="270" cy="235" r="135" fill="#10182e" stroke="${c}" stroke-width="12"/><circle cx="270" cy="235" r="${35+k*15}" fill="${c}" opacity=".7"/>`][m];return `<svg class="world" viewBox="0 0 1000 550" preserveAspectRatio="xMidYMid slice"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="${c}" opacity=".12" fill="none"/></pattern></defs><rect width="1000" height="550" fill="url(#grid)"/><path d="M0 440L500 330 1000 440V550H0Z" fill="#152243"/>${detail}${items}</svg>`}
function hud(){ $('progress').value=records.filter(Boolean).length;$('hud').innerHTML=playerName?`<b>${esc(playerName)} · ${records.filter(Boolean).length*100} XP</b><span class="inventory">${rewards.map((r,n)=>records.filter(Boolean).length>=starts[n]+counts[n]?'◆':'◇').join(' ')}</span><small>${records.filter(Boolean).length}/23 complete</small>`:'';$('map').innerHTML=missions.map((m,n)=>`<div class="${records.filter(Boolean).length>=starts[n]+counts[n]?'done':tasks[i]?.[0]===n&&playerName?'active':''}">${n+1}. ${m}</div>`).join('')}
function start(){hud();app.innerHTML=`<section class="scene">${world(0,0)}${avatar()}<div class="panel start"><small>NEW PLAYER</small><h2>Restore the Lost Code</h2><p>I'm PIX, your robot guide. Five digital worlds need your English skills!</p><label for="player">Your name</label><input id="player" maxlength="40" placeholder="Enter your name" autocomplete="off"><button class="primary" type="button" onclick="launch()">Enter the digital world →</button><button type="button" onclick="teacherStart()">Teacher Mode · Preview all tasks</button><p id="err" class="status"></p></div></section>`;$('player').addEventListener('keydown',e=>{if(e.key==='Enter')launch()})}
function launch(){teacher=false;playerName=$('player').value.trim();if(!playerName){$('err').textContent='Enter your name first.';return}begin=Date.now();tone();render()}
function render(){generation++;busy=false;choice=-1;hud();let t=tasks[i],m=t[0],k=i-starts[m];app.innerHTML=`<section class="scene" style="--glow:${colors[m]};--art:url(${artworks[m]})">${world(m,k)}${avatar()}<img class="pix-art" alt="PIX robot companion" src="${pixArt}"><div class="panel"><small>WORLD ${m+1} · TASK ${k+1} OF ${counts[m]}</small><h2>${missions[m]}</h2><small>PIX: ${esc(playerName)}, ${['decode this message!','repair this glitch!','recover the missing words!','reconstruct the original!','write the final report!'][m]}</small><blockquote>${esc(t[1])}</blockquote><p>${esc(t[2])}</p>${t[3]?`<div class="options">${t[3].map((v,n)=>`<button onclick="pick(${n})">${esc(v)}</button>`).join('')}</div>`:`<textarea id="answer" aria-label="Your answer" placeholder="${m===2?'Separate missing words with semicolons.':'Type your answer here…'}" oninput="$('send').disabled=!this.value.trim()"></textarea>`}<div class="status" id="status" aria-live="polite"></div><div class="foot"><small>${k}/${counts[m]} energy cubes collected</small><button id="send" class="primary" disabled onclick="submitAnswer()">${m===4?'Submit report entry':'Activate cube'} →</button></div></div></section>`;if(teacher)teacherPanel();if(m===4)$('answer').addEventListener('paste',e=>{e.preventDefault();$('status').textContent='Please write your own answer.'})}
function pick(n){if(busy)return;choice=n;document.querySelectorAll('.options button').forEach((b,j)=>b.classList.toggle('selected',j===n));$('send').disabled=false}
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/\b(that)\b/g,'').replace(/\b(didn't)\b/g,'did not').replace(/\b(wasn't)\b/g,'was not').replace(/\b(weren't)\b/g,'were not').replace(/\b(i'm)\b/g,'i am').replace(/\b(don't)\b/g,'do not').replace(/\b(doesn't)\b/g,'does not').replace(/[^a-z0-9]/g,'');
function submitAnswer(){if(busy)return;let t=tasks[i],m=t[0],a=t[3]?t[3][choice]:$('answer').value.trim();if(!a)return;busy=true;let key=t[3]?t[3][t[4]]:t[4],result=m===4?'Teacher review':norm(a)===norm(key)?'Correct':t[3]?'Incorrect':'Teacher review';if(teacher){records[i]={a,key,result};}else records.push({a,key,result});tone(result!=='Incorrect');$('send').disabled=true;document.querySelectorAll('.options button').forEach(b=>b.disabled=true);if($('answer'))$('answer').disabled=true;$('status').textContent=result==='Correct'?'Code restored!':result==='Incorrect'?'Correct code: '+key:'Answer saved for teacher review.';hud();let scene=document.querySelector('.scene');scene.querySelector('.world').outerHTML=world(m,i-starts[m]+1);scene.classList.add('burst');let last=i===starts[m]+counts[m]-1;let overlay=document.createElement('div');overlay.className='reward';overlay.innerHTML=`<div><strong>${last?'🏆':'◆'}</strong>${last?rewards[m]+' unlocked!':'Energy cube collected!'}<p>+100 completion XP</p></div>`;let token=generation;setTimeout(()=>{if(token===generation)scene.append(overlay)},650);setTimeout(()=>{if(token!==generation)return;overlay.remove();$('send').textContent=last?'Next world →':'Continue →';if(i===22)$('send').textContent='Finish adventure →';$('send').disabled=false;$('send').onclick=()=>{if(i===22)finish();else{i++;render()}}},1750)}
function finish(){generation++;hud();app.innerHTML=`<section class="scene" style="--glow:#ffe08a;--art:url(${artworks[4]})">${world(4,4)}${avatar()}<img class="pix-art" alt="PIX robot companion" src="${pixArt}"><div class="panel"><h2>🏆 MASTER CODE RESTORER</h2><h1>${esc(playerName)}</h1><p>All five worlds restored! You collected 23 energy cubes and earned 2300 completion XP.</p><button class="primary" onclick="report()">Open Teacher’s Report</button></div></section>`;tone()}
function report(){generation++;let correct=records.filter(r=>r&&r.result==='Correct').length,wrong=records.filter(r=>r&&r.result==='Incorrect').length,review=records.filter(Boolean).length-correct-wrong;app.innerHTML=`<section class="report"><h2>Teacher’s Report</h2><p>Student: <b>${esc(playerName)}</b> · Strong B1 · Reported Speech</p><p>Completed: ${records.filter(Boolean).length}/23 · Time: ${Math.floor((Date.now()-begin)/60000)} min · XP: ${records.filter(Boolean).length*100}</p><p>Confirmed correct: ${correct} · Confirmed incorrect: ${wrong} · Teacher review: ${review}</p><p>Written variants are not automatically marked wrong. Compare them with the suggested answers.</p>${missions.map((m,n)=>`<h3>${m}</h3><p>${records.slice(starts[n],starts[n]+counts[n]).filter(r=>r&&r.result==='Correct').length} confirmed correct / ${counts[n]} tasks</p>${records.slice(starts[n],starts[n]+counts[n]).map((r,j)=>{let t=tasks[starts[n]+j];return `<article><b>${j+1}. ${esc(t[1])}</b>
${esc(t[2])}
Student: ${esc(r.a)}
Suggested answer: ${esc(r.key)}
Result: ${r.result}</article>`}).join('')}`).join('')}<p>Review areas: tense backshift, pronouns, said/told, direct speech reconstruction and independent reporting.</p><div class="foot no-print"><button onclick="finish()">Certificate</button>${teacher?'<button onclick="render()">Back to task</button>':''}<button class="primary" onclick="window.print()">Save as PDF / Print</button><button onclick="if(confirm('Start a new game?')){i=0;teacher=false;playerName='';records=[];start()}">Start again</button></div></section>`}
function teacherStart(){teacher=true;playerName='Teacher preview';records=[];i=0;begin=Date.now();render()}
function jump(n){i=Math.max(0,Math.min(22,Number(n)));render()}
function teacherPanel(){let nav=document.createElement('div');nav.className='teacher-nav';nav.innerHTML=`<b>TEACHER MODE · Preview only</b><div class="teacher-controls"><button onclick="jump(i-1)" ${i===0?'disabled':''}>← Previous</button><select aria-label="Choose task" onchange="jump(this.value)">${tasks.map((t,n)=>`<option value="${n}" ${n===i?'selected':''}>${n+1}/23 · ${missions[t[0]]} · ${n-starts[t[0]]+1}</option>`).join('')}</select><button onclick="jump(i+1)" ${i===22?'disabled':''}>Next →</button><button onclick="jump(i)">Reset task</button><button onclick="$('teacherKey').hidden=!$('teacherKey').hidden">Show answer</button><button onclick="report()">Preview report</button><button onclick="generation++;teacher=false;records=[];i=0;playerName='';start()">Exit preview</button></div><p id="teacherKey" hidden>${esc(tasks[i][3]?tasks[i][3][tasks[i][4]]:tasks[i][4])}</p>`;app.prepend(nav)}
start();</script></html>
