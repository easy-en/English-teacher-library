<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ea;--panel:#fff;--panel2:#f3efe6;--ink:#23314a;--muted:#61728a;--line:#e2dacb;--acc:#4f9d3a;--acc-ink:#fff;--tint:#e9f6e0;--ok:#2b8a3e;--warn:#c2410c;--shadow:0 10px 30px rgba(35,49,74,.14);--r:22px;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body[data-season=spring]{--tint:#e6f6dc;--acc:#3f8f2f}
body[data-season=summer]{--tint:#dff0ff;--acc:#1971c2}
body[data-season=autumn]{--tint:#fbe6d0;--acc:#d9480f}
body[data-season=winter]{--tint:#e6eef9;--acc:#3b5bdb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a2b;--panel:#1d2840;--panel2:#16203a;--ink:#eef2fa;--muted:#9fb0c9;--line:#2f3e5e;--shadow:0 10px 30px rgba(0,0,0,.4)}
 body[data-season=spring]{--tint:#1c3322;--acc:#7bd45f}body[data-season=summer]{--tint:#16304f;--acc:#5aaeff}body[data-season=autumn]{--tint:#3b2616;--acc:#ff9a52}body[data-season=winter]{--tint:#1c2a4a;--acc:#8ea6ff}}
:root[data-theme="dark"]{--bg:#121a2b;--panel:#1d2840;--panel2:#16203a;--ink:#eef2fa;--muted:#9fb0c9;--line:#2f3e5e;--shadow:0 10px 30px rgba(0,0,0,.4)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;font-family:Nunito,'Trebuchet MS','Segoe UI',Arial,sans-serif;font-size:18px;color:var(--ink);background:#f6f2ea;background:linear-gradient(180deg,var(--tint),var(--bg) 520px) fixed;transition:background .4s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:'Baloo 2',Nunito,'Trebuchet MS',Arial,sans-serif;margin:0;line-height:1.1}
h1{font-size:44px}h2{font-size:30px}h3{font-size:21px}
p{margin:6px 0}
#app{display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:12px 22px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:'Baloo 2',Nunito,sans-serif;font-weight:800;font-size:26px;white-space:nowrap}
.logo svg{flex:none}
.steps{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.stp{border:0;background:var(--panel);border-radius:999px;padding:8px 16px 8px 8px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;box-shadow:0 2px 0 var(--line);color:var(--muted)}
.stp b{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--panel2);align-items:center;justify-content:center;font-size:14px}
.stp.on{background:var(--acc);color:var(--acc-ink)}.stp.on b{background:#ffffff40;color:#fff}
.stp.done b{background:var(--ok);color:#fff}
.stp:disabled{opacity:.45;cursor:default}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--panel);border-radius:999px;padding:3px;box-shadow:0 2px 0 var(--line)}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.ib{border:0;background:var(--panel);border-radius:14px;width:42px;height:42px;font-size:20px;box-shadow:0 2px 0 var(--line)}
main{flex:1;padding:6px 22px 18px;width:100%;max-width:1500px;margin:0 auto}
.panel{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px}
.btn{border:0;border-radius:16px;padding:12px 22px;font-weight:800;font-size:18px;background:var(--panel);box-shadow:0 4px 0 var(--line);color:var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.btn.pri{background:var(--acc);color:var(--acc-ink);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn.big{font-size:22px;padding:14px 30px}
.btn.sm{padding:7px 14px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default}
.foot{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 20px;gap:12px;max-width:1500px;margin:0 auto;width:100%}
.hint{color:var(--warn);font-weight:700;font-size:15px}
.sub{color:var(--muted);font-size:16px}
/* step 0 */
.cnt{display:flex;gap:12px;margin:14px 0 20px;flex-wrap:wrap}
.cntb{border:3px solid var(--line);background:var(--panel);border-radius:20px;padding:10px 20px;min-width:128px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;box-shadow:0 4px 0 var(--line)}
.cntb .num{font-family:'Baloo 2',sans-serif;font-size:34px;line-height:1}
.cntb.on{border-color:var(--acc);background:var(--tint)}
.sgrid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.scard{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
.scard .big-av{background:linear-gradient(#e7f2ff,#fff);border-radius:20px;padding:6px;display:flex;justify-content:center}
.nm{font-size:22px;font-weight:800;border:3px solid var(--line);border-radius:14px;padding:8px 12px;width:100%;background:var(--panel);font-family:inherit}
.lab{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 0 4px}
.typ{display:flex;gap:8px}
.typb{flex:1;border:3px solid var(--line);background:var(--panel2);border-radius:16px;padding:2px 4px;font-weight:800;display:flex;flex-direction:column;align-items:center}
.typb.on{border-color:var(--acc);background:var(--tint)}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.swb{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.swb.on{box-shadow:0 0 0 3px var(--acc)}
.stb{border:3px solid var(--line);background:var(--panel2);border-radius:14px;padding:0 2px;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700}
.stb.on{border-color:var(--acc);background:var(--tint)}
.tog{border:3px solid var(--line);background:var(--panel2);border-radius:12px;padding:5px 12px;font-weight:700;font-size:15px}
.tog.on{border-color:var(--acc);background:var(--tint)}
.sel{border:3px solid var(--line);background:var(--panel);border-radius:12px;padding:5px 8px;font-weight:700;font-size:15px}
/* step 1 */
.cal{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:22px;align-items:start}
.cal .scene{position:sticky;top:10px}
.sceneb{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.sceneb>svg{display:block;width:100%;height:auto}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0}
.wk button{border:3px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 0;font-weight:800;font-size:15px}
.wk button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0}
.inp{border:3px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 10px;font-weight:700;font-size:17px}
.seas{display:flex;gap:8px;flex-wrap:wrap}
.seasb{border:3px solid var(--line);background:var(--panel2);border-radius:14px;padding:6px 14px;font-weight:800;display:flex;align-items:center;gap:6px}
.seasb.on{border-color:var(--acc);background:var(--tint)}
.sent{margin:10px 0}
.sent .lab{margin:0 0 3px}
.sin{display:flex;gap:6px;align-items:center}
.sin input{flex:1;min-width:0;border:3px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 12px;font-size:24px;font-weight:800;font-family:'Baloo 2',Nunito,sans-serif;color:var(--ink)}
.sin input.ed{border-color:var(--acc)}
.fr{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.fr button{border:2px dashed var(--line);background:transparent;border-radius:999px;padding:3px 11px;font-size:14px;font-weight:700;color:var(--muted)}
.fr button:hover{border-color:var(--acc);color:var(--ink)}
.rst{border:0;background:var(--panel2);border-radius:10px;width:34px;height:34px;font-size:16px;flex:none}
/* step 2 */
.qs{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 16px}
.qc{border:0;background:var(--panel);box-shadow:0 4px 0 var(--line);border-radius:16px;padding:10px 16px;font-weight:800;font-size:17px;text-align:left}
.qc:first-child{background:var(--acc);color:var(--acc-ink);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.wgrid{display:grid;gap:18px;grid-template-columns:1fr}
.wgrid.n2,.wgrid.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.wgrid.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.wgrid.n1{max-width:760px;margin:0 auto}
@media (max-width:1180px){.wgrid.n3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.wgrid.n2,.wgrid.n3,.wgrid.n4{grid-template-columns:1fr}.cal{grid-template-columns:1fr}.cal .scene{position:static}.scard{grid-template-columns:1fr}}
.wcard{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px}
.wh{display:flex;align-items:center;gap:10px}
.wh h3{font-size:24px}
.tagp{margin-left:auto;font-size:12px;font-weight:800;background:var(--panel2);color:var(--muted);border-radius:999px;padding:3px 10px;white-space:nowrap}
.wscene{border-radius:20px;overflow:hidden;background:#cfe8ff;line-height:0}
.wscene>svg{width:100%;height:auto}
.cbtn{border:3px solid var(--line);background:var(--panel2);border-radius:14px;padding:6px 12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;width:100%;text-align:left}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chp{border:3px solid var(--line);background:var(--panel2);border-radius:14px;padding:3px 10px 3px 4px;display:flex;align-items:center;gap:4px;font-weight:800;font-size:16px}
.chp.on{border-color:var(--acc);background:var(--tint)}
.chp .o{background:var(--acc);color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;margin-left:2px}
.wcard .sin input{font-size:20px}
/* step 3 */
.mtabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.mtab{border:3px solid var(--line);background:var(--panel);border-radius:18px;padding:4px 14px 4px 6px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;box-shadow:0 3px 0 var(--line)}
.mtab.on{border-color:var(--acc);background:var(--tint)}
.mood{display:grid;grid-template-columns:minmax(340px,480px) 1fr;gap:22px}
@media (max-width:900px){.mood{grid-template-columns:1fr}}
.mstage{background:linear-gradient(#dff0ff,#fff7e0);border-radius:var(--r);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;min-height:430px;position:relative}
.mstage .mi{position:absolute;right:16px;top:16px;background:#fff;border-radius:50%;padding:10px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.mchips{display:flex;gap:10px;flex-wrap:wrap}
.mch{border:3px solid var(--line);background:var(--panel2);border-radius:18px;padding:6px 14px 6px 8px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px}
.mch.body{border-style:dashed}
.mch.on{border-style:solid;border-color:var(--acc);background:var(--tint)}
.mch.skip{font-size:16px;color:var(--muted)}
/* step 4 */
.fin{display:grid;grid-template-columns:1fr 360px;gap:20px}
.fin.nor{grid-template-columns:1fr}
@media (max-width:1100px){.fin{grid-template-columns:1fr}}
.fsvg{display:block;width:100%;height:auto;border-radius:var(--r);box-shadow:var(--shadow)}
.ftxt h2{margin-bottom:8px}.ftxt .l{font-size:20px;font-weight:700;margin:4px 0}
.ftxt .st{border-top:2px dashed var(--line);margin-top:12px;padding-top:10px;font-size:19px;line-height:1.35}
.ftxt .st b{color:var(--acc)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.rv{display:grid;gap:8px;margin-top:10px}
.rv button{text-align:left;border:0;background:var(--panel2);border-radius:14px;padding:10px 14px;font-weight:800;font-size:17px}
.rv button small{display:block;color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
/* modal */
.ovl{position:fixed;inset:0;background:rgba(15,22,40,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--panel);border-radius:26px;box-shadow:var(--shadow);padding:22px 26px;max-width:860px;width:100%;max-height:92vh;overflow:auto}
.dlg.q{text-align:center;max-width:1000px;padding:44px}
.dlg.q .big{font-family:'Baloo 2',sans-serif;font-size:clamp(34px,6vw,70px);font-weight:800;line-height:1.1}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.cg{border:3px solid var(--line);background:var(--panel2);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:15px;text-align:center}
.cg.on{border-color:var(--acc);background:var(--tint)}
.clist{max-height:46vh;overflow:auto;display:grid;gap:6px;margin-top:8px}
.clist button{display:flex;align-items:center;gap:12px;border:0;background:var(--panel2);border-radius:12px;padding:7px 12px;font-weight:800;font-size:17px;text-align:left}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 20px;font-weight:800;z-index:80}
.flag{display:block;border-radius:5px;flex:none}
@media print{body{background:#fff!important}.top,.foot,.tools,.acts,.noprint,.ovl{display:none!important}main{padding:0;max-width:none}.fin{grid-template-columns:1fr}.fsvg{box-shadow:none}.panel{box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
/* ====================== UTILITIES ====================== */
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let UIDN=0;const U=()=>'g'+(++UIDN);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function rng(seed){let s=seed>>>0||1;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
const FONT="Nunito,'Trebuchet MS','Segoe UI',Arial,sans-serif",FONTH="'Baloo 2',Nunito,'Trebuchet MS',Arial,sans-serif";

/* ====================== DATES ====================== */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WEEK=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const mkDate=(y,m,d)=>{const t=new Date(2000,0,1);t.setFullYear(y,m-1,d);return t};
const dim=(y,m)=>mkDate(y,m+1,0).getDate();
function ord(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
const seasonOf=m=>m>=3&&m<=5?'spring':m>=6&&m<=8?'summer':m>=9&&m<=11?'autumn':'winter';
const pad=n=>String(n).padStart(2,'0');

/* ====================== DATA ====================== */
const SKINS=[['#fde0c9','Light'],['#f3c29b','Fair'],['#d99a6c','Tan'],['#b5733f','Brown'],['#7c4a2a','Deep']];
const HAIRC=[['#1d1a1a','Black'],['#6b4226','Brown'],['#e3b85b','Blonde'],['#c8571e','Ginger']];
const SHIRTS=['#e5484d','#f59f00','#2f9e44','#1c7ed6','#7048e8','#e64980','#12b886','#fd7e14'];
const STYLES={boy:[['short','Short'],['spiky','Spiky'],['curly','Curly'],['side','Side part']],girl:[['ponytail','Ponytail'],['pigtails','Pigtails'],['long','Long'],['bun','Bun']]};
const WEATHER=[
 {k:'sunny',l:'Sunny',g:'sky',core:1},{k:'cloudy',l:'Cloudy',g:'sky',core:1},{k:'rainy',l:'Rainy',g:'sky',core:1},{k:'windy',l:'Windy',g:'sky',core:1},{k:'snowy',l:'Snowy',g:'sky',core:1},{k:'foggy',l:'Foggy',g:'sky',core:1},
 {k:'stormy',l:'Stormy',g:'sky'},{k:'hot',l:'Hot',g:'temp'},{k:'cold',l:'Cold',g:'temp'},{k:'warm',l:'Warm',g:'temp'},{k:'cool',l:'Cool',g:'temp'}];
const WL=Object.fromEntries(WEATHER.map(w=>[w.k,w]));
const WCONF=[['sunny','cloudy'],['sunny','rainy'],['sunny','snowy'],['sunny','foggy'],['sunny','stormy'],['rainy','snowy'],['rainy','foggy'],['snowy','foggy'],['snowy','stormy'],['rainy','stormy'],['cloudy','stormy'],['cloudy','foggy'],
 ['hot','cold'],['hot','cool'],['hot','warm'],['warm','cold'],['warm','cool'],['cool','cold'],['snowy','hot'],['snowy','warm'],['foggy','stormy']];
const wCompat=(a,b)=>!WCONF.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a));
const WBUT=[['sunny','cold'],['sunny','cool'],['cloudy','warm'],['cloudy','hot'],['rainy','warm'],['rainy','hot'],['foggy','warm'],['foggy','hot'],['stormy','warm'],['stormy','hot'],['windy','hot']];
const MOODS=[
 {k:'happy',l:'Happy',t:'feel',pos:1},{k:'sad',l:'Sad',t:'feel'},{k:'excited',l:'Excited',t:'feel',pos:1},{k:'scared',l:'Scared',t:'feel'},{k:'nervous',l:'Nervous',t:'feel'},{k:'stressed',l:'Stressed',t:'feel'},{k:'calm',l:'Calm',t:'feel',pos:1},
 {k:'sleepy',l:'Sleepy',t:'body'},{k:'tired',l:'Tired',t:'body'},{k:'hungry',l:'Hungry',t:'body'},{k:'thirsty',l:'Thirsty',t:'body'},{k:'hot',l:'Hot',t:'body'},{k:'cold',l:'Cold',t:'body'},{k:'okay',l:'Okay',t:'body',pos:1}];
const ML=Object.fromEntries(MOODS.map(m=>[m.k,m]));
const MCONF=[['happy','sad'],['excited','sad'],['calm','stressed'],['calm','nervous'],['calm','scared'],['calm','excited'],['hot','cold'],['okay','sad'],['okay','happy'],['okay','excited'],['sleepy','excited']];
const mCompat=(a,b)=>!MCONF.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a));
const COUNTRIES=[['ua','Ukraine'],['de','Germany'],['fr','France'],['pl','Poland'],['nl','Netherlands',1],['be','Belgium'],['cz','Czechia'],['sk','Slovakia'],['gb','United Kingdom',1],['it','Italy'],['es','Spain'],['at','Austria'],['ro','Romania'],['ch','Switzerland'],['dk','Denmark'],['se','Sweden'],['no','Norway'],['pt','Portugal'],['ie','Ireland'],['hu','Hungary']].map(([c,n,the])=>({c,n,the:!!the}));
const OTHERS=[['al','Albania'],['ad','Andorra'],['ar','Argentina'],['am','Armenia'],['au','Australia'],['az','Azerbaijan'],['by','Belarus'],['ba','Bosnia and Herzegovina'],['br','Brazil'],['bg','Bulgaria'],['ca','Canada'],['cl','Chile'],['cn','China'],['co','Colombia'],['hr','Croatia'],['cy','Cyprus'],['eg','Egypt'],['ee','Estonia'],['fi','Finland'],['ge','Georgia'],['gr','Greece'],['is','Iceland'],['in','India'],['id','Indonesia'],['il','Israel'],['jp','Japan'],['kz','Kazakhstan'],['lv','Latvia'],['li','Liechtenstein'],['lt','Lithuania'],['lu','Luxembourg'],['mt','Malta'],['mx','Mexico'],['md','Moldova'],['me','Montenegro'],['ma','Morocco'],['nz','New Zealand'],['mk','North Macedonia'],['rs','Serbia'],['si','Slovenia'],['za','South Africa'],['kr','South Korea'],['th','Thailand'],['tr','Turkey'],['ae','United Arab Emirates',1],['us','United States',1],['uz','Uzbekistan'],['vn','Vietnam']].map(([c,n,the])=>({c,n,the:!!the}));
const ALLC=COUNTRIES.concat(OTHERS);

 else b=Array.from({length:3},(_,i)=>`<path d="M50 8V92M50 20l-8-8M50 20l8-8M50 80l-8 8M50 80l8 8" stroke="#6b8de8" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(${i*60} 50 50)"/>`).join('')+'<circle cx="50" cy="50" r="6" fill="#d0ebff" stroke="#6b8de8" stroke-width="3"/>';
 return`<svg viewBox="0 0 100 100" width="${sz}" height="${sz}" aria-hidden="true">${b}</svg>`}
const logoSVG='<svg viewBox="0 0 40 40" width="38" height="38"><rect x="3" y="7" width="34" height="30" rx="7" fill="#fff" stroke="#c9d1de" stroke-width="2"/><path d="M3 14a7 7 0 0 1 7-7h20a7 7 0 0 1 7 7v4H3Z" fill="#e5484d"/><rect x="11" y="2" width="4" height="9" rx="2" fill="#5f6b7a"/><rect x="25" y="2" width="4" height="9" rx="2" fill="#5f6b7a"/><circle cx="20" cy="28" r="6" fill="#ffd43b"/></svg>';
function header(){const ready=S.started;
 return`<header class="top noprint"><div class="logo">${logoSVG}Daily Calendar</div><nav class="steps" aria-label="Steps">${STEPS.map((t,i)=>`<button class="stp ${S.step===i?'on':i<S.step?'done':''}" data-a="go" data-i="${i}" ${i>S.maxStep?'disabled':''}><b>${i<S.step?'✓':i+1}</b>${t}</button>`).join('')}</nav>
 <div class="tools"><div class="seg" title="Difficulty"><button class="${S.level==='simple'?'on':''}" data-a="level" data-v="simple">Simple</button><button class="${S.level==='challenge'?'on':''}" data-a="level" data-v="challenge">Challenge</button></div><button class="ib" data-a="settings" title="Settings" aria-label="Settings">⚙</button></div></header>`}
function footer(){const s=S.step;if(s===4)return'';const labels=['Continue','Continue to Weather','Continue to Mood','Build our calendar'];
 const blocked=s===0&&students().some(x=>!x.name.trim());
 return`<footer class="foot noprint"><div>${s>0?'<button class="btn" data-a="back">← Back</button>':''}</div><div style="display:flex;align-items:center;gap:14px">${blocked?'<span class="hint">Add a name for every student to continue.</span>':''}<button class="btn pri big" data-a="next" ${blocked?'disabled':''}>${labels[s]} →</button></div></footer>`}
function render(){document.body.dataset.season=season();const m=$('#main'),sy=window.scrollY;
 $('#app').innerHTML=header()+`<main id="main">${[stepStudents,stepCalendar,stepWeather,stepMood,stepFinal][S.step]()}</main>`+footer();save()}

/* ---------- step 0 ---------- */
function headSVG(st,w){return`<svg viewBox="30 12 140 140" width="${w}" height="${w}" aria-hidden="true">${avatarG(st,{exp:'happy'})}</svg>`}
function stepStudents(){
 return`<section><h1>Meet our students!</h1><p class="sub">Choose how many students and give each one a name and a look.</p>
 <div class="cnt" role="group" aria-label="Number of students">${[1,2,3,4].map(n=>`<button class="cntb ${S.n===n?'on':''}" data-a="n" data-v="${n}"><span class="num">${n}</span>${n===1?'student':'students'}</button>`).join('')}</div>
 <div class="sgrid">${students().map(studentCard).join('')}</div></section>`}
function studentCard(st,i){const types=['boy','girl'];
 const tb=types.map(t=>{const o=Object.assign({},st,{type:t,style:STYLES[t].some(x=>x[0]===st.style)?st.style:STYLES[t][0][0]});return`<button class="typb ${st.type===t?'on':''}" data-a="type" data-i="${i}" data-v="${t}" aria-label="${t}">${avatarSVG(o,{exp:'happy'},74)}${t==='boy'?'Boy':'Girl'}</button>`}).join('');
 return`<div class="scard"><div class="big-av" data-pv="${i}">${avatarSVG(st,{exp:'happy',pose:'wave'},138)}</div><div>
 <div class="lab" style="margin-top:0">Name</div><input class="nm" data-in="name" data-i="${i}" value="${esc(st.name)}" placeholder="Student ${i+1} name" maxlength="18" autocomplete="off" aria-label="Name of student ${i+1}">
 <div class="lab">Avatar</div><div class="typ">${tb}</div>
 <div class="lab">Skin tone</div><div class="sw">${SKINS.map(([c,n])=>`<button class="swb ${st.skin===c?'on':''}" style="background:${c}" data-a="skin" data-i="${i}" data-v="${c}" title="${n}" aria-label="${n} skin"></button>`).join('')}</div>
 <div class="lab">Hair color</div><div class="sw">${HAIRC.map(([c,n])=>`<button class="swb ${st.hair===c?'on':''}" style="background:${c}" data-a="hair" data-i="${i}" data-v="${c}" title="${n}" aria-label="${n} hair"></button>`).join('')}</div>
 <div class="lab">Hairstyle</div><div class="sw">${STYLES[st.type].map(([k,n])=>`<button class="stb ${st.style===k?'on':''}" data-a="style" data-i="${i}" data-v="${k}" title="${n}">${headSVG(Object.assign({},st,{style:k}),52)}${n}</button>`).join('')}</div>
 <div class="lab">Clothing color</div><div class="sw">${SHIRTS.map(c=>`<button class="swb ${st.shirt===c?'on':''}" style="background:${c}" data-a="shirt" data-i="${i}" data-v="${c}" aria-label="Clothing color"></button>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="tog ${st.glasses?'on':''}" data-a="glasses" data-i="${i}" aria-pressed="${st.glasses}">👓 Glasses ${st.glasses?'on':'off'}</button><label class="sub">Pronoun <select class="sel" data-in="pron" data-i="${i}"><option value="auto" ${st.pron==='auto'?'selected':''}>auto</option><option value="he" ${st.pron==='he'?'selected':''}>he</option><option value="she" ${st.pron==='she'?'selected':''}>she</option><option value="they" ${st.pron==='they'?'selected':''}>they</option></select></label></div></div></div>`}

/* ---------- sentences UI ---------- */
function sentField(kind,i,key,label,val,edited,frames){
 return`<div class="sent"><div class="lab">${label}</div><div class="sin"><input data-in="sent" data-k="${kind}" data-i="${i}" data-key="${key}" value="${esc(val)}" class="${edited?'ed':''}" aria-label="${esc(label)}"><button class="rst" data-a="rst" data-k="${kind}" data-i="${i}" data-key="${key}" title="Reset to suggested sentence" aria-label="Reset sentence">↺</button></div>
 <div class="fr">${(frames||[]).map((f,j)=>`<button data-a="frame" data-k="${kind}" data-i="${i}" data-key="${key}" data-j="${j}">${esc(f)}</button>`).join('')}</div></div>`}
const calEdited=k=>!!(S.csent[k]&&S.csent[k].edited);
const stEdited=(st,k)=>!!(st.sent[k]&&st.sent[k].edited);

/* ---------- step 1 ---------- */
function calSceneSVG(){const se=season(),d=S.date,wk=DAYS[dateObj().getDay()],W=640,H=540;
 return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calendar scene: ${wk}, ${MONTHS[d.m-1]} ${d.d}, ${d.y}, ${se}">${seasonBG(se,d.m,W,H)}${calCard(40,230,1.15,{wk,day:d.d,mon:MONTHS[d.m-1],year:d.y})}
 <g transform="translate(18 18)"><rect width="190" height="54" rx="27" fill="#ffffffd9"/><g transform="translate(8 6)">${seasonIcon(se,42).replace('<svg ','<svg x="0" y="0" ')}</g><text x="60" y="36" font-size="26" font-weight="800" fill="#2b3445" font-family="${FONTH}">${SEAS[se].name}</text></g></svg>`}
function stepCalendar(){const d=S.date,cur=WEEK[(dateObj().getDay()+6)%7],iso=`${d.y}-${pad(d.m)}-${pad(d.d)}`,auto=seasonOf(d.m);
 const fld=[['day','Day of the week'],['date','Date'],['year','Year'],['season','Season']];
 return`<section class="cal"><div class="panel"><h2>Our Daily Calendar</h2><p class="sub">Choose the date. Every change updates the picture.</p>
 <div class="lab">Date</div><div class="row"><input type="date" class="inp" id="dp" value="${iso}" min="1900-01-01" max="2100-12-31" aria-label="Date"><button class="btn sm" data-a="today">Today</button></div>
 <div class="lab">Day of the week</div><div class="wk">${WEEK.map(w=>`<button class="${w===cur?'on':''}" data-a="wd" data-v="${w}">${w.slice(0,3)}</button>`).join('')}</div>
 <div class="row"><label class="sub">Day <select class="sel" data-in="dom">${Array.from({length:dim(d.y,d.m)},(_,i)=>`<option ${d.d===i+1?'selected':''}>${i+1}</option>`).join('')}</select></label>
 <label class="sub">Month <select class="sel" data-in="mon">${MONTHS.map((m,i)=>`<option value="${i+1}" ${d.m===i+1?'selected':''}>${m}</option>`).join('')}</select></label>
 <label class="sub">Year <button class="btn sm" data-a="yr" data-v="-1" aria-label="Previous year">−</button> <input class="inp" data-in="year" value="${d.y}" size="4" style="width:84px;text-align:center" inputmode="numeric" aria-label="Year"> <button class="btn sm" data-a="yr" data-v="1" aria-label="Next year">+</button></label></div>
 <div class="lab">Season ${S.seasonManual?`<span class="sub">(chosen by teacher)</span>`:`<span class="sub">(from the month)</span>`}</div><div class="seas">${['spring','summer','autumn','winter'].map(k=>`<button class="seasb ${season()===k?'on':''}" data-a="season" data-v="${k}">${seasonIcon(k,26)}${SEAS[k].name}</button>`).join('')}${S.seasonManual?`<button class="btn sm" data-a="season" data-v="auto">↺ Auto (${SEAS[auto].name})</button>`:''}</div>
 <div class="lab">Date format</div><div class="seg"><button class="${S.fmt==='uk'?'on':''}" data-a="fmt" data-v="uk">British: the 12th of October</button><button class="${S.fmt==='us'?'on':''}" data-a="fmt" data-v="us">American: October 12th</button></div>
 <div style="margin-top:8px">${fld.map(([k,l])=>sentField('c',0,k,l,calSent(k),calEdited(k),FRAMES[k])).join('')}</div></div>
 <div class="scene"><div class="sceneb" id="calscene">${calSceneSVG()}</div></div></section>`}

/* ---------- step 2 ---------- */
function wCardScene(st){return`<svg viewBox="0 0 400 330" role="img" aria-label="Weather scene for ${esc(sName(st))}">${weatherG(st,st.weather,season())}</svg>`}
function countryBtn(st,i){return`<button class="cbtn" data-a="country" data-i="${i}">${flagSVG(st.country,30)}<span>${st.country?esc(cName(st.country)):'Choose a country'}</span><span style="margin-left:auto;color:var(--muted)">▾</span></button>`}
function weatherChips(st,i){const mk=w=>{const o=st.weather.indexOf(w.k);return`<button class="chp ${o>=0?'on':''}" data-a="w" data-i="${i}" data-k="${w.k}" aria-pressed="${o>=0}">${wIcon(w.k,30)}${w.l}${o>=0&&st.weather.length>1?`<span class="o">${o+1}</span>`:''}</button>`};
 return`<div class="lab">Weather <span class="sub" style="text-transform:none;letter-spacing:0">(choose 1 or 2)</span></div><div class="chips">${WEATHER.filter(w=>w.core).map(mk).join('')}</div><div class="chips" style="margin-top:6px">${WEATHER.filter(w=>!w.core).map(mk).join('')}</div>`}
function wCard(st,i){const ch=S.level==='challenge';
 return`<article class="wcard" data-card="${i}"><div class="wh">${headSVG(st,52)}<h3>${esc(sName(st))}</h3><span class="tagp">Practice weather</span></div>
 <div class="wscene" data-sc="${i}">${wCardScene(st)}</div>
 <div class="lab" style="margin:2px 0">Country</div>${countryBtn(st,i)}
 <div class="lab" style="margin:2px 0">City (optional)</div><input class="inp" data-in="city" data-i="${i}" value="${esc(st.city)}" placeholder="e.g. a city name" maxlength="28" style="width:100%" aria-label="City of ${esc(sName(st))}">
 ${weatherChips(st,i)}
 <div>${sentField('s',i,'live','I live…',sentOf(st,'live'),stEdited(st,'live'),FRAMES.live)}${sentField('s',i,'w1','The weather…',sentOf(st,'w1'),stEdited(st,'w1'),FRAMES.w1)}${ch?sentField('s',i,'w2','Longer sentence',sentOf(st,'w2'),stEdited(st,'w2'),FRAMES.w2):''}</div></article>`}
function stepWeather(){return`<section><h1>What's the weather like?</h1><div class="qs noprint">${QS_WEATHER.map(q=>`<button class="qc" data-a="bigq" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
 <div class="wgrid n${S.n}">${students().map(wCard).join('')}</div></section>`}

/* ---------- step 3 ---------- */
function stepMood(){const ss=students(),i=Math.min(S.moodIdx,ss.length-1),st=ss[i];
 const exp=st.skip?'neutral':((['happy','sad','excited','scared','nervous','stressed','calm'].find(k=>st.mood.includes(k)))||st.mood[0]||'neutral');
 const pose=st.skip?'idle':(MPOSE[st.mood[0]]||'idle');
 const main=st.mood[0];
 const chip=m=>{const o=st.mood.indexOf(m.k);return`<button class="mch ${m.t==='body'?'body':''} ${o>=0?'on':''}" data-a="m" data-i="${i}" data-k="${m.k}" aria-pressed="${o>=0}">${moodIcon(m.k,38)}${m.l}</button>`};
 return`<section><h1>How are you feeling today?</h1>
 <div class="mtabs">${ss.map((s,j)=>`<button class="mtab ${j===i?'on':''}" data-a="mtab" data-i="${j}">${headSVG(s,40)}${esc(sName(s))}${s.skip?' <span class="sub">(skipped)</span>':s.mood.length?` <span class="sub">· ${esc(mWords(s.mood))}</span>`:''}</button>`).join('')}</div>
 <div class="mood"><div class="mstage">${avatarSVG(st,{exp,pose},300)}${main&&!st.skip?`<div class="mi">${moodIcon(main,92)}</div>`:''}</div>
 <div class="panel"><h2>${esc(sName(st))}: choose how you feel</h2><p class="sub">Choose one or two words. You can skip if you don't want to say.</p>
 <div class="lab">Feelings</div><div class="mchips">${MOODS.filter(m=>m.t==='feel').map(chip).join('')}</div>
 <div class="lab">Body (physical states)</div><div class="mchips">${MOODS.filter(m=>m.t==='body').map(chip).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="mch skip ${st.skip?'on':''}" data-a="mskip" data-i="${i}">Skip this question</button>${st.mood.length||st.skip?`<button class="mch skip" data-a="mclear" data-i="${i}">Clear</button>`:''}</div>
 ${sentField('s',i,'mood','Our sentence',sentOf(st,'mood'),stEdited(st,'mood'),FRAMES.mood)}</div></div></section>`}

/* ---------- step 4 ---------- */
function cut(t,n){t=String(t);return t.length>n?t.slice(0,n-1)+'…':t}
const embed=(svg,x,y)=>svg.replace('<svg ',`<svg x="${x}" y="${y}" `);
function finalSVG(){const ss=students(),n=ss.length,W=1600,H=900,se=season(),mo=S.date.m,T=finalText();
 let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="fsvg" role="img" aria-label="Our Daily Calendar">${seasonBG(se,mo,W,H)}`;
 s+=`<g><rect x="250" y="22" width="1100" height="170" rx="34" fill="#fff" opacity=".93"/><g transform="translate(290 42)">${seasonIcon(se,120)}</g><text x="840" y="82" text-anchor="middle" font-size="50" font-weight="800" fill="#25324a" font-family="${FONTH}">${esc(T.title)}</text><text x="840" y="128" text-anchor="middle" font-size="31" font-weight="800" fill="#e5484d" font-family="${FONTH}">${esc(T.l1)}</text><text x="840" y="170" text-anchor="middle" font-size="27" font-weight="700" fill="#4a5870" font-family="${FONTH}">${esc(T.l2)}</text></g>`;
 const zw=n===1?600:n===2?560:n===3?480:350,gap=n===4?24:34,total=n*zw+(n-1)*gap,x0=(W-total)/2,sc=zw/400,zy=222,zh=330*sc,py=zy+zh+22;
 if(n>1){let p='';ss.forEach((_,i)=>{const cx=x0+i*(zw+gap)+50,cy=py+36;p+=(i?` Q ${cx-(zw+gap)/2} ${cy-46} ${cx} ${cy}`:`M ${cx} ${cy}`)});s+=`<path d="${p}" stroke="#fff" stroke-width="7" stroke-dasharray="4 14" stroke-linecap="round" fill="none" opacity=".95"/>`}
 ss.forEach((st,i)=>{const x=x0+i*(zw+gap);
  s+=`<rect x="${x-8}" y="${zy-8}" width="${zw+16}" height="${zh+16}" rx="${26*sc+8}" fill="#fff" opacity=".96"/><g transform="translate(${x} ${zy}) scale(${sc})">${weatherG(st,st.weather,se)}</g>`;
  const nm=cut(sName(st),14),pw=40+nm.length*17;
  s+=`<g transform="translate(${x+14} ${zy+14})"><rect width="${pw}" height="44" rx="22" fill="#ffffffe6"/><text x="${pw/2}" y="31" text-anchor="middle" font-size="26" font-weight="800" fill="#25324a" font-family="${FONTH}">${esc(nm)}</text></g>`;
  s+=`<rect x="${x}" y="${py}" width="${zw}" height="150" rx="24" fill="#fff" opacity=".95"/>`;
  s+=embed(flagSVG(st.country,44),x+16,py+14);
  const cn=st.country?cName(st.country):'Country?',place=(st.city.trim()?st.city.trim()+(st.country?', ':'')+'':'')+(st.country?cn:'');
  s+=`<text x="${x+96}" y="${py+40}" font-size="${(place||cn).length>20?22:27}" font-weight="800" fill="${st.country?'#25324a':'#8a97a8'}" font-family="${FONTH}">${esc(cut(st.city.trim()?place:cn,26))}</text>`;
  if(st.weather.length){let ix=x+16;st.weather.forEach(k=>{s+=embed(wIcon(k,36),ix,py+64);ix+=40});s+=`<text x="${ix+6}" y="${py+90}" font-size="23" font-weight="800" fill="#4a5870" font-family="${FONTH}">${esc(cut(cap(wPhrase(st.weather)),24))}</text>`}
  else s+=`<text x="${x+16}" y="${py+90}" font-size="22" font-weight="700" fill="#8a97a8" font-family="${FONTH}">Weather?</text>`;
  if(st.skip)s+=`<text x="${x+16}" y="${py+132}" font-size="22" font-weight="700" fill="#8a97a8" font-family="${FONTH}">Mood: skipped</text>`;
  else if(st.mood.length){s+=embed(moodIcon(st.mood[0],36),x+16,py+104)+`<text x="${x+62}" y="${py+131}" font-size="23" font-weight="800" fill="#e5484d" font-family="${FONTH}">${esc(cut(cap(mWords(st.mood)),26))}</text>`}
  else s+=`<text x="${x+16}" y="${py+132}" font-size="22" font-weight="700" fill="#8a97a8" font-family="${FONTH}">Mood?</text>`;
  });
 return s+'</svg>'}
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
function stepFinal(){const T=finalText(),rv=S.review;
 return`<section><div class="acts noprint" style="margin-top:0"><button class="btn pri" data-a="editmenu">← Back to Edit</button><button class="btn ${rv?'pri':''}" data-a="review">${rv?'Hide':'Show'} speaking review</button><button class="btn" data-a="png">⬇ Download PNG</button><button class="btn" data-a="print">🖨 Print</button><button class="btn" data-a="newcal">＋ New calendar</button></div>
 <div class="fin ${rv?'':'nor'}"><div id="finalwrap">${finalSVG()}
 <div class="panel ftxt" style="margin-top:18px"><h2>${esc(T.title)}</h2><div class="l">${esc(T.l1)}</div><div class="l">${esc(T.l2)}</div>${T.stu.map(({st,lines})=>`<div class="st"><b>${esc(sName(st))}</b> — ${lines.map(esc).join(' ')}</div>`).join('')}</div></div>
 ${rv?`<aside class="panel noprint"><h2>Speaking review</h2><p class="sub">Click a question to show it in big letters.</p><div class="rv">${reviewPrompts().map((p,i)=>`<button data-a="bigq" data-q="${esc(p.q)}" data-ans="${esc(p.a)}"><small>${esc(p.g)}</small>${esc(p.q)}</button>`).join('')}</div></aside>`:''}</div></section>`}

/* ---------- modal ---------- */
function openModal(h,cls){$('#modal').innerHTML=`<div class="ovl" data-a="mclose" role="dialog" aria-modal="true"><div class="dlg ${cls||''}" data-stop="1">${h}</div></div>`}
function closeModal(){$('#modal').innerHTML=''}
let CB=null;
function ask(msg,yes,cb){CB=cb;openModal(`<h2>${msg}</h2><div class="acts" style="justify-content:flex-end"><button class="btn" data-a="mclose">Cancel</button><button class="btn pri" data-a="mok">${yes}</button></div>`)}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function countryDialog(i,search){const st=S.students[i];
 if(!search)return openModal(`<h2>${esc(sName(st))}: choose a country</h2><div class="cgrid">${COUNTRIES.map(c=>`<button class="cg ${st.country===c.c?'on':''}" data-a="pickc" data-i="${i}" data-c="${c.c}">${flagSVG(c.c,40)}${esc(c.n)}</button>`).join('')}<button class="cg" data-a="otherc" data-i="${i}"><svg viewBox="0 0 60 40" width="60" height="40"><rect width="60" height="40" rx="5" fill="#dfe6ee"/><circle cx="30" cy="20" r="14" fill="#8fb8de"/><path d="M16 20h28M30 6c-7 8-7 20 0 28M30 6c7 8 7 20 0 28" stroke="#fff" stroke-width="1.5" fill="none"/></svg>Other country…</button></div><div class="acts" style="justify-content:space-between">${st.country?`<button class="btn" data-a="pickc" data-i="${i}" data-c="">Clear country</button>`:'<span></span>'}<button class="btn" data-a="mclose">Close</button></div>`);
 openModal(`<h2>Other country</h2><input class="inp" id="csearch" data-in="csearch" data-i="${i}" placeholder="Type to search…" style="width:100%;font-size:20px" autocomplete="off"><div class="clist" id="clist">${clistHTML(i,'')}</div><div class="acts" style="justify-content:space-between"><button class="btn" data-a="country" data-i="${i}">← Back</button><button class="btn" data-a="mclose">Close</button></div>`);setTimeout(()=>{const e=$('#csearch');e&&e.focus()},30)}
function clistHTML(i,q){q=q.trim().toLowerCase();const l=ALLC.filter(c=>!q||c.n.toLowerCase().includes(q)).sort((a,b)=>a.n.localeCompare(b.n));return l.length?l.map(c=>`<button data-a="pickc" data-i="${i}" data-c="${c.c}">${flagSVG(c.c,30)}${esc(c.n)}${hasFlag(c.c)?'':' <span class="sub">(no flag artwork yet)</span>'}</button>`).join(''):'<p class="sub">No country found.</p>'}
function settingsDialog(){openModal(`<h2>Settings</h2><div class="lab">Date format</div><div class="seg"><button class="${S.fmt==='uk'?'on':''}" data-a="fmt" data-v="uk" data-keep="1">British: the 12th of October</button><button class="${S.fmt==='us'?'on':''}" data-a="fmt" data-v="us" data-keep="1">American: October 12th</button></div>
 <div class="lab">Mode</div><div class="seg"><button class="${S.level==='simple'?'on':''}" data-a="level" data-v="simple" data-keep="1">Simple</button><button class="${S.level==='challenge'?'on':''}" data-a="level" data-v="challenge" data-keep="1">Challenge</button></div>
 <p class="sub">Simple: short sentences, one idea at a time. Challenge: longer sentences, two weather words, extra questions.</p>
 <div class="acts" style="justify-content:space-between;margin-top:22px"><button class="btn" data-a="newcal">＋ Start New Calendar</button><button class="btn pri" data-a="mclose">Done</button></div>`)}
function startDialog(sv){openModal(`<h1>Daily Calendar</h1><p class="sub" style="font-size:20px">Welcome back! A previous calendar was saved in this browser.</p><div class="acts" style="margin-top:18px"><button class="btn pri big" data-a="cont">Continue Previous Calendar</button><button class="btn big" data-a="fresh">Start New Calendar</button></div>`)}

/* ---------- actions ---------- */
function go(i){S.step=clamp(i,0,4);S.maxStep=Math.max(S.maxStep,S.step);S.started=true;render();window.scrollTo(0,0)}
function updateSentInputs(){$$('input[data-in=sent]').forEach(inp=>{const k=inp.dataset.k,key=inp.dataset.key;let v,ed;if(k==='c'){v=calSent(key);ed=calEdited(key)}else{const st=S.students[+inp.dataset.i];if(!st)return;v=sentOf(st,key);ed=stEdited(st,key)}if(document.activeElement!==inp)inp.value=v;inp.classList.toggle('ed',ed)})}
function patchCalScene(){const e=$('#calscene');if(e)e.innerHTML=calSceneSVG();document.body.dataset.season=season()}
function patchCard(i){const st=S.students[i],c=$(`[data-sc="${i}"]`);if(c)c.innerHTML=wCardScene(st)}
function frameApply(k,i,key,j){const fr=FRAMES[key][j];if(k==='c')S.csent[key]={edited:true,text:fr};else S.students[i].sent[key]={edited:true,text:fr};save();updateSentInputs();const inp=$(`input[data-in=sent][data-k="${k}"][data-i="${i}"][data-key="${key}"]`);if(inp){inp.value=fr;inp.focus();const p=fr.indexOf('___');if(p>=0)inp.setSelectionRange(p,p+3)}}
function newCalendar(){const prev=S.level,fmt=S.fmt;S=freshState();S.level=prev;S.fmt=fmt;S.started=true;closeModal();render();window.scrollTo(0,0)}
function exportPNG(){try{const svg=finalSVG(),url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'})),img=new Image();
 img.onload=()=>{try{const c=document.createElement('canvas');c.width=1600;c.height=900;c.getContext('2d').drawImage(img,0,0,1600,900);c.toBlob(b=>{if(!b)return toast('PNG export is not available here. Please use Print.');const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='our-daily-calendar.png';document.body.appendChild(a);a.click();a.remove();toast('PNG saved')})}catch(e){toast('PNG export is not available here. Please use Print.')}};
 img.onerror=()=>toast('PNG export is not available here. Please use Print.');img.src=url}catch(e){toast('PNG export is not available here. Please use Print.')}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;
 if(t.dataset.a==='mclose'&&e.target.closest('[data-stop]')&&t.classList.contains('ovl')&&e.target!==t)return;
 const a=t.dataset.a,d=t.dataset,i=+d.i,st=S&&S.students[i];
 switch(a){
 case'mclose':closeModal();break;
 case'mok':{const f=CB;CB=null;closeModal();f&&f();break}
 case'cont':closeModal();render();break;
 case'fresh':newCalendar();break;
 case'go':if(+d.i<=S.maxStep)go(+d.i);break;
 case'next':go(S.step+1);break;
 case'back':go(S.step-1);break;
 case'n':{const n=+d.v;if(n===S.n)break;const apply=()=>{while(S.students.length<n)S.students.push(defaultStudent(S.students.length));S.students.length=n;S.students.forEach((s,k)=>s.idx=k);S.n=n;S.moodIdx=0;render()};
  if(n>S.n){apply();break}const lost=S.students.slice(n).filter(s=>s.name.trim()||s.country||s.weather.length||s.mood.length);
  if(lost.length)ask(`Remove ${lost.map(s=>esc(sName(s))).join(', ')}? Their information will be deleted.`,'Remove',apply);else apply();break}
 case'type':{st.type=d.v;if(!STYLES[st.type].some(x=>x[0]===st.style))st.style=STYLES[st.type][0][0];render();break}
 case'skin':st.skin=d.v;render();break;case'hair':st.hair=d.v;render();break;case'style':st.style=d.v;render();break;case'shirt':st.shirt=d.v;render();break;case'glasses':st.glasses=!st.glasses;render();break;
 case'level':S.level=d.v;if(d.keep)settingsDialog();render();if(d.keep)settingsDialog();break;
 case'fmt':S.fmt=d.v;render();if(d.keep)settingsDialog();break;
 case'settings':settingsDialog();break;
 case'today':{const t=new Date();setDate(t.getFullYear(),t.getMonth()+1,t.getDate());render();break}
 case'wd':goWeekday(d.v);render();break;
 case'yr':setDate(S.date.y+ +d.v,S.date.m,S.date.d);render();break;
 case'season':S.seasonManual=d.v==='auto'?null:d.v;render();break;
 case'rst':{if(d.k==='c')delete S.csent[d.key];else delete S.students[i].sent[d.key];save();updateSentInputs();break}
 case'frame':frameApply(d.k,i,d.key,+d.j);break;
 case'country':countryDialog(i,false);break;
 case'otherc':countryDialog(i,true);break;
 case'pickc':st.country=d.c;closeModal();render();break;
 case'w':toggleWeather(st,d.k);render();break;
 case'm':toggleMood(st,d.k);render();break;
 case'mtab':S.moodIdx=i;render();break;
 case'mskip':st.skip=!st.skip;if(st.skip)st.mood=[];render();break;
 case'mclear':st.mood=[];st.skip=false;render();break;
 case'bigq':openModal(`<div class="big">${esc(d.q)}</div>${d.ans?`<p class="sub" style="font-size:22px;margin-top:22px" id="ansb"><button class="btn" data-a="showans" data-ans="${esc(d.ans)}">Show answer</button></p>`:''}<div class="acts" style="justify-content:center"><button class="btn pri" data-a="mclose">Close</button></div>`,'q');break;
 case'showans':{const p=$('#ansb');if(p)p.innerHTML=`<b>${esc(d.ans)}</b>`;break}
 case'editmenu':openModal(`<h2>Back to Edit</h2><p class="sub">Nothing will be lost.</p><div class="acts"><button class="btn big" data-a="jump" data-i="0">1 · Students</button><button class="btn big" data-a="jump" data-i="1">2 · Calendar</button><button class="btn big" data-a="jump" data-i="2">3 · Weather</button><button class="btn big" data-a="jump" data-i="3">4 · Mood</button></div><div class="acts" style="justify-content:flex-end"><button class="btn" data-a="mclose">Close</button></div>`);break;
 case'jump':closeModal();go(+d.i);break;
 case'review':S.review=!S.review;render();break;
 case'png':exportPNG();break;
 case'print':try{window.print()}catch(er){toast('Printing is not available here.')}break;
 case'newcal':ask('Start a new calendar? The current calendar will be erased.','Start new',newCalendar);break;
 }});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset&&t.dataset.in;if(!k)return;const i=+t.dataset.i;
 if(k==='name'){S.students[i].name=t.value;save();$$(`[data-card="${i}"] h3`).forEach(h=>h.textContent=sName(S.students[i]));const f=$('.foot');if(f&&S.step===0)f.outerHTML=footer();return}
 if(k==='city'){S.students[i].city=t.value;save();updateSentInputs();return}
 if(k==='sent'){const kind=t.dataset.k,key=t.dataset.key,v={edited:true,text:t.value};if(kind==='c')S.csent[key]=v;else S.students[i].sent[key]=v;t.classList.add('ed');save();return}
 if(k==='csearch'){const l=$('#clist');if(l)l.innerHTML=clistHTML(i,t.value)}});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset&&t.dataset.in,i=+t.dataset.i;if(!k)return;
 if(k==='pron'){S.students[i].pron=t.value;save();return}
 if(k==='dom'){setDate(S.date.y,S.date.m,+t.value);render()}
 if(k==='mon'){setDate(S.date.y,+t.value,S.date.d);render()}
 if(k==='year'){setDate(+t.value,S.date.m,S.date.d);render()}
 if(t.id==='dp'){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(t.value);if(m){setDate(+m[1],+m[2],+m[3]);render()}}});
document.addEventListener('change',e=>{if(e.target.id==='dp'){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(e.target.value);if(m){setDate(+m[1],+m[2],+m[3]);render()}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
/* weather/mood changes also need patch-level updates for scene (full render keeps it simple) */
/* ---------- boot ---------- */
(function boot(){const sv=loadSaved();S=freshState();
 if(sv){S=Object.assign(freshState(),sv);S.students.forEach((s,i)=>{s.idx=i;s.sent=s.sent||{};s.weather=s.weather||[];s.mood=s.mood||[];s.country=s.country||'';s.city=s.city||''});S.n=clamp(S.n,1,4);S.students.length=S.n;
  render();if(S.started)startDialog(sv)}
 else render()})();

</script>
</body>
</html>
