<script>
/* ====================== UTIL ====================== */
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const toMin=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||'');return m?(+m[1])*60+(+m[2]):null};
const hhmm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
function pmT(t){const m=toMin(t);if(m==null)return'';let h=Math.floor(m/60),mm=m%60;const ap=h>=12?'PM':'AM';h=h%12||12;return mm?`${h}:${pad(mm)} ${ap}`:`${h} ${ap}`}
const NUMW=['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven'];
function spoken(t){const m=toMin(t),h=Math.floor(m/60),mm=m%60,h12=h%12||12;return mm?`${h12}:${pad(mm)}`:NUMW[h12%12]}
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const lowerFirst=s=>s?s.charAt(0).toLowerCase()+s.slice(1):s;
/* ====================== VERBS ====================== */
const BASEV=('meet go visit take attend play study have prepare work watch buy see call help join cook clean practise practice learn write read do make swim run ride pick book get bring send leave arrive start begin end finish open close depart come stay travel fly drive walk eat drink sleep return pay change catch miss check ask tell give show carry lend borrow wait phone text message email order collect hurry sit invite find use look turn move put hold wash tidy paint draw sing dance shop cycle ring post upload download decide say talk speak try forget remember save cancel bake celebrate rest relax revise win lose pack cheer').split(' ');
const IRR3={have:'has',go:'goes',do:'does'};
const third=b=>IRR3[b]||(/(s|sh|ch|x|z|o)$/.test(b)?b+'es':/[^aeiou]y$/.test(b)?b.slice(0,-1)+'ies':b+'s');
const DBL=['run','sit','get','swim','put','stop','plan','shop','begin','chat','cut','set','win','hit','travel'];
const ing=b=>DBL.includes(b)?b+b.slice(-1)+'ing':/ie$/.test(b)?b.slice(0,-2)+'ying':/[^e]e$/.test(b)?b.slice(0,-1)+'ing':b+'ing';
const BASE=new Set(BASEV),THIRDMAP={},INGMAP={};
BASEV.forEach(b=>{THIRDMAP[third(b)]=b;INGMAP[ing(b)]=b});INGMAP.traveling='travel';INGMAP.practicing='practise';INGMAP.practising='practise';INGMAP.travelling='travel';
const TTV=['leave','start','begin','end','finish','open','close','depart','arrive','run','come'];
const PLACES=['school','work','bed','town','home','church','university','college','the','a','an','my','your','his','her','our','their','london','paris','warsaw','berlin','kyiv','lviv','cinema','park','shop','shops','museum','concert','party','station','airport','gym','pool','beach','mall','supermarket','library','dentist','doctor','hospital','another','that','this'];
/* ====================== NORMALISE / ANALYSE ====================== */
function norm(t){return String(t||'').toLowerCase().replace(/[’‘`]/g,"'")
 .replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\bwon't\b/g,'will not').replace(/\bshan't\b/g,'shall not')
 .replace(/\b(is|are|do|does|did|was|were|has|have|had|would|should|could)n't\b/g,'$1 not')
 .replace(/\bi'm\b/g,'i am').replace(/\b(you|we|they)'re\b/g,'$1 are').replace(/\b(he|she|it|that|there|what|who|where|here)'s\b/g,'$1 is')
 .replace(/\b(i|you|he|she|it|we|they|that|there|who)'ll\b/g,'$1 will').replace(/\b(i|you|we|they)'ve\b/g,'$1 have').replace(/\blet's\b/g,'let us').replace(/'d\b/g,' would')

 s.forEach(e=>{if(cl.length&&toMin(e.start)>=end)flush();cl.push(e);end=Math.max(end,toMin(e.start)+evDur(e))});if(cl.length)flush();return out}

function setN(n){const old=S.players.length;if(n===old)return;const doIt=()=>{while(S.players.length<n)S.players.push(newPlayer(S.players.length));S.players.length=n;S.players.forEach((p,i)=>{p.color=p.color||COLORS[i]});S.n=n;if(S.cur>=n)S.cur=0;render()};
