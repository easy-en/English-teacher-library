<!DOCTYPE html>
<html lang="en">
<head>

<title>HEY, ARE YOU OK?</title>
<style>
:root{--bg:#eef3f6;--panel:#fff;--p2:#f1f6f8;--ink:#17323d;--mut:#5d7480;--line:#d9e4ea;--acc:#0e9aa7;--acc2:#0b7c87;--good:#1f9d6b;--warn:#e08a00;--shadow:0 8px 24px rgba(20,60,80,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0f2230;--panel:#16303f;--p2:#1c3a4b;--ink:#e8f3f7;--mut:#9db6c2;--line:#2a4a5b;--acc:#27c1cf;--acc2:#1fa8b6;--shadow:0 8px 24px rgba(0,0,0,.35)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Segoe UI','Trebuchet MS',system-ui,-apple-system,Arial,sans-serif;font-size:18px;color:var(--ink);background:#eef3f6;background:radial-gradient(900px 400px at 85% -10%,rgba(14,154,167,.18),transparent),var(--bg) fixed}
button,input{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,h4{margin:0 0 8px;line-height:1.15}h1{font-size:clamp(34px,6vw,54px);letter-spacing:.01em}h2{font-size:26px}h3{font-size:20px}h4{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
p{margin:6px 0}.sub{color:var(--mut);font-size:15px}
.wrap{max-width:1100px;margin:0 auto;padding:16px 18px 40px}.wrap.narrow{max-width:820px}
.hero{text-align:center;margin:14px 0 18px}.hero.small{margin:6px 0}.logo{display:flex;justify-content:center;gap:6px;margin-bottom:6px}.tag{font-size:19px;color:var(--mut);font-weight:600}
.card{background:var(--panel);border-radius:20px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}.card.center{text-align:center}
.btn{border:0;border-radius:14px;padding:10px 20px;font-weight:700;background:var(--p2);color:var(--ink);box-shadow:0 3px 0 var(--line)}.btn:active{transform:translateY(2px);box-shadow:none}.btn.pri{background:var(--acc);color:#fff;box-shadow:0 3px 0 var(--acc2)}.btn.big{font-size:20px;padding:13px 28px}.btn.sm{padding:6px 14px;font-size:15px;border-radius:11px}.btn:disabled{opacity:.45;cursor:default}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.inp{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 12px;font-weight:600;max-width:100%}
.cnt{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}.cntb{border:3px solid var(--line);background:var(--p2);border-radius:16px;padding:8px 22px;display:flex;flex-direction:column;align-items:center}.cntb b{font-size:28px;line-height:1}.cntb span{font-size:13px;color:var(--mut)}.cntb.on{border-color:var(--acc);background:rgba(14,154,167,.13)}
.plist{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.pl{background:var(--p2);border-radius:16px;padding:12px}.pl-h{display:flex;align-items:center;gap:10px}.pl-h .inp{flex:1;min-width:0}.avs{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.avb{border:3px solid transparent;background:var(--panel);border-radius:50%;padding:0;display:flex}.avb.on{border-color:var(--acc)}
.steps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}.stp{display:flex;align-items:center;gap:6px;background:var(--p2);border-radius:999px;padding:3px 12px 3px 4px;font-weight:700;opacity:.65}.stp.on{opacity:1;box-shadow:0 0 0 3px var(--acc)}.stp.dn i{color:var(--good);font-style:normal}
.big-av{display:flex;justify-content:center;margin:8px 0}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:10px 14px;margin-bottom:14px}.who{display:flex;align-items:center;gap:10px}.who b{display:block}.who span{font-size:13px;color:var(--mut)}.tools{display:flex;gap:8px;margin-left:auto}
.stages{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}.sg{display:flex;align-items:center;gap:6px;background:var(--p2);border-radius:999px;padding:3px 12px 3px 4px;font-weight:700;font-size:14px;color:var(--mut)}.sg b{width:24px;height:24px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:13px}.sg.on{background:rgba(14,154,167,.18);color:var(--ink)}.sg.on b{background:var(--acc);color:#fff}.sg.dn b{background:var(--good);color:#fff}
.bank{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.bank p{margin:3px 0;font-weight:600}
.grid{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}@media (max-width:760px){.grid{grid-template-columns:1fr}.friend{display:flex;align-items:center;gap:12px}.fav svg{width:110px;height:auto}}
.friend{text-align:center}.fav{border-radius:18px;padding:6px;background:linear-gradient(#e3f1f4,#fff7e6);transition:background .5s}.fav.confused,.fav.sad{background:linear-gradient(#f3e8e8,#fff3f0)}.fav.relieved{background:linear-gradient(#e6f5ee,#fff)}.fav.happy{background:linear-gradient(#e0f6ee,#fffbe6)}.fav svg{max-width:100%;height:auto;display:block;margin:0 auto}.status{color:var(--mut);font-size:14px;min-height:20px}
.msgs{min-height:240px;max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}.msgs.rv{max-height:55vh}
.msg{display:flex;gap:8px;align-items:flex-end}.msg.fresh{animation:pop .28s}.msg.me{justify-content:flex-end}.mh{flex:none;border-radius:50%;overflow:hidden;background:var(--p2);display:flex}
.bub{max-width:76%;padding:10px 14px;border-radius:18px;background:var(--p2);font-size:19px}.msg.me .bub{background:var(--acc);color:#fff;border-bottom-right-radius:5px}.msg.fr .bub{border-bottom-left-radius:5px}.msg.bad .bub{opacity:.7;outline:2px dashed rgba(255,255,255,.7);outline-offset:-4px;background:var(--mut)}
.typing{display:flex;gap:4px;padding:12px 16px;background:var(--p2);border-radius:16px}.typing i{width:8px;height:8px;border-radius:50%;background:var(--mut);animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.act{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;min-height:70px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}.opt{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 14px;text-align:left;font-weight:600;font-size:18px}.opt:hover:not(:disabled){border-color:var(--acc);background:rgba(14,154,167,.08)}.opt.used{opacity:.4;text-decoration:line-through}.opt:disabled{cursor:default}
.write{margin-top:12px}.write label{font-size:14px;font-weight:700;color:var(--mut)}.wrow{display:flex;gap:8px;margin-top:4px}.wrow .inp{flex:1;font-size:18px}
.hintb{background:rgba(224,138,0,.15);border-left:5px solid var(--warn);border-radius:10px;padding:9px 13px;margin:8px 0;font-weight:600}.good{background:rgba(31,157,107,.15);border-left:5px solid var(--good);border-radius:10px;padding:9px 13px;font-weight:700}
.unsure{background:var(--p2);border-radius:12px;padding:10px 14px;margin-top:10px}
.rep{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.ph{display:flex;align-items:center;gap:12px;margin-bottom:8px}.ph h3{margin:0}
.pbar{display:flex;gap:5px;margin:8px 0}.pbar i{flex:1;height:10px;border-radius:6px;background:var(--line)}.pbar i.on{background:var(--good)}
.rk{display:flex;gap:10px;margin:5px 0;color:var(--mut);font-weight:600}.rk b{color:var(--mut)}.rk.ok{color:var(--ink)}.rk.ok b{color:var(--good)}.rk em{font-style:normal;font-size:13px;background:var(--p2);border-radius:999px;padding:1px 9px;color:var(--mut)}
.nums{display:flex;gap:10px;margin:10px 0}.nums div{flex:1;background:var(--p2);border-radius:12px;padding:6px;text-align:center}.nums b{display:block;font-size:22px}.nums span{font-size:12px;color:var(--mut)}.enc{font-weight:600}
.sum .chips{display:flex;gap:8px;flex-wrap:wrap}.sum .chips span{background:rgba(14,154,167,.14);color:var(--acc2);border-radius:999px;padding:6px 14px;font-weight:700}
.ovl{position:fixed;inset:0;background:rgba(10,30,40,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}.dlg{background:var(--panel);border-radius:22px;box-shadow:var(--shadow);padding:20px 22px;max-width:640px;width:100%;max-height:92vh;overflow:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
/* ===== util ===== */
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let UIDN=0;const U=()=>'a'+(++UIDN);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
const FONTH="'Trebuchet MS','Segoe UI',Arial,sans-serif";
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
/* ===== look presets ===== */
const SK=['#fde0c9','#f3c29b','#d99a6c','#b5733f','#7c4a2a'],HR=['#1d1a1a','#6b4226','#e3b85b','#c8571e'],SHIRT=['#14a3a0','#e5484d','#f59f00','#2f6bff','#7048e8','#e64980','#2f9e44','#fd7e14'];
const PRESETS=[
 {type:'girl',skin:SK[1],hair:HR[1],style:'ponytail',shirt:SHIRT[0],glasses:false},{type:'boy',skin:SK[0],hair:HR[2],style:'short',shirt:SHIRT[3],glasses:false},
 {type:'girl',skin:SK[3],hair:HR[0],style:'bun',shirt:SHIRT[4],glasses:true},{type:'boy',skin:SK[2],hair:HR[0],style:'curly',shirt:SHIRT[1],glasses:false},
 {type:'girl',skin:SK[0],hair:HR[3],style:'pigtails',shirt:SHIRT[5],glasses:false},{type:'boy',skin:SK[4],hair:HR[0],style:'spiky',shirt:SHIRT[6],glasses:false},
 {type:'girl',skin:SK[2],hair:HR[1],style:'long',shirt:SHIRT[7],glasses:false},{type:'boy',skin:SK[1],hair:HR[1],style:'side',shirt:SHIRT[2],glasses:true}];
const looks=o=>Object.assign({idx:0,name:''},o);
const headSVG=(look,exp,w)=>`<svg viewBox="30 12 140 140" width="${w}" height="${w}" aria-hidden="true">${avatarG(looks(look),{exp:exp||'happy'})}</svg>`;
/* ====================== AVATARS ====================== */
const EXP={
 neutral:{eye:'open',brow:'flat',mouth:'smallSmile'},
 happy:{eye:'arc',brow:'up',mouth:'bigSmile',blush:'#ff8fa3'},
 sad:{eye:'sad',brow:'sad',mouth:'frown',tear:1,tilt:5},
 excited:{eye:'sparkle',brow:'high',mouth:'bigSmile',blush:'#ff8fa3'},
 scared:{eye:'wide',brow:'high',mouth:'o',sweat:1},
 nervous:{eye:'side',brow:'worried',mouth:'wavy',sweat:1,tilt:-3},
 stressed:{eye:'squint',brow:'angry',mouth:'teeth',steam:1},
 calm:{eye:'closed',brow:'soft',mouth:'smallSmile',blush:'#ffb3c1'},
 sleepy:{eye:'closed',brow:'droop',mouth:'yawn',zzz:1,tilt:6},
 tired:{eye:'half',brow:'droop',mouth:'flat',bags:1,tilt:4},
 hungry:{eye:'open',brow:'worried',mouth:'o',drool:1},
 thirsty:{eye:'half',brow:'flat',mouth:'tongue'},
 hot:{eye:'half',brow:'flat',mouth:'pant',sweat:1,blush:'#ff5a5a',heat:1},
 cold:{eye:'open',brow:'worried',mouth:'wavy',blush:'#8ec9ff',shiver:1},
 okay:{eye:'open',brow:'flat',mouth:'smallSmile'}};
const MPOSE={happy:'wave',excited:'up',scared:'head',nervous:'hug',stressed:'head',hungry:'tummy',hot:'fan',cold:'hug'};
const POSES={idle:{L:[[62,152],[48,196],[46,234]],R:[[138,152],[152,196],[154,234]]},wave:{R:[[138,152],[168,134],[178,98]]},up:{L:[[62,152],[34,122],[28,80]],R:[[138,152],[166,122],[172,80]]},
 hug:{L:[[62,152],[72,198],[114,190]],R:[[138,152],[128,198],[86,190]]},tummy:{R:[[138,152],[152,196],[116,202]]},head:{L:[[62,152],[38,122],[70,88]],R:[[138,152],[162,122],[130,88]]},
 fan:{R:[[138,152],[164,150],[150,112]]},umbrella:{R:[[138,152],[160,148],[168,126]]}};
const DARK='#2b2233';
function eyeSVG(cx,cy,k,dir,skin){
 switch(k){
  case'arc':return`<path d="M${cx-8} ${cy+3} Q${cx} ${cy-10} ${cx+8} ${cy+3}" stroke="${DARK}" stroke-width="3.6" fill="none" stroke-linecap="round"/>`;
  case'closed':return`<path d="M${cx-8} ${cy} Q${cx} ${cy+7} ${cx+8} ${cy}" stroke="${DARK}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
  case'wide':return`<ellipse cx="${cx}" cy="${cy}" rx="9.5" ry="11.5" fill="#fff" stroke="#00000022"/><circle cx="${cx}" cy="${cy}" r="3.4" fill="${DARK}"/>`;
  case'sparkle':return`<ellipse cx="${cx}" cy="${cy}" rx="8.5" ry="10" fill="#fff" stroke="#00000022"/><circle cx="${cx}" cy="${cy+1}" r="6" fill="${DARK}"/><circle cx="${cx-2}" cy="${cy-2}" r="2.2" fill="#fff"/><circle cx="${cx+2.5}" cy="${cy+3}" r="1.1" fill="#fff"/>`;
  case'side':return`<ellipse cx="${cx}" cy="${cy}" rx="8" ry="9" fill="#fff" stroke="#00000022"/><circle cx="${cx+4.5}" cy="${cy+1}" r="4.4" fill="${DARK}"/><circle cx="${cx+3}" cy="${cy-1}" r="1.4" fill="#fff"/>`;
  case'sad':return`<ellipse cx="${cx}" cy="${cy}" rx="8" ry="9" fill="#fff" stroke="#00000022"/><circle cx="${cx}" cy="${cy+3.5}" r="4.6" fill="${DARK}"/><circle cx="${cx-1.5}" cy="${cy+1.5}" r="1.5" fill="#fff"/>`;
  case'half':return`<ellipse cx="${cx}" cy="${cy}" rx="8" ry="9" fill="#fff" stroke="#00000022"/><circle cx="${cx}" cy="${cy+2}" r="4.4" fill="${DARK}"/><path d="M${cx-9.5} ${cy+1} A9.5 10 0 0 1 ${cx+9.5} ${cy+1}Z" fill="${skin}"/><path d="M${cx-9} ${cy+1} H${cx+9}" stroke="${DARK}" stroke-width="2.4" stroke-linecap="round"/>`;
  case'squint':return`<path d="M${cx-dir*8} ${cy-6} L${cx+dir*6} ${cy} L${cx-dir*8} ${cy+6}" stroke="${DARK}" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  default:return`<ellipse cx="${cx}" cy="${cy}" rx="8" ry="9" fill="#fff" stroke="#00000022"/><circle cx="${cx+dir*.5}" cy="${cy+1}" r="4.6" fill="${DARK}"/><circle cx="${cx-1.6}" cy="${cy-1.6}" r="1.6" fill="#fff"/>`}}
const BROWS={flat:['M70 78 Q80 74 90 78','M110 78 Q120 74 130 78'],up:['M70 74 Q80 66 90 73','M110 73 Q120 66 130 74'],high:['M70 70 Q80 61 90 68','M110 68 Q120 61 130 70'],sad:['M69 80 L91 72','M109 72 L131 80'],angry:['M69 72 L91 80','M109 80 L131 72'],worried:['M69 78 Q80 73 91 69','M109 69 Q120 73 131 78'],soft:['M70 80 Q80 76 90 80','M110 80 Q120 76 130 80'],droop:['M69 80 Q80 76 91 77','M109 77 Q120 76 131 80']};
function mouthSVG(k){const M='#7a1f2b',T='#ff7a8a';
 switch(k){
  case'bigSmile':return`<path d="M84 111 Q100 140 116 111 Q100 117 84 111Z" fill="${M}"/><path d="M86 112 Q100 119 114 112 L113 115.500 Q100 121 87 115.500Z" fill="#fff"/><path d="M92 124 Q100 131 108 124 Q100 120 92 124Z" fill="${T}"/>`;
  case'frown':return`<path d="M89 127 Q100 114 111 127" stroke="${DARK}" stroke-width="3.6" fill="none" stroke-linecap="round"/>`;
  case'o':return`<ellipse cx="100" cy="122" rx="6" ry="8" fill="${M}"/>`;
  case'wavy':return`<path d="M86 121 Q92.500 114 99 121 T112 121" stroke="${DARK}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
  case'flat':return`<path d="M90 120 L110 120" stroke="${DARK}" stroke-width="3.6" stroke-linecap="round"/>`;
  case'yawn':return`<ellipse cx="100" cy="124" rx="9" ry="12" fill="${M}"/><ellipse cx="100" cy="131" rx="5.500" ry="4" fill="${T}"/>`;
  case'teeth':return`<rect x="87" y="114" width="26" height="12" rx="4" fill="#fff" stroke="${M}" stroke-width="2.4"/><path d="M93 114v12M100 114v12M107 114v12M87 120h26" stroke="${M}" stroke-width="1.5"/>`;
  case'tongue':return`<path d="M90 118 L110 118" stroke="${DARK}" stroke-width="3.4" stroke-linecap="round"/><path d="M94 118 Q100 136 106 118Z" fill="${T}" stroke="#c0394d" stroke-width="1.5"/>`;
  case'pant':return`<path d="M87 113 Q100 140 113 113Z" fill="${M}"/><path d="M93 120 Q100 138 107 120Z" fill="${T}"/>`;
  default:return`<path d="M90 116 Q100 125 110 116" stroke="${DARK}" stroke-width="3.6" fill="none" stroke-linecap="round"/>`}}
function hairBack(st,gid){const f=`fill="url(#${gid})"`;
 switch(st){
  case'ponytail':return`<path d="M136 60 C178 50 190 114 162 158 C160 124 152 100 138 84Z" ${f}/><ellipse cx="140" cy="68" rx="7" ry="10" fill="#ff6b9a"/>`;
  case'pigtails':return`<path d="M60 76 C28 80 22 132 40 158 C50 134 56 112 66 98Z" ${f}/><path d="M140 76 C172 80 178 132 160 158 C150 134 144 112 134 98Z" ${f}/><circle cx="60" cy="80" r="7" fill="#ff6b9a"/><circle cx="140" cy="80" r="7" fill="#ff6b9a"/>`;
  case'long':return`<path d="M48 80 C38 30 162 30 152 80 C164 130 160 178 146 198 L54 198 C40 178 36 130 48 80Z" ${f}/>`;
  case'bun':return`<circle cx="100" cy="32" r="22" ${f}/><path d="M84 46 Q100 54 116 46" stroke="#ff6b9a" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  default:return''}}
function hairFront(st,gid){const f=`fill="url(#${gid})"`,girl=`<path d="M52 94 C47 44 80 33 100 33 C122 33 155 44 148 94 C142 74 128 62 112 58 C104 66 90 72 76 74 C66 78 58 84 52 94Z" ${f}/>`;
 switch(st){
  case'short':return`<path d="M53 90 C50 50 76 36 100 36 C126 36 150 50 147 90 C142 70 126 60 100 60 C76 60 58 70 53 90Z" ${f}/>`;
  case'spiky':return`<path d="M53 88 L54 54 L68 62 L74 34 L88 54 L100 28 L112 54 L126 34 L132 62 L146 54 L147 88 C140 68 124 60 100 60 C76 60 60 68 53 88Z" ${f}/>`;
  case'curly':return[[60,70,16],[76,52,18],[100,44,19],[124,52,18],[140,70,16],[52,92,12],[148,92,12]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" ${f}/>`).join('')+`<path d="M54 90 C54 62 146 62 146 90 C138 72 62 72 54 90Z" ${f}/>`;
  case'side':return`<path d="M52 92 C46 46 92 32 120 38 C144 44 152 66 148 92 C142 66 120 56 94 64 C72 70 58 80 52 92Z" ${f}/>`;
  default:return girl}}
/* st: student; o:{exp,pose,acc:{umbrella,coat,scarf,wind},uid} -> <g> in local coords (feet y~300) */
function avatarG(st,o){o=o||{};const id=U(),acc=o.acc||{},exp=EXP[o.exp]||EXP.neutral,skin=st.skin,hair=st.hair,type=st.type;
 const shirt=acc.coat?shade(st.shirt,-18):st.shirt,pose=POSES[o.pose]?o.pose:'idle';
 const sh=(c)=>shade(c,-34),skD=shade(skin,-26);
 let arms=Object.assign({},POSES.idle,POSES[pose]);if(acc.umbrella)arms=Object.assign({},arms,{R:POSES.umbrella.R});
 const arm=pts=>{const p=pts.map(q=>q.join(',')).join(' '),h=pts[2];return`<polyline points="${p}" fill="none" stroke="${sh(shirt)}" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" transform="translate(2 3)"/><polyline points="${p}" fill="none" stroke="url(#${id}s)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${h[0]}" cy="${h[1]}" r="11.500" fill="url(#${id}k)"/>`};
 const wind=acc.wind?'rotate(-5 100 60) skewX(-3)':'';
 const tilt=exp.tilt||0;
 const eyes=eyeSVG(80,94,exp.eye,-1,skin)+eyeSVG(120,94,exp.eye,1,skin);
 const br=BROWS[exp.brow];

 if(c==='unsure'){p.unsure=t;render();return}
 p.write='';p.hist.push({f:'p',t});complete(p,t);p.phase='wait';say(p,p.fin,()=>{p.phase='end';p.done=true})}
function approve(mode){const p=P(),t=p.unsure;if(!t)return;p.hist.push({f:'p',t});p.write='';p.unsure=null;p.note=mode==='teacher'?'Message approved by the teacher.':'Message sent (not checked by the game).';complete(p,t);p.phase='wait';say(p,p.fin,()=>{p.phase='end';p.done=true})}
function rewrite(){const p=P();p.unsure=null;p.write=$('#wr')?$('#wr').value:'';render()}
function finish(){const p=P();p.done=true;if(G.cur<G.players.length-1){G.cur++;G.screen='turn';render()}else{G.screen='report';render()}}
function startTurn(){G.screen='chat';const p=P();render();if(!p.hist.length)startStory(p)}
/* ===== render ===== */
const BANK=[['Questions',["What's the matter?","What's wrong?","How are you feeling?","Have you got a headache?","Have you got a temperature?"]],['Advice',["You should get some rest.","You should drink some water.","You should tell your parents.","You should see a doctor.","You shouldn't play sports if you feel very ill."]],['Kind words',["Oh no!","I'm sorry to hear that.","That sounds bad.","I hope you feel better soon!","Let me know how you feel later."]]];
function render(){const app=$('#app');
 app.innerHTML=({setup:setupHTML,turn:turnHTML,chat:chatHTML,report:reportHTML})[G.screen]();
 if(G.screen==='chat'){const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}
 $('#modal').innerHTML=G.review!=null?reviewHTML():'';G.players.forEach(q=>q.hist.forEach(m=>{delete m.fresh}))}
function setupHTML(){return`<div class="wrap narrow"><div class="hero"><div class="logo">${headSVG(PRESETS[0],'tired',70)}${headSVG(PRESETS[1],'nervous',70)}</div><h1>HEY, ARE YOU OK?</h1><p class="tag">Help your friend when they feel ill. Ask. Advise. Care.</p></div>
 <div class="card"><h2>Who is playing?</h2><div class="cnt" role="group" aria-label="Number of players">${[1,2,3,4].map(n=>`<button class="cntb ${G.n===n?'on':''}" data-a="n" data-v="${n}"><b>${n}</b><span>${n===1?'player':'players'}</span></button>`).join('')}</div>
 <div class="plist">${Array.from({length:G.n},(_,i)=>`<div class="pl"><div class="pl-h">${headSVG(PRESETS[G.av[i]],'happy',54)}<input class="inp" data-in="name" data-i="${i}" value="${esc(G.names[i])}" placeholder="Name (player ${i+1})" maxlength="18" aria-label="Name of player ${i+1}"></div>
  <div class="avs" role="group" aria-label="Choose an avatar for player ${i+1}">${PRESETS.map((a,k)=>`<button class="avb ${G.av[i]===k?'on':''}" data-a="av" data-i="${i}" data-v="${k}" aria-label="Avatar ${k+1}">${headSVG(a,'happy',38)}</button>`).join('')}</div></div>`).join('')}</div>
 <div class="acts"><button class="btn pri big" data-a="start">Start Game →</button></div></div></div>`}
function turnHTML(){const p=P(),n=G.players.length;return`<div class="wrap narrow"><div class="card center"><div class="steps">${G.players.map((q,i)=>`<span class="stp ${i<G.cur?'dn':i===G.cur?'on':''}">${headSVG(PRESETS[G.av[i]],'happy',34)}<b>${esc(q.name)}</b>${i<G.cur?'<i>✓</i>':''}</span>`).join('')}</div>
 <div class="big-av">${headSVG(PRESETS[G.av[G.cur]],'happy',110)}</div><h2>${G.cur===0?'First player':'Next player'}: ${esc(p.name)}</h2><p class="sub">A message is coming from your friend <b>${esc(p.sc.name)}</b>. Pass the keyboard to <b>${esc(p.name)}</b>.</p>
 <div class="acts" style="justify-content:center"><button class="btn pri big" data-a="turn">I'm ready →</button></div></div></div>`}
function bubble(m,p){const me=m.f==='p';return`<div class="msg ${me?'me':'fr'} ${m.bad?'bad':''} ${m.fresh?'fresh':''}">${me?'':`<div class="mh">${headSVG(p.look,'happy',34)}</div>`}<div class="bub">${esc(m.t)}</div>${me?`<div class="mh">${headSVG(PRESETS[G.av[G.players.indexOf(p)]],'happy',34)}</div>`:''}</div>`}
function chatHTML(p){p=P();const k=p.stage,r=stRec(p),ph=p.phase;
 const dots=`<div class="stages" aria-label="Stage ${k} of 4">${STAGES.map((s,i)=>`<div class="sg ${p.st[i].done?'dn':i+1===k?'on':''}"><b>${p.st[i].done?'✓':i+1}</b><span>${s}</span></div>`).join('')}</div>`;
 const status=p.typing?`${esc(p.sc.name)} is typing…`:ph==='end'?`${esc(p.sc.name)} feels supported`:'';
 let act='';
 if(ph==='choose'){act=`<div class="opts">${p.opts.map((o,i)=>`<button class="opt ${o.used?'used':''}" data-a="pick" data-i="${i}" ${o.used||p.busy?'disabled':''}>${esc(o.t)}</button>`).join('')}</div>`;
  if(k===4)act+=`<div class="write"><label for="wr">Or write your own message:</label><div class="wrow"><input id="wr" class="inp" maxlength="120" value="${esc(p.write)}" placeholder="e.g. I hope you feel better soon!" autocomplete="off"><button class="btn pri" data-a="send">Send</button></div></div>`;
  if(p.unsure)act+=`<div class="unsure"><b>I'm not sure about this message:</b> “${esc(p.unsure)}”<br>Is it a kind message for your friend?<div class="acts"><button class="btn sm pri" data-a="appr" data-v="teacher">Teacher approves</button><button class="btn sm" data-a="appr" data-v="student">Continue anyway</button><button class="btn sm" data-a="rewrite">Write again</button></div></div>`}
 if(ph==='fail')act=`<div class="hintb">💡 ${esc(p.hintText)}</div><div class="acts"><button class="btn pri" data-a="again">Try Again</button></div>`;
 if(ph==='ok')act=`<div class="good">${k===1?'Good question!':k===2?'Good question! You asked about the symptoms.':'That sounds helpful.'}</div><div class="acts"><button class="btn pri big" data-a="next">Next →</button></div>`;
 if(ph==='end')act=`<div class="good">Your friend feels supported! Story complete ✓</div>${p.note?`<p class="sub">${esc(p.note)}</p>`:''}<div class="acts"><button class="btn pri big" data-a="finish">${G.cur<G.players.length-1?'Next player →':'See results →'}</button></div>`;
 if(p.helpText&&ph==='choose')act=`<div class="hintb">💡 ${esc(p.helpText)}</div>`+act;
 return`<div class="wrap"><header class="bar"><div class="who">${headSVG(PRESETS[G.av[G.cur]],'happy',38)}<div><b>${esc(p.name)}</b><span>${G.players.length>1?`Player ${G.cur+1} of ${G.players.length}`:'Your story'}</span></div></div>${dots}<div class="tools"><button class="btn sm" data-a="help" ${ph==='choose'||ph==='fail'?'':'disabled'}>? HELP</button><button class="btn sm" data-a="bank">Language bank</button><button class="btn sm" data-a="home" title="Back to start">⌂</button></div></header>
 ${G.bank?`<div class="bank card">${BANK.map(([h,l])=>`<div><h4>${h}</h4>${l.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`).join('')}</div>`:''}
 <div class="grid"><aside class="friend card"><div class="fav ${p.exp}">${avatarSVG(looks(p.look),{exp:MOOD[p.exp]||'tired',pose:ph==='end'?'wave':(p.exp==='relieved'||p.exp==='happy')?'idle':p.sc.pose},200)}</div><h3>${esc(p.sc.name)}</h3><p class="status">${status||'&nbsp;'}</p></aside>
 <section class="chat card"><div class="msgs" id="msgs" aria-live="polite">${p.hist.map(m=>bubble(m,p)).join('')}${p.typing?`<div class="msg fr"><div class="mh">${headSVG(p.look,'happy',34)}</div><div class="typing"><i></i><i></i><i></i></div></div>`:''}</div><div class="act">${act}</div></section></div></div>`}
const worst=(a,b)=>{const o=['independent','hint','attempts'];return o[Math.max(o.indexOf(a),o.indexOf(b))]};
function reportHTML(){const ps=G.players;const label={independent:'on my own',hint:'with a hint',attempts:'after more tries'};
 const row=(ok,text,how)=>`<div class="rk ${ok?'ok':''}"><b>${ok?'✓':'○'}</b><span>${text}${how?` <em>${label[how]}</em>`:''}</span></div>`;
 return`<div class="wrap"><div class="hero small"><h1>Great work!</h1><p class="tag">Here is what we practised today.</p></div><div class="rep">${ps.map((p,i)=>{const a=p.st.map(x=>x.done?1:0).reduce((x,y)=>x+y,0),hints=p.st.reduce((x,y)=>x+y.help+y.hints,0),att=p.st.reduce((x,y)=>x+y.att,0),pts=p.st.reduce((x,y)=>x+y.pts,0),allInd=p.st.every(x=>x.how==='independent');
  const msg=a<4?'You are still working on your story — keep going!':allInd?`${esc(p.name)}, you asked, helped and cared — excellent!`:`${esc(p.name)}, you kept trying and helped your friend. Well done!`;
  return`<div class="card pcard"><div class="ph">${headSVG(PRESETS[G.av[i]],'happy',56)}<div><h3>${esc(p.name)}</h3><span class="sub">Friend: ${esc(p.sc.name)} — ${esc(p.sc.prob)}</span></div></div>
  <div class="pbar">${p.st.map((x,j)=>`<i class="${x.done?'on':''}" title="${STAGES[j]}"></i>`).join('')}</div>
  ${row(p.st[0].done&&p.st[1].done,'Asked what is wrong and about the symptoms',p.st[0].done&&p.st[1].done?worst(p.st[0].how,p.st[1].how):null)}${row(p.st[2].done,'Gave suitable advice',p.st[2].how)}${row(p.st[3].done,'Finished with a kind message',p.st[3].how)}
  <div class="nums"><div><b>${hints}</b><span>hints used</span></div><div><b>${att}</b><span>attempts</span></div><div><b>${pts}</b><span>stars</span></div></div><p class="enc">${msg}</p><button class="btn sm" data-a="review" data-i="${i}">Review My Story</button></div>`}).join('')}</div>
 <div class="card sum"><h3>Today we practised how to:</h3><div class="chips"><span>Ask what's wrong</span><span>Talk about symptoms</span><span>Give simple advice</span><span>Support a friend</span></div></div>
 <div class="acts" style="justify-content:center"><button class="btn pri big" data-a="replay">Play Again with New Random Situations</button><button class="btn" data-a="restart">Restart Game</button><button class="btn" data-a="change">Change Players</button></div></div>`}
function reviewHTML(){const p=G.players[G.review];return`<div class="ovl" data-a="rclose"><div class="dlg" data-stop="1"><div class="ph">${headSVG(PRESETS[G.av[G.review]],'happy',48)}<div><h3>${esc(p.name)}'s story</h3><span class="sub">with ${esc(p.sc.name)} — ${esc(p.sc.prob)}</span></div></div><div class="msgs rv">${p.hist.map(m=>bubble(m,p)).join('')}</div><div class="acts" style="justify-content:flex-end"><button class="btn pri" data-a="rclose">Close</button></div></div></div>`}
/* ===== events ===== */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,d=t.dataset;
 if(a==='rclose'&&t.classList.contains('ovl')&&e.target!==t)return;
 switch(a){
 case'n':G.n=+d.v;render();break;
 case'av':G.av[+d.i]=+d.v;render();break;
 case'start':newGame();render();break;
 case'turn':startTurn();break;
 case'pick':choose(+d.i);break;
 case'help':help();break;
 case'bank':G.bank=!G.bank;render();break;
 case'home':G.screen='setup';render();break;
 case'again':tryAgain();break;
 case'next':nextStage();break;
 case'send':sendWrite();break;
 case'appr':approve(d.v);break;
 case'rewrite':rewrite();break;
 case'finish':finish();break;
 case'review':G.review=+d.i;render();break;
 case'rclose':G.review=null;render();break;
 case'restart':{const same=G.players.map(p=>p.sc);G.players=same.map((s,i)=>mkPlayer(i,s));G.cur=0;G.screen=G.n>1?'turn':'chat';render();if(G.screen==='chat')startStory(P());break}
 case'change':G.screen='setup';render();break;
 case'replay':G.players=assign(G.n).map((s,i)=>mkPlayer(i,s));G.cur=0;G.screen=G.n>1?'turn':'chat';render();if(G.screen==='chat')startStory(P());break;
 }});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.in==='name')G.names[+t.dataset.i]=t.value;if(t.id==='wr')P().write=t.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='wr'){e.preventDefault();sendWrite()}if(e.key==='Escape'&&G.review!=null){G.review=null;render()}});
render();

</script>
</body>
</html>
