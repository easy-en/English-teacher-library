<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blend & Read Kitchen</title><style>
*{box-sizing:border-box}body{margin:0;background:#453021;font-family:Trebuchet MS,Arial,sans-serif;color:#493020}.stage{max-width:1600px;min-height:900px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 75% 10%,#fff3c6 0%,#f6bc73 55%,#9d613f 100%);display:grid;grid-template-columns:29% 71%;box-shadow:0 0 80px #23150d}.scene{position:relative;background:url('phonics-kitchen-assets/chef.png') center center/cover no-repeat;min-height:900px}.scene{cursor:pointer}.scene:focus-visible{outline:5px solid #4bcdff;outline-offset:-5px}.scene canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.scene:after{content:'';position:absolute;inset:0 0 0 auto;width:8px;background:linear-gradient(90deg,transparent,#b16b39)}.workspace{padding:18px 24px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}.panel{background:linear-gradient(#fff7e6,#ffe2b5);border:5px solid #b97b42;border-radius:28px;box-shadow:0 8px 0 #7f482a,0 12px 22px #653b2a55;padding:15px 19px}.heading{font-size:clamp(19px,2.1vw,31px);font-weight:1000;text-shadow:1px 2px #fff}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.controls{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #2364bd;outline-offset:2px}.pill{border:3px solid #a66a38;border-radius:19px;background:linear-gradient(#ffe3b2,#f3b66e);padding:10px 14px;font-weight:900;color:#4b2d19;box-shadow:0 4px 0 #996034}.pill.active{background:linear-gradient(#b3ff84,#5bd63c);border-color:#299b27}.alphabet{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:7px;margin-top:15px}.letter{position:relative;min-height:56px;border:3px solid white;border-radius:12px;background:var(--tile);box-shadow:0 5px 0 #b18462;font-weight:1000;font-size:clamp(19px,2vw,30px);color:#403020}.letter.chosen{outline:4px solid #33bb32}.letter small{position:absolute;right:-3px;bottom:-5px;background:#b49172;color:white;border-radius:50%;font-size:12px;width:21px;height:21px;display:grid;place-items:center;border:2px solid white}.letter.chosen small{background:#36b832}.recipe{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;min-height:49px}.chip{background:#a7f49b;border:3px solid #35a637;border-radius:12px;padding:8px 12px;font-size:21px;font-weight:900}.modes{display:flex;gap:6px;flex-wrap:wrap}.blendpanel{flex:1;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:13px}.blendrow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.tile{width:clamp(70px,8vw,120px);height:clamp(78px,9vw,132px);display:grid;place-items:center;border-radius:21px;border:6px solid white;box-shadow:0 8px 12px #87532a55;font-size:clamp(48px,6vw,85px);font-weight:1000;transition:transform .35s}.tile:nth-of-type(1){background:linear-gradient(#e3f7ff,#89d0f7);color:#1d507a}.tile:nth-of-type(2){background:linear-gradient(#ffe9f4,#ff9ac9);color:#7b204c}.tile:nth-of-type(3){background:linear-gradient(#fff5c2,#ffd75d);color:#825012}.arrow{font-size:34px;color:#8b49b2;font-weight:900}.result{font-size:clamp(43px,5vw,75px);font-weight:1000;background:linear-gradient(#d0ffa5,#79ee72);border:6px solid white;box-shadow:0 5px 0 #4ba832;border-radius:20px;padding:8px 25px;min-width:150px;text-align:center}.speaker{border:0;background:transparent;font-size:25px}.sounds{display:flex;justify-content:center;gap:70px}.footer{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.big{border:4px solid white;border-radius:23px;box-shadow:0 5px 0 #995e37;padding:15px 21px;font-size:21px;font-weight:1000;color:white;text-shadow:0 2px #555;min-width:145px}.blue{background:linear-gradient(#6bd4ff,#1688e2)}.green{background:linear-gradient(#b1ff5d,#27bb14)}.purple{background:linear-gradient(#dfa4ff,#9340d4)}.gold{background:linear-gradient(#ffe29b,#e9a13e);color:#5c391c;text-shadow:none}.notice{text-align:center;font-weight:800;min-height:24px}.mixing .tile{animation:mix .65s ease-in-out 3}.mixing .result{animation:glow .7s ease-in-out 3}@keyframes mix{25%{transform:translateY(-26px) rotate(-13deg)}75%{transform:translateY(14px) rotate(13deg)}}@keyframes glow{50%{filter:brightness(1.3);transform:scale(1.07)}}.hint{font-size:13px;color:#795a3c}.soundStatus{font-size:13px;font-weight:bold;color:#82502a}@media(max-width:950px){.stage{display:block}.scene{height:280px;min-height:280px;background-size:cover;background-position:center 36%}.workspace{padding:12px}.alphabet{grid-template-columns:repeat(9,minmax(0,1fr))}.letter{min-height:50px}.blendpanel{min-height:260px}.panel{padding:12px}}@media(max-width:550px){.alphabet{grid-template-columns:repeat(7,minmax(0,1fr))}.letter{font-size:20px;min-height:43px}.pill{padding:7px 9px;font-size:12px}.tile{width:65px;height:75px;font-size:46px}.arrow{font-size:22px}.result{font-size:40px}.big{min-width:0;font-size:15px;padding:12px}}
</style></head><body><main class="stage"><aside class="scene" id="blenderScene" role="button" tabindex="0" aria-label="Click the red blender to mix the letters"><canvas id="blenderFx" aria-hidden="true"></canvas></aside><div class="workspace"><section class="panel"><div class="bar"><div class="heading">🔤 Alphabet Station</div><div class="controls"><button class="pill" id="mute">🔊 Sound ON</button><button class="pill" id="names">Letter Name</button><button class="pill active" id="phonics">Letter Sound</button></div></div><div class="alphabet" id="alphabet"></div><p class="hint">Tap a letter to hear it. Tap the small + / ✓ to choose ingredients.</p></section><section class="panel recipe"><div><div class="heading">🥕 Choose Letters for Your Recipe</div><div class="chips" id="chosen"></div></div><div><b>Word Mode</b><div class="modes"><button class="pill" data-mode="real">Real Words</button><button class="pill" data-mode="silly">Silly Words</button><button class="pill active" data-mode="mix">Mix</button></div></div></section><section class="panel blendpanel" id="blendpanel"><div class="heading">🥤 Let's Blend!</div><div class="blendrow"><div class="tile" id="t0">c</div><span class="arrow">➜</span><div class="tile" id="t1">a</div><span class="arrow">➜</span><div class="tile" id="t2">b</div><span class="arrow">=</span><div class="result" id="result">cab</div></div><div class="sounds"><button class="speaker" data-sound="0" aria-label="First sound">🔊</button><button class="speaker" data-sound="1" aria-label="Second sound">🔊</button><button class="speaker" data-sound="2" aria-label="Third sound">🔊</button></div><div class="notice" id="notice">Choose letters and press New Word!</div></section><div class="footer"><button class="big blue" id="listen">🔊 Listen</button><button class="big green" id="blend">▶ Blend</button><button class="big purple" id="next">⟳ New Word</button><button class="big gold" id="speed">🐢 Slow</button></div><div class="bar"><span class="soundStatus" id="status">Speech uses your browser's English voice; isolated phonemes are approximate.</span><button class="pill" id="reset">Reset letters</button></div></div></main><script>
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),vowels='AEIOU',real=new Set('bad bag ban bat bed beg bet bib bid big bin bit bob bog bop box bud bug bun bus but cab cad can cap cat cob cod cog con cop cot cub cud cup cut dab dad dam den did dig dim dip dog dot dub dud dug dun fad fan fat fed fen fib fig fin fit fog fox fun gab gag gap gas get gig gin god got gum gun gut had ham has hat hem hen hid him hip hit hog hop hot hub hug hut jab jam jar jet jig job jog jot jug jut lab lad lag lap led leg let lid lip lit lob log lot lug mad man map mat men met mid mix mob mop mud mug mug nab nag nap net nib nod not nub nut pad pal pan pat peg pen pet pig pin pit pod pop pot pub pug pun pup rag ram ran rap rat red rib rid rig rim rip rob rod rot rub rug run sad sag sap sat saw set sip sir sit sob sod son sop sub sum sun tab tad tag tan tap tar ten the tic tin tip toe top tot tub tug van vat vet via vim wag wan war was wax web wed wet wig win wit won yak yam yap yes yet zip zit'.split(' '));
const alphabet=document.querySelector('#alphabet'),chosen=document.querySelector('#chosen');let selected=new Set('ABCDEF'),mode='mix',soundMode='phonics',muted=false,slow=true,current='cab',history=new Set(),busy=false;const palettes=['#ffb5b5','#ffe395','#b5f0b0','#b6dfff','#e0c2ff'];
function render(){alphabet.innerHTML='';letters.forEach((l,i)=>{const b=document.createElement('button');b.className='letter'+(selected.has(l)?' chosen':'');b.style.setProperty('--tile',palettes[i%5]);b.innerHTML=l+'<small>'+(selected.has(l)?'✓':'+')+'</small>';b.setAttribute('aria-label',l+' listen; small icon select');b.addEventListener('click',e=>{if(e.target.tagName==='SMALL'){if(selected.has(l))selected.delete(l);else selected.add(l);history.clear();render();}else sayLetter(l)});alphabet.append(b)});chosen.innerHTML='';[...selected].forEach(l=>{const b=document.createElement('button');b.className='chip';b.textContent=l+' ×';b.onclick=()=>{selected.delete(l);history.clear();render()};chosen.append(b)});if(!selected.size)chosen.textContent='Choose your first letters above';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelector('#names').classList.toggle('active',soundMode==='names');document.querySelector('#phonics').classList.toggle('active',soundMode==='phonics');document.querySelector('#mute').textContent=muted?'🔇 Sound OFF':'🔊 Sound ON';}
function speech(t,rate=.82){if(muted||!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=rate;u.pitch=1;const voices=speechSynthesis.getVoices(),en=voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'));if(en)u.voice=en;speechSynthesis.speak(u)}
const phonemeHints={A:'a',B:'b',C:'k',D:'d',E:'e',F:'f',G:'g',H:'h',I:'i',J:'j',K:'k',L:'l',M:'m',N:'n',O:'o',P:'p',Q:'kw',R:'r',S:'s',T:'t',U:'u',V:'v',W:'w',X:'ks',Y:'y',Z:'z'};
function sayLetter(l){if(soundMode==='names')speech(l,0.7);else{let examples={A:'a',B:'b',C:'k',D:'d',E:'eh',F:'fff',G:'g',H:'hhh',I:'ih',J:'j',K:'k',L:'lll',M:'mmm',N:'nnn',O:'o',P:'p',Q:'kw',R:'rrr',S:'sss',T:'t',U:'uh',V:'vvv',W:'w',X:'ks',Y:'y',Z:'zzz'};speech(examples[l],.68)}}
function candidates(){const c=[...selected].filter(x=>!vowels.includes(x)),v=[...selected].filter(x=>vowels.includes(x)),out=[];for(const a of c)for(const b of v)for(const d of c){const w=(a+b+d).toLowerCase(),isReal=real.has(w);if((mode==='mix'||(mode==='real'&&isReal)||(mode==='silly'&&!isReal)))out.push(w)}return out}
function show(w){current=w;[...w].forEach((c,i)=>document.querySelector('#t'+i).textContent=c);document.querySelector('#result').textContent=w;document.querySelector('#notice').textContent=(real.has(w)?'Real word':'Silly word')+' — blend the sounds!'}
function next(){if(busy)return;const all=candidates();if(!all.length){document.querySelector('#notice').textContent='Choose at least one vowel (A E I O U) and one consonant, or change Word Mode.';return}let available=all.filter(x=>!history.has(x));if(!available.length){history.clear();available=all}let w=available[Math.floor(Math.random()*available.length)];history.add(w);show(w)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));async function blend(){if(busy)return;busy=true;animateBlender();const p=document.querySelector('#blendpanel');p.classList.add('mixing');document.querySelector('#notice').textContent='Mixing sounds...';if(!muted){for(const l of current){sayLetter(l.toUpperCase());await wait(slow?750:430)}await wait(180);speech(current,slow?.65:.9)}await wait(650);p.classList.remove('mixing');document.querySelector('#notice').textContent='✨ '+current+' — Your word is ready!';busy=false}

// Interactive blender animation. The original chef illustration is unchanged.
const blenderScene=document.getElementById('blenderScene'),fx=document.getElementById('blenderFx');
let fxFrame=0;
function animateBlender(){
 cancelAnimationFrame(fxFrame);
 const ctx=fx.getContext('2d');const ratio=devicePixelRatio||1;
 const bounds=blenderScene.getBoundingClientRect();
 fx.width=Math.round(bounds.width*ratio);fx.height=Math.round(bounds.height*ratio);
 ctx.setTransform(ratio,0,0,ratio,0,0);
 const w=bounds.width,h=bounds.height;
 // Background uses CSS cover, so reproduce the image's exact geometry.
 const scale=Math.max(w/476,h/941),dx=(w-476*scale)/2,dy=(h-941*scale)/2;
 const X=n=>dx+n*scale,Y=n=>dy+n*scale;
 const start=performance.now(),duration=2200;
 const chars=(current||'cat').slice(0,3).split('');
 const colors=['#79c8ff','#ff9bd0','#ffdb5b'];
 function frame(now){
  const elapsed=now-start,t=Math.min(1,elapsed/duration);
  ctx.clearRect(0,0,w,h);
  if(t>=1){return}
  // A translucent glass-like overlay makes moving letters clear without changing the artwork.
  ctx.save();ctx.beginPath();ctx.moveTo(X(91),Y(503));ctx.lineTo(X(348),Y(503));ctx.lineTo(X(332),Y(731));ctx.lineTo(X(112),Y(731));ctx.closePath();ctx.clip();
  ctx.fillStyle='rgba(116,210,249,0.18)';ctx.fillRect(X(86),Y(500),X(350)-X(86),Y(737)-Y(500));
  for(let i=0;i<3;i++){
   const phase=elapsed/245+i*2.094;
   const radius=(t>.75? (1-t)*180:70)*scale;
   const px=X(220)+Math.cos(phase)*radius;
   const py=Y(619)+Math.sin(phase)*radius*.65;
   const side=62*scale;
   ctx.save();ctx.translate(px,py);ctx.rotate(phase*.32);ctx.shadowColor='#fff6a8';ctx.shadowBlur=14*scale;
   ctx.fillStyle=colors[i];ctx.strokeStyle='white';ctx.lineWidth=4*scale;
   ctx.beginPath();ctx.roundRect(-side/2,-side/2,side,side,11*scale);ctx.fill();ctx.stroke();
   ctx.shadowBlur=0;ctx.fillStyle='#40304b';ctx.font=`bold ${45*scale}px Trebuchet MS, Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(chars[i]||'',0,2*scale);ctx.restore();
  }
  for(let i=0;i<14;i++){
   const angle=i*2.399+elapsed/440,rad=(25+(i*17)%100)*scale;
   ctx.fillStyle=i%2?'#fff5a2':'#ffffff';ctx.globalAlpha=.35+.5*Math.abs(Math.sin(elapsed/350+i));
   ctx.beginPath();ctx.arc(X(220)+Math.cos(angle)*rad,Y(619)+Math.sin(angle)*rad*.8,2.7*scale,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();ctx.globalAlpha=1;
  fxFrame=requestAnimationFrame(frame);
 }
 fxFrame=requestAnimationFrame(frame);
}
function blenderHit(event){
 const r=blenderScene.getBoundingClientRect();const scale=Math.max(r.width/476,r.height/941);
 const dx=(r.width-476*scale)/2,dy=(r.height-941*scale)/2;
 const x=(event.clientX-r.left-dx)/scale,y=(event.clientY-r.top-dy)/scale;
 if(x>=75&&x<=365&&y>=410&&y<=920)blend();
}
blenderScene.addEventListener('click',blenderHit);
blenderScene.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();blend()}});

document.querySelector('#names').onclick=()=>{soundMode='names';render()};document.querySelector('#phonics').onclick=()=>{soundMode='phonics';render()};document.querySelector('#mute').onclick=()=>{muted=!muted;if(muted&&'speechSynthesis'in window)speechSynthesis.cancel();render()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;history.clear();render();next()});document.querySelector('#next').onclick=next;document.querySelector('#blend').onclick=blend;document.querySelector('#listen').onclick=()=>speech(current,slow?.65:.9);document.querySelectorAll('[data-sound]').forEach(b=>b.onclick=()=>sayLetter(current[Number(b.dataset.sound)].toUpperCase()));document.querySelector('#speed').onclick=()=>{slow=!slow;document.querySelector('#speed').textContent=slow?'🐢 Slow':'🐇 Normal'};document.querySelector('#reset').onclick=()=>{selected.clear();history.clear();render()};render();show('cab');
</script></body></html>
