<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magic Bedroom</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1fb;--panel:#fff;--panel2:#f1eefb;--ink:#26304a;--muted:#66728c;--line:#e1dcf2;--acc:#7048e8;--acc2:#ffd43b;--ok:#2b8a3e;--bad:#c92a2a;--shadow:0 10px 28px rgba(60,40,120,.13);--r:22px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171527;--panel:#221f3a;--panel2:#2b2749;--ink:#eeebfa;--muted:#a9a4c9;--line:#38335c;--shadow:0 10px 28px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#171527;--panel:#221f3a;--panel2:#2b2749;--ink:#eeebfa;--muted:#a9a4c9;--line:#38335c;--shadow:0 10px 28px rgba(0,0,0,.4)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;font-family:Nunito,'Trebuchet MS','Segoe UI',Arial,sans-serif;font-size:19px;color:var(--ink);background:#f4f1fb;background:linear-gradient(180deg,#e7defc,var(--bg) 420px) fixed}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:'Baloo 2',Nunito,'Trebuchet MS',sans-serif;margin:0;line-height:1.1}h1{font-size:40px}h2{font-size:28px;margin-bottom:6px}h3{font-size:22px;margin-bottom:6px}
p{margin:6px 0}.sub{color:var(--muted);font-size:17px}
.top{display:flex;align-items:center;gap:12px;padding:12px 22px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:27px;white-space:nowrap}
.tabs{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.tab{border:0;background:var(--panel);border-radius:999px;padding:8px 16px 8px 8px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;color:var(--muted);box-shadow:0 2px 0 var(--line)}
.tab b{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--panel2);align-items:center;justify-content:center;font-size:14px}
.tab.on{background:var(--acc);color:#fff}.tab.on b{background:#ffffff40}
.tools{display:flex;gap:8px}
main{padding:6px 22px 30px;max-width:1560px;margin:0 auto}
.panel{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px}
.btn{border:0;border-radius:16px;padding:11px 22px;font-weight:800;font-size:18px;background:var(--panel);box-shadow:0 4px 0 var(--line);color:var(--ink)}
.btn:active{transform:translateY(2px)}.btn.pri{background:var(--acc);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.22)}.btn.big{font-size:21px;padding:13px 28px}.btn.sm{padding:7px 14px;font-size:15px;border-radius:12px}.btn:disabled{opacity:.5}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.lab{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 5px}
.melay{display:grid;grid-template-columns:1fr 380px;gap:26px}
@media (max-width:900px){.melay{grid-template-columns:1fr}}
.nm{font-size:24px;font-weight:800;border:3px solid var(--line);border-radius:14px;padding:8px 12px;width:100%;max-width:420px;background:var(--panel)}
.typ{display:flex;gap:10px}.typb{border:3px solid var(--line);background:var(--panel2);border-radius:18px;padding:4px 12px;display:flex;flex-direction:column;align-items:center;font-size:18px}.typb.on{border-color:var(--acc);background:#efe9ff}
.sw{display:flex;gap:8px;flex-wrap:wrap}.swb{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);padding:0}.swb.on{box-shadow:0 0 0 3px var(--acc)}
.hc{display:flex;gap:8px;flex-wrap:wrap}.hcb{border:3px solid var(--line);background:var(--panel2);border-radius:14px;padding:4px 14px 4px 6px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}.hcb.on{border-color:var(--acc);background:#efe9ff}.hcb .swb{width:24px;height:24px;box-shadow:0 0 0 1px var(--line)}
.stb{border:3px solid var(--line);background:var(--panel2);border-radius:14px;padding:0 3px;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700}.stb.on{border-color:var(--acc);background:#efe9ff}
.tog{border:3px solid var(--line);background:var(--panel2);border-radius:12px;padding:6px 14px;font-weight:800}.tog.on{border-color:var(--acc);background:#efe9ff}
.big-av{text-align:center}.big-av .spot{background:linear-gradient(#e7f2ff,#fff4d6);border-radius:24px;padding:10px}.say{font-weight:800;font-size:19px}
.taskc{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:12px}@media (max-width:900px){.taskc{grid-template-columns:1fr}}
.qbox{background:var(--panel2);border-radius:16px;padding:12px 18px;margin-top:14px}.qbox ul{margin:6px 0 0;padding-left:22px;line-height:1.5}
.pic{border:4px dashed var(--line);border-radius:20px;min-height:260px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:10px;text-align:center}
.pic img{max-width:100%;max-height:420px;border-radius:12px}.drop{display:flex;flex-direction:column;gap:8px;align-items:center;font-size:18px}.drop b{font-size:24px;font-family:'Baloo 2',sans-serif}
.ta{width:100%;border:3px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--panel);font-size:19px;resize:vertical}.ta.big{font-size:26px;font-weight:700;line-height:1.35;font-family:'Baloo 2',Nunito,sans-serif;min-height:230px}
.wlay{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(380px,1fr);gap:20px;align-items:start}@media (max-width:1000px){.wlay{grid-template-columns:1fr}}
.lcol{display:grid;gap:16px}.stick{position:sticky;top:10px}
.sceneb{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;line-height:0}.sceneb>svg{width:100%;height:auto;display:block}
.sceneb.mini{border-radius:14px;max-width:260px}
.it{transition:transform .6s cubic-bezier(.3,1.25,.5,1)}.it.drag{cursor:grab}
.in.pop{animation:pop .6s cubic-bezier(.3,1.5,.5,1)}.in.wig{animation:wig .5s}
@keyframes pop{0%{transform:translateY(-90px) scale(.2);opacity:0}55%{transform:translateY(10px) scale(1.12);opacity:1}100%{transform:none}}
@keyframes wig{0%,100%{transform:none}30%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}}
.cloud.pop{animation:pop .5s}
.fr{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.fr button{border:2px dashed var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:15px;font-weight:800;color:var(--muted)}.fr button:hover{border-color:var(--acc);color:var(--ink)}.fr.pre button{border-color:#c9bdf3;background:#f5f1ff;color:#5a3fc0}.fr button.q{background:#fff3bf;border-color:#f2d36b;color:#7a5b00}
.hintb{background:#fff3bf;color:#5b4700;border-radius:14px;padding:8px 14px;margin:8px 0;font-weight:700;font-size:17px}
.mwg{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.mw{position:relative;border:3px solid var(--line);background:var(--panel2);border-radius:14px;padding:4px 2px 4px;display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:800}
.mw span{line-height:1.1}.mw.used{border-color:var(--ok);background:#e3f7e8;color:#145a24}.mw.neg{border-color:var(--bad);background:#ffe9e9}.mw.neg span{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:3px}
.mw .x,.mc .x{display:none}
.mwc{display:flex;gap:6px;flex-wrap:wrap}.mc{border:3px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 12px 3px 4px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px}.mc .sw{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 2px #0002;display:inline-block}.mc.used{border-color:var(--ok);background:#e3f7e8;color:#145a24}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.pp{position:relative;border:3px solid var(--line);background:var(--panel2);border-radius:16px;padding:6px;text-align:center;font-size:15px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.pp svg{max-width:100%;height:auto}.pp.used{border-color:var(--ok);background:#e3f7e8;color:#145a24}.pp.neg{border-color:var(--bad);background:#ffe9e9}.pp.neg b{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:3px}.pp.hi{border-color:var(--acc);background:#efe9ff;box-shadow:0 0 0 3px #7048e855}.pp.done:after{content:'★';position:absolute;top:2px;right:6px;color:#f59f00;font-size:18px}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}.stab{border:0;background:var(--panel);border-radius:14px;padding:9px 18px;font-weight:800;font-size:18px;box-shadow:0 3px 0 var(--line)}.stab.on{background:var(--acc);color:#fff}.score{margin-left:auto;font-weight:800;color:var(--muted)}
.q{font-family:'Baloo 2',sans-serif;font-size:32px;font-weight:800;margin:4px 0}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.opt{border:4px solid var(--line);background:var(--panel);border-radius:18px;padding:12px 22px;font-size:25px;font-weight:800;box-shadow:0 4px 0 var(--line)}.opt.sm{font-size:19px;padding:8px 14px}.opt.ok{background:#e3f7e8;border-color:var(--ok)}.opt:disabled{cursor:default}
.inp{border:3px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px;font-size:20px;font-weight:700}
.fb{margin:10px 0;padding:10px 16px;border-radius:16px;font-weight:800;font-size:21px}.fb.ok{background:#e3f7e8;color:#145a24}.fb.no{background:#efe9ff;color:#46309c}
.demo{display:flex;gap:12px;align-items:center;margin:8px 0}.demo b{font-size:24px;font-family:'Baloo 2',sans-serif}
.postwrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start;max-width:1200px;margin:0 auto}@media (max-width:900px){.postwrap{grid-template-columns:1fr}}
.post{background:var(--panel);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
.phead{display:flex;align-items:center;gap:12px;padding:14px 18px}.phead b{font-size:22px;display:block}.phead span{color:var(--muted);font-size:15px}.phead u{text-decoration:none;color:var(--acc);font-weight:800}
.phead svg{border-radius:50%;background:#e7f2ff}
.pimgs{display:grid;gap:8px}.pimgs .sceneb{border-radius:0;box-shadow:none}.bookpic{width:100%;display:block}
.ptext{padding:16px 20px;font-size:23px;line-height:1.45;font-weight:600}.plk{display:flex;gap:10px;flex-wrap:wrap;padding:0 20px 10px}.plk span{background:var(--panel2);border-radius:999px;padding:2px 14px 2px 4px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px}
.pact{display:flex;gap:22px;padding:12px 20px;border-top:2px solid var(--line);color:var(--muted);font-weight:800}
.rv{display:grid;gap:8px;margin-top:10px}.rv button{text-align:left;border:0;background:var(--panel2);border-radius:14px;padding:10px 14px;font-weight:800;font-size:18px}
.ovl{position:fixed;inset:0;background:rgba(20,16,50,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--panel);border-radius:26px;box-shadow:var(--shadow);padding:24px 28px;max-width:640px;width:100%}.dlg.qd{max-width:1000px;text-align:center;padding:50px}.bigq{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(34px,6vw,70px);line-height:1.1;margin-bottom:20px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 20px;font-weight:800;z-index:80}
@media print{body{background:#fff!important}.top,.acts,.tools{display:none!important}.postwrap{grid-template-columns:1fr}.panel{display:none}.post{box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ====================== UTIL ====================== */
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>Array.from((r||document).querySelectorAll(s));

function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}

function sh(x,y,w,h,c,r,hv){const id=U();return`<defs>${LG(id,shade(c,hv==null?30:hv),shade(c,-22))}</defs>${rc(x,y,w,h,`url(#${id})`,r)}<rect x="${x+2}" y="${y+2}" width="${Math.max(0,w-4)}" height="${Math.min(6,h/4)}" rx="${(r||0)/2}" fill="#fff" opacity=".28"/>`}
function ball3(cx,cy,r,c){const id=U();return`<defs>${RG(id,shade(c,60),shade(c,-35))}</defs><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id})"/>`}
const ART={
bed:c=>`${shd(310)}${sh(-152,-142,18,142,WOOD,5)}${sh(134,-102,18,102,WOOD,5)}${sh(-134,-58,268,22,shade(WOOD,10),3)}${sh(-134,-96,268,40,'#f4f1ea',14,10)}${sh(-52,-106,186,56,c,12)}<path d="M-52 -78H134" stroke="${shade(c,-28)}" stroke-width="2.5" opacity=".5"/><path d="M-30 -104V-56M30 -104V-56M90 -104V-56" stroke="${shade(c,22)}" stroke-width="3" opacity=".35"/>${sh(-128,-122,72,34,'#ffffff',15,0)}`,

desk:c=>`${shd(240)}${sh(-115,-150,230,16,c,4,40)}${sh(-108,-134,12,134,shade(c,-8),2)}${sh(34,-134,76,134,shade(c,-4),4)}${[0,1,2].map(i=>`${rc(40,-128+i*42,64,38,shade(c,12),4,`stroke="${shade(c,-30)}" stroke-width="2"`)}<circle cx="72" cy="${-109+i*42}" r="4" fill="#f5d76e" stroke="#b8902c"/>`).join('')}`,

 return`${shd(180)}${sh(-85,-292,170,292,c,5)}${rc(-76,-282,152,274,shade(c,-48),3)}${[-228,-173,-118,-63].map(y=>sh(-78,y,156,7,shade(c,10),1)).join('')}<g transform="translate(0 0)">${b.replace(/y="(-?\d+)"/g,(m,y)=>`y="${+y-4}"`)}</g>${sh(-88,-300,176,12,shade(c,14),4)}`},

const PS={on:{s:['ball','cat','books','teddy','backpack','laptop'],a:['bed','desk','table','sofa','toybox']},under:{s:['ball','shoes','cat','backpack','teddy'],a:['bed','desk','table','chair']},over:{s:['picture','clock','poster','mirror'],a:['bed','sofa','desk','bookcase']},between:{s:['ball','cat','teddy','plant','lamp'],pairs:[['bed','wardrobe'],['table','chair'],['desk','bookcase'],['sofa','armchair']]},other:{s:['ball','cat','shoes','teddy','backpack','plant','lamp','books'],a:['bed','sofa','wardrobe','table','desk','bookcase','armchair']}};
const rp=a=>a[Math.floor(Math.random()*a.length)];
function mkScenario(prep){const g=PS[prep]||PS.other;const s=rp(g.s);let a,b=null;if(prep==='between'){[a,b]=rp(g.pairs)}else a=rp(g.a||PS.other.a);if(s===a)a='bed';return{prep,s,a,b}}
function modelFor(sc,withRel){const m=emptyModel();[sc.s,sc.a,sc.b].filter(Boolean).forEach(id=>{const it=ensure(m,id);it.present=true});if(withRel)m.rels.push({s:sc.s,prep:sc.prep,a:sc.a,b:sc.b,neg:false,count:1});return m}
function sentenceOf(sc,blank){const [n,pl]=LABEL[sc.s]||[sc.s,0],pp=blank?'___':PREP_LABEL[sc.prep];return`The ${n} ${pl?'are':'is'} ${pp} the ${lab(sc.a)}${sc.b?' and the '+lab(sc.b):''}.`}
let PR={};
function norm1(t){t=normText(t).replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();t=t.replace(/^(it is|the \w+ is)\s+/,'').replace(/^in front of$/,'infrontof').replace(/^next to$/,'nextto');const w=t.split(' ')[0];if(t==='infrontof'||t==='in front'||t==='in front of')return'infront';if(t==='next to'||t==='nextto')return'nextto';return PW[t]||PW[w]||null}
function tabWhere(){const modes=[['choose','Look and choose'],['complete','Complete the sentence'],['move','Move the object'],['write','Write and see']];
 $('#body').innerHTML=`<div class="subtabs">${modes.map(([k,l])=>`<button class="stab ${S.prac.mode===k?'on':''}" data-a="pmode" data-k="${k}">${l}</button>`).join('')}<span class="score">★ ${PREP_KEYS.filter(p=>(S.prac.preps[p]||0)>0).length}/8 prepositions practised</span></div><div class="wlay"><div class="lcol"><div class="sceneb" id="sc"></div></div><div class="rcol"><div class="panel stick" id="pact"></div></div></div><div class="panel" id="pbl" style="margin-top:18px">${magicHTML(false)}</div>${nextBtn('write','Next: My bedroom')}`;
 PR={};startExercise()}
function startExercise(){const mode=S.prac.mode;$$('.stab').forEach(b=>b.classList.toggle('on',b.dataset.k===mode));const sc=$('#sc');PR={mode,done:false};
 if(mode==='write'){PR.scene=new Scene(sc,{onNew:()=>sfx.pop()});$('#pact').innerHTML=`<h2>Write and see</h2><p class="sub">Write where things are. The objects will move!</p>${framesHTML().replace(FR1.map(f=>`<button data-a="fr" data-t="${esc(f)}">${esc(f)}</button>`).join(''),'')}<textarea id="ptext" class="ta big" rows="7" placeholder="The ball is under the bed. The cat is on the sofa." spellcheck="false">${esc(S.prac.text)}</textarea><div id="phints"></div><div class="exs sub">Try: The cat is on the bed. The shoes are under the table. The lamp is between the sofa and the desk.</div>`;updatePW();return}
 const prep=PREP_KEYS[(PR.i=Math.floor(Math.random()*8))];const scn=mkScenario(prep);PR.sc=scn;PR.prep=prep;
 PR.scene=new Scene(sc,{onNew:()=>{}});const withRel=mode!=='move';const m=modelFor(scn,withRel);let P=solve(m);if(mode==='move'){const Pc=solve(modelFor(scn,true));P=Object.assign({},Pc,{[scn.s]:P[scn.s]})}PR.P=P;PR.m=m;PR.scene.update(P,{});
 const q=`Where is the ${lab(scn.s)}?`;
 if(mode==='choose'){const opts=[prep,...PREP_KEYS.filter(p=>p!==prep).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
  $('#pact').innerHTML=`<h2>Look and choose</h2><p class="q">${esc(q)}</p><p class="sub">${esc(sentenceOf(scn,true))}</p><div class="opts">${opts.map(o=>`<button class="opt" data-a="pchoose" data-v="${o}">${PREP_LABEL[o]}</button>`).join('')}</div><div id="pfb"></div>`}
 if(mode==='complete'){$('#pact').innerHTML=`<h2>Complete the sentence</h2><p class="q" id="psent">${esc(sentenceOf(scn,true))}</p><div class="opts">${PREP_KEYS.map(o=>`<button class="opt sm" data-a="pcomp" data-v="${o}">${PREP_LABEL[o]}</button>`).join('')}</div><div class="row"><input class="inp" id="pin" placeholder="or type the word" autocomplete="off"><button class="btn pri" data-a="pcheck">Check</button></div><div id="pfb"></div>`}
 if(mode==='move'){PR.start=JSON.parse(JSON.stringify(Object.fromEntries(Object.entries(P).map(([k,r])=>[k,{x:r.x,by:r.by,sc:r.sc}]))));
  $('#pact').innerHTML=`<h2>Move the object</h2><p class="q">Put the ${lab(scn.s)} ${PREP_LABEL[prep]} the ${lab(scn.a)}${scn.b?' and the '+lab(scn.b):''}.</p><p class="sub">Drag the ${lab(scn.s)} with your mouse or finger.</p><div id="pfb"></div><div class="acts"><button class="btn sm" data-a="pshow">Show me</button></div>`;setupDrag()}}
function fbHTML(ok,msg,extra){return`<div class="fb ${ok?'ok':'no'}">${msg}</div>${extra||''}`}
function recordOK(prep){S.prac.preps[prep]=(S.prac.preps[prep]||0)+1;S.prac.ok++;save();$('.score').textContent=`★ ${PREP_KEYS.filter(p=>(S.prac.preps[p]||0)>0).length}/8 prepositions practised`;updateMagic($('#pbl'),null,null)}
function demo(prep){const sc=PR.sc,m=modelFor(Object.assign({},sc,{prep}),true),P=solve(m);return`<div class="demo"><div class="sceneb mini" id="demo"></div><b>${PREP_LABEL[prep]}</b></div>`}
function mountDemo(prep){const sc=PR.sc,m=modelFor(Object.assign({},sc,{prep}),true),P=solve(m),h=$('#demo');if(h){const s=new Scene(h,{});s.update(P,{})}}
function pAnswer(v){const sc=PR.sc;if(PR.done)return;S.prac.tries++;
 if(v===PR.prep){PR.done=true;sfx.ok();recordOK(v);$('#pfb').innerHTML=fbHTML(1,`Yes! ${esc(sentenceOf(sc))}`,`<div class="acts"><button class="btn pri" data-a="pnext">Next →</button></div>`);$$('.opt').forEach(b=>{b.disabled=true;if(b.dataset.v===v)b.classList.add('ok')});if($('#psent'))$('#psent').textContent=sentenceOf(sc);updateMagic($('#pbl'),null,v);}
 else{sfx.no();$('#pfb').innerHTML=fbHTML(0,`Not this one. Look: this is “${PREP_LABEL[v]}”.`,demo(v)+`<div class="acts"><button class="btn pri" data-a="pretry">Try again</button></div>`);mountDemo(v);updateMagic($('#pbl'),null,v)}}
function setupDrag(){const sc=PR.sc,sc0=PR.scene,svg=sc0.svg;svg.style.touchAction='none';const key=sc.s,el=sc0.els[key];if(!el)return;el.g.style.cursor='grab';el.g.classList.add('drag');{const d=el.r.def;const hit=document.createElementNS(SVGNS,'rect');hit.setAttribute('x',-d.w/2-10);hit.setAttribute('y',-d.h-10);hit.setAttribute('width',d.w+20);hit.setAttribute('height',d.h+20);hit.setAttribute('fill','transparent');el.g.appendChild(hit)}
 let drag=false;const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
 el.g.onpointerdown=e=>{if(PR.done||PR.busy)return;drag=true;sc0.items.appendChild(el.g);el.r.z=900;el.g.setPointerCapture(e.pointerId);el.g.style.transition='none';el.g.style.cursor='grabbing';e.preventDefault()};
 el.g.onpointermove=e=>{if(!drag)return;const p=pt(e),r=el.r,h=r.def.h*r.sc;const by=clamp(p.y+h/2,120,695),x=clamp(p.x,30,970),s=r.def.type==='wall'?1:floorSc(by);el.cur={x,by,sc:s};el.g.style.transform=`translate(${x}px,${by}px) scale(${s})`;};
 el.g.onpointerup=e=>{if(!drag)return;drag=false;el.g.style.transition='';el.g.style.cursor='grab';const c=el.cur;if(!c)return;PR.busy=true;S.prac.tries++;
  const P=PR.P,A=P[sc.a],B=sc.b?P[sc.b]:null,Sx=Object.assign({},P[sc.s],c);
  const ok=holds(sc.prep,Sx,A,B);const correct=solve(modelFor(sc,true));
  if(ok){PR.done=true;sfx.ok();recordOK(sc.prep);sc0.update(correct,{});$('#pfb').innerHTML=fbHTML(1,`Great! ${esc(sentenceOf(sc))}`,`<div class="acts"><button class="btn pri" data-a="pnext">Next →</button></div>`);el.g.onpointerdown=null;updateMagic($('#pbl'),null,sc.prep)}
  else{sfx.no();sc0.update(correct,{});$('#pfb').innerHTML=fbHTML(0,`Look! The ${lab(sc.s)} ${LABEL[sc.s]&&LABEL[sc.s][1]?'go':'goes'} ${PREP_LABEL[sc.prep]} the ${lab(sc.a)}${sc.b?' and the '+lab(sc.b):''}. Now try again.`);setTimeout(()=>{if(PR.mode!=='move'||PR.sc!==sc)return;sc0.update(P,{});PR.busy=false},2300)}
  if(ok)PR.busy=false}}
function pShow(){const sc=PR.sc;if(PR.done||PR.busy)return;PR.busy=true;PR.scene.update(solve(modelFor(sc,true)),{});$('#pfb').innerHTML=fbHTML(1,`Here: ${esc(sentenceOf(sc))}`);setTimeout(()=>{if(PR.sc!==sc)return;PR.scene.update(PR.P,{});PR.busy=false;$('#pfb').innerHTML=''},2400)}
function updatePW(){const m=parseText(S.prac.text,PRESET),P=solve(m);PR.scene.update(P,{walls:m.walls,floor:m.floor});const used=[...m.used.preps];used.forEach(p=>{if(!(S.prac.wsSeen||{})[p]){S.prac.wsSeen=S.prac.wsSeen||{};S.prac.wsSeen[p]=1;recordOK(p)}});updateMagic($('#pbl'),m,null);const h=$('#phints');if(h)h.innerHTML=hintsHTML(m)}
/* ====================== TAB: POST ====================== */
function questionsFor(m){const q=[],ch=S.char;if(m.walls.length)q.push('What colour is your bedroom?');
 const rel=m.rels.filter(r=>!r.neg);rel.slice(0,2).forEach(r=>q.push(`Where is the ${lab(r.s)}?`));
 const pres=Object.keys(m.items).filter(id=>m.items[id].present&&!m.items[id].base&&!['room'].includes(id));if(pres.length)q.push(`Have you got a ${lab(pres[pres.length-1])} in real life? Where is it?`);
 const neg=Object.keys(m.items).filter(id=>m.items[id].neg&&!m.items[id].present);if(neg.length)q.push(`Would you like a ${lab(neg[0])} in your bedroom?`);
 if(m.likes.length)q.push(`Why do you like ${LIKES.find(l=>l.id===m.likes[0].id).label}?`);else q.push('What do you like doing in your bedroom?');
 ['Can you describe your bedroom?','What is your favourite thing in your bedroom?','Is your real bedroom the same?'].forEach(x=>q.push(x));return[...new Set(q)].slice(0,4)}
function tabPost(){const ch=S.char,m=parseText(S.text),nm=ch.name.trim()||'Me';const t=S.text.trim();
 $('#body').innerHTML=`<div class="postwrap"><article class="post"><div class="phead">${head(ch,56)}<div><b>${esc(nm)}</b><span>posted in <u>My bedroom</u></span></div></div><div class="pimgs"><div class="sceneb" id="psc"></div>${S.task.pic?`<img class="bookpic" src="${S.task.pic}" alt="Picture from the book">`:''}</div><div class="ptext">${t?esc(t).replace(/\n/g,'<br>'):'<span class="sub">Your text will appear here. Go to “My bedroom” and write!</span>'}</div>${m.likes.length?`<div class="plk">${m.likes.map(l=>`<span>${likeIcon(l.id,34)}${l.neg?'✗ ':''}${esc(LIKES.find(x=>x.id===l.id).label)}</span>`).join('')}</div>`:''}<div class="pact"><span>♥ Like</span><span>💬 Comment</span><span>↗ Share</span></div></article>
 <aside class="panel"><h2>Let's talk!</h2><p class="sub">Questions for the teacher to continue in speaking:</p><div class="rv">${questionsFor(m).map(q=>`<button data-a="bigq" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div><div class="acts"><button class="btn" data-a="print">🖨 Print</button></div></aside></div>`;
 const sc=new Scene($('#psc'),{});const P=solve(m);sc.update(P,{walls:m.walls,floor:m.floor,char:charFor(m),likes:m.likes})}
/* ====================== ROUTER ====================== */
function show(tab){S.tab=tab;save();$('#app').innerHTML=headerHTML()+'<main id="body"></main>';const b=$('#body');
 if(tab==='me')b.innerHTML=tabMe();else if(tab==='task')b.innerHTML=tabTask();else if(tab==='where')tabWhere();else if(tab==='write')tabWrite();else tabPost();
 if(tab==='where')updateMagic($('#pbl'),null,null);window.scrollTo(0,0)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,d=t.dataset;
 switch(a){
 case'tab':show(d.k);break;
 case'sound':S.sound=!S.sound;save();$('.tools').outerHTML=headerHTML().match(/<div class="tools">[\s\S]*<\/div><\/header>/)[0].replace('</header>','');break;
 case'restart':ask('Start again? Your character and text will be erased.','Start again',()=>{S=fresh();try{localStorage.removeItem(KEY)}catch(e){}show('me')});break;
 case'mx':$('#modal').innerHTML='';break;
 case'my':{const f=ask.cb;$('#modal').innerHTML='';f&&f();break}
 case'ctype':{S.char.type=d.v;if(!STYLES[d.v].some(x=>x[0]===S.char.style))S.char.style=STYLES[d.v][0][0];save();show('me');break}
 case'cset':S.char[d.f]=d.v;save();show('me');break;
 case'glasses':S.char.glasses=!S.char.glasses;save();show('me');break;
 case'tedit':S.task.edit=true;show('task');break;
 case'tsave':S.task.text=$('#ttext').value||DEFTASK;S.task.edit=false;save();show('task');break;
 case'pdel':S.task.pic=null;save();show('task');break;
 case'fr':{const ta=$('#wtext')||$('#ptext');if(ta)insertAt(ta,d.t);break}
 case'mw':{const ta=$('#wtext');if(!ta)break;insertAt(ta,d.c?d.w:(/^[aeiou]/.test(d.w)?'an ':'a ')+d.w);break}
 case'wclear':{const ta=$('#wtext');ta.value='';S.text='';save();updateWrite();break}
 case'pmode':S.prac.mode=d.k;save();startExercise();break;
 case'pchoose':pAnswer(d.v);break;
 case'pcomp':{const i=$('#pin');if(i)i.value=PREP_LABEL[d.v];pAnswer(d.v);break}
 case'pcheck':{const v=norm1($('#pin').value);if(!v){$('#pfb').innerHTML=fbHTML(0,'Choose one of the words, or type it.');sfx.no();break}pAnswer(v);break}
 case'pnext':startExercise();break;
 case'pretry':$('#pfb').innerHTML='';break;
 case'pshow':pShow();break;
 case'bigq':$('#modal').innerHTML=`<div class="ovl"><div class="dlg qd"><div class="bigq">${esc(d.q)}</div><div class="acts" style="justify-content:center"><button class="btn pri" data-a="mx">Close</button></div></div></div>`;break;
 case'print':try{window.print()}catch(er){toast('Printing is not available here.')}break;
 }});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='cname'){S.char.name=t.value;save();const p=$('.say');if(p)p.firstChild&&(p.innerHTML=`${t.value.trim()?`Hello, ${esc(t.value.trim())}!`:'Hello!'} I'm a ${S.char.type} with ${hairName(S.char.hair)} hair${S.char.glasses?' and glasses':''}.`)}
 if(t.id==='wtext'){S.text=t.value;save();updateWrite()}
 if(t.id==='ptext'){S.prac.text=t.value;save();updatePW()}});
document.addEventListener('change',e=>{if(e.target.id==='pfile')setPic(e.target.files[0])});
document.addEventListener('paste',e=>{if(S.tab!=='task')return;const it=Array.from((e.clipboardData||{}).items||[]).find(i=>/^image\//.test(i.type));if(it){setPic(it.getAsFile());e.preventDefault()}});
document.addEventListener('dragover',e=>{if(S.tab==='task')e.preventDefault()});
document.addEventListener('drop',e=>{if(S.tab!=='task')return;e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)setPic(f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').innerHTML='';if(e.key==='Enter'&&e.target.id==='pin'){const v=norm1(e.target.value);if(v)pAnswer(v)}});
load();show(S.tab);

</script>
