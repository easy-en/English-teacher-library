<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopping Mission</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:linear-gradient(#bfe6ff,#fff3d6);min-height:100vh;color:#1d2b3a}
#app{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:clamp(34px,7vw,60px);margin:6px 0;letter-spacing:2px;color:#e8543a;text-shadow:3px 3px 0 #1d2b3a}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 18px #0002;margin:10px 0}
.c{text-align:center}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 18px;background:#2f6fe0;color:#fff;font-weight:700;transition:.15s}
button:hover:not(:disabled){transform:translateY(-2px)}button:disabled{background:#aab;cursor:not-allowed}
.big{font-size:1.15em;padding:14px 28px;background:#e8543a}.alt{background:#fff;color:#2f6fe0;border:2px solid #2f6fe0}
input[type=text]{font:inherit;padding:11px;border-radius:12px;border:2px solid #9ab;width:min(320px,90%)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.av{border:3px solid transparent;border-radius:14px;padding:4px;background:#eef6ff;cursor:pointer}.av.on{border-color:#e8543a;background:#fff0ea}
.hud{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#1d2b3a;color:#fff;border-radius:14px;padding:8px 12px}
.route{display:flex;gap:4px}.dot{width:22px;height:22px;border-radius:50%;background:#456;font-size:12px;display:grid;place-items:center}.dot.d{background:#3cb371}.dot.n{background:#f2b632;color:#000}
.street{position:relative;overflow-x:auto;background:linear-gradient(#9fd4f5 0,#9fd4f5 60%,#8a8f98 60%);border-radius:14px;padding-top:50px}
.sin{display:flex;width:max-content;position:relative}.shop{width:96px;flex:none}.shop.cur{filter:drop-shadow(0 0 6px #ff0)}
.walker{position:absolute;top:92px;transition:left 1.2s ease-in-out,transform .6s,opacity .6s;z-index:3}.walker.walk svg{animation:bob .3s infinite}.walker.in{transform:scale(.3) translateY(-30px);opacity:0}
@keyframes bob{50%{transform:translateY(-4px)}}
.opts{display:grid;gap:10px;margin-top:10px}.opts button{background:#fff;color:#1d2b3a;border:2px solid #2f6fe0;font-size:1.05em}.opts button:hover{background:#e6f0ff}
.hint{min-height:26px;font-weight:700;color:#c0392b;margin-top:8px}.ok{color:#2a9d5c}
.phone{max-width:380px;margin:0 auto;background:#111;border-radius:30px;padding:14px 12px 18px}.scr{background:#eef2f6;border-radius:20px;padding:12px}
.from{font-weight:700;font-size:.85em;color:#555;margin-bottom:6px}.bub{background:#fff;border-radius:16px 16px 16px 4px;padding:12px;line-height:1.9;box-shadow:0 1px 3px #0003}
.bl{display:inline-block;min-width:70px;border-bottom:3px dashed #2f6fe0;text-align:center;font-weight:700;color:#2f6fe0}.bl.f{border-bottom:3px solid #3cb371;color:#2a9d5c}
.bg{margin:8px 0}.bg b{display:block;font-size:.8em;color:#555}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.prod{background:#fff;color:#1d2b3a;border:2px solid #dde;border-radius:14px;padding:10px 4px;text-align:center}.prod.got{background:#d6f5df;border-color:#3cb371;opacity:.7}.prod.shake,.opts .shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pic{width:54px;height:54px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;font-size:26px;background:#f3ead8}
.pop{animation:pop .5s}@keyframes pop{50%{transform:scale(1.15)}}
.list{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.list span{background:#fff3d6;padding:4px 10px;border-radius:20px;font-weight:700}.list .x{background:#d6f5df;text-decoration:line-through}
table{width:100%;border-collapse:collapse}td{padding:4px 6px;border-bottom:1px solid #eee}td:last-child{text-align:right;font-weight:700}
.rep{border:3px solid #e8543a;border-radius:18px;background:#fff;padding:16px}.rep .top{display:flex;gap:14px;align-items:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.cols{grid-template-columns:1fr}}
.stat{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:4px 0}
@media print{body{background:#fff}.noprint{display:none!important}.card{box-shadow:none}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5),M=c=>"£"+(c/100).toFixed(2),BUDGET=15000;
const AVS={girl:[{h:'#3b2314',t:'#e85d9a',s:'#f1c9a5',l:1},{h:'#d8a13a',t:'#3aa0e8',s:'#e7b48e',l:1},{h:'#1c1c1c',t:'#7bc74d',s:'#8d5a3b',l:0}],boy:[{h:'#2b1b10',t:'#2f6fe0',s:'#f1c9a5'},{h:'#a5521e',t:'#e8543a',s:'#e7b48e'},{h:'#111',t:'#f2b632',s:'#8d5a3b'}]};
function av(g,v,w=70){const a=AVS[g][v];return `<svg width="${w}" viewBox="0 0 100 150"><rect x="26" y="52" width="48" height="52" rx="10" fill="#444"/>${a.l?`<rect x="30" y="14" width="40" height="52" rx="18" fill="${a.h}"/>`:''}<rect x="33" y="98" width="14" height="38" rx="5" fill="#34495e"/><rect x="53" y="98" width="14" height="38" rx="5" fill="#34495e"/><ellipse cx="38" cy="140" rx="13" ry="7" fill="#fff" stroke="#999"/><ellipse cx="62" cy="140" rx="13" ry="7" fill="#fff" stroke="#999"/><rect x="28" y="56" width="44" height="50" rx="14" fill="${a.t}"/><rect x="18" y="58" width="13" height="38" rx="6" fill="${a.t}"/><rect x="69" y="58" width="13" height="38" rx="6" fill="${a.t}"/><rect x="42" y="50" width="16" height="10" fill="${a.s}"/><circle cx="50" cy="34" r="19" fill="${a.s}"/><path d="M30 34Q30 12 50 12Q70 12 70 34Q60 22 50 24Q40 22 30 34Z" fill="${a.h}"/><circle cx="43" cy="36" r="2" fill="#222"/><circle cx="57" cy="36" r="2" fill="#222"/><path d="M44 44Q50 49 56 44" stroke="#822" fill="none" stroke-width="2"/></svg>`}
const S=[
{n:"Bakery",c:"#e9a15b",i:"🥖",clue:"You can buy bread and cakes here.",o:["Butcher’s","Café"],hint:"Think about bread and cakes.",from:"Mum",t:"Hi, {n}! Can you get a {0} of bread, a {1} of jam and a {2} of cream cakes? Thanks!",b:[["loaf","bag","bar"],["jar","tube","pair"],["box","bunch","can"]],p:[["Bread",150,"🍞"],["Jam",200,"🍓"],["Cream cakes",350,"🧁"]],x:[["Croissants",200,"🥐"],["Doughnuts",250,"🍩"],["Biscuits",180,"🍪"]]},
{n:"Bookshop",c:"#7a5cc7",i:"📚",clue:"People come here to find books and dictionaries.",o:["Newsagent’s","Café"],hint:"You read things you buy here.",from:"Dad",t:"Hi {n}, I need a {0} of pens and a {1} of pencils for school, please.",b:[["packet","loaf","bunch"],["box","pair","bar"]],p:[["Pens",250,"🖊️"],["Pencils",200,"✏️"]],x:[["Notebook",300,"📓"],["Dictionary",800,"📖"],["Story book",600,"📕"]]},
{n:"Butcher’s",c:"#c0392b",i:"🥩",clue:"This is the place for meat.",o:["Greengrocer’s","Bakery"],hint:"Think about meat for dinner.",from:"Mum",t:"{n}, we need a {0} of sausages and a {1} of chicken for dinner. Thank you!",b:[["packet","bunch","loaf"],["piece","jar","pair"]],p:[["Sausages",350,"🌭"],["Chicken",500,"🍗"]],x:[["Beef",700,"🥩"],["Bacon",300,"🥓"],["Lamb",800,"🍖"]]},
{n:"Café",c:"#8d5a3b",i:"☕",clue:"You can have a cup of coffee and a snack here.",o:["Bakery","Newsagent’s"],hint:"You can sit and drink here.",from:"Dad",t:"Hey {n}! Two {0} of coffee, a {1} of tea and a {2} of cake, please. Get something for you too!",b:[["cups","cup","packets"],["cup","jar","bag"],["piece","bottle","pair"]],p:[["Coffee",250,"☕"],["Tea",200,"🫖"],["Cake",300,"🍰"]],x:[["Hot chocolate",300,"🍫"],["Sandwich",400,"🥪"],["Orange juice",200,"🧃"]]},
{n:"Clothes shop",c:"#e85d9a",i:"👕",clue:"Looking for T-shirts, trousers and jackets? Come here!",o:["Shoe shop","Bookshop"],hint:"Think about what you wear.",from:"Mum",t:"Hi {n}! I need a {0} of socks and two {1} of jeans for your brother.",b:[["pair","bunch","bar"],["pairs","pair","bunches"]],p:[["Socks",400,"🧦"],["Jeans",2500,"👖"]],x:[["T-shirt",1000,"👕"],["Jacket",3000,"🧥"],["Cap",800,"🧢"]]},
{n:"Florist’s",c:"#3cb371",i:"💐",clue:"Fresh flowers are on sale in this shop.",o:["Greengrocer’s","Pharmacy"],hint:"Think about flowers.",from:"Dad",t:"{n}, it’s Grandma’s birthday! Please get a {0} of flowers and a {1} of chocolates.",b:[["bunch","bottle","pair"],["box","jar","pair"]],p:[["Flowers",600,"🌼"],["Chocolates",500,"🍬"]],x:[["Roses",1200,"🌹"],["Plant",700,"🪴"],["Card",200,"💌"]]},
{n:"Greengrocer’s",c:"#7bc74d",i:"🍎",clue:"Here you can find fruit and vegetables.",o:["Butcher’s","Florist’s"],hint:"Think about fruit and vegetables.",from:"Mum",t:"Hi {n}! Can you buy a {0} of apples, two {1} of potatoes and a {2} of carrots? Thanks!",b:[["bag","bar","bottle"],["bags","bag","bars"],["bag","loaf","tube"]],p:[["Apples",200,"🍎"],["Potatoes",150,"🥔"],["Carrots",120,"🥕"]],x:[["Bananas",150,"🍌"],["Tomatoes",200,"🍅"],["Onions",100,"🧅"]]},
{n:"Newsagent’s",c:"#2f6fe0",i:"📰",clue:"Where can you buy newspapers and magazines?",o:["Bookshop","Pharmacy"],hint:"Think about papers and snacks.",from:"Dad",t:"Hi {n}! Get a {0} of chocolate, a {1} of cola and a {2} of crisps. Thanks!",b:[["bar","bunch","loaf"],["can","bar","pair"],["packet","loaf","bunch"]],p:[["Chocolate",100,"🍫"],["Cola",100,"🥤"],["Crisps",120,"🥔"]],x:[["Newspaper",150,"📰"],["Magazine",350,"📔"],["Postcards",200,"🖼️"]]},
{n:"Pharmacy",c:"#16a6a6",i:"💊",clue:"You can get medicine and toothpaste here.",o:["Clothes shop","Café"],hint:"Think about medicine.",from:"Mum",t:"{n}, I need a {0} of toothpaste, a {1} of shampoo and a {2} of tissues. Thanks!",b:[["tube","bar","loaf"],["bottle","pair","bunch"],["packet","bottle","pair"]],p:[["Toothpaste",250,"🪥"],["Shampoo",300,"🧴"],["Tissues",150,"🤧"]],x:[["Plasters",200,"🩹"],["Soap",150,"🧼"],["Sun cream",600,"🧴"]]},
{n:"Shoe shop",c:"#f2b632",i:"👟",clue:"This shop sells trainers and boots.",o:["Clothes shop","Newsagent’s"],hint:"Think about your feet.",from:"Dad",t:"Last one, {n}! A {0} of trainers and a {1} of shoe polish, please.",b:[["pair","bunch","loaf"],["tin","pair","bunch"]],p:[["Trainers",4000,"👟"],["Shoe polish",300,"✨"]],x:[["Boots",4500,"🥾"],["Slippers",1200,"🩴"],["Sandals",2000,"👡"]]}];
let st;
function init(){st={step:'welcome',name:'',g:'girl',v:0,i:0,sf:[],bf:S.map(s=>[]),att:0,basket:[],spent:0,hint:''}}
const A=$('#app');
function hud(){const d=st.i;return `<div class="hud noprint"><div class="row">${av(st.g,st.v,26)}<b>${esc(st.name)}</b></div><div class="route">${S.map((s,k)=>`<div class="dot ${k<d||(st.done)?'d':k==d?'n':''}" title="${s.n}">${k<d||st.done?'✓':k+1}</div>`).join('')}</div><div>🧺 ${st.basket.length} items · Budget ${M(BUDGET)}</div></div>`}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shopSVG(k,cur){const s=S[k];return `<div class="shop ${cur?'cur':''}"><svg viewBox="0 0 96 130" width="96"><rect x="6" y="30" width="84" height="100" fill="#f7efe0" stroke="#555"/><path d="M2 30h92l-6-18H8z" fill="${s.c}"/><path d="M20 12l-4 18M36 12l-2 18M52 12v18M68 12l2 18M80 12l4 18" stroke="#fff8" stroke-width="5"/><rect x="12" y="34" width="72" height="16" rx="3" fill="#1d2b3a"/><text x="48" y="46" font-size="${s.n.length>11?8.5:10}" fill="#fff" text-anchor="middle" font-weight="700">${s.n}</text><rect x="14" y="58" width="36" height="40" fill="#bfe6ff" stroke="#555"/><text x="32" y="86" font-size="24" text-anchor="middle">${s.i}</text><rect x="58" y="58" width="26" height="72" fill="${s.c}" stroke="#555"/><circle cx="64" cy="96" r="2" fill="#fff"/></svg></div>`}
function go(step){st.step=step;st.hint='';render()}
function render(){const f=window['v_'+st.step];A.innerHTML=f();if(st.step=='street')walk()}
function v_welcome(){return `<div class="card c"><h1>SHOPPING MISSION</h1><p style="font-size:1.2em">Mum needs your help. Can you get everything on the list?</p><p><input id="nm" type="text" maxlength="14" placeholder="Your name" value="${esc(st.name)}" oninput="st.name=this.value.trim();$('#go').disabled=!st.name"></p>
<div class="row"><button class="${st.g=='girl'?'':'alt'}" onclick="st.g='girl';st.v=0;render()">Girl</button><button class="${st.g=='boy'?'':'alt'}" onclick="st.g='boy';st.v=0;render()">Boy</button></div>
<p>Choose your look:</p><div class="row">${[0,1,2].map(k=>`<div class="av ${st.v==k?'on':''}" onclick="st.v=${k};render()">${av(st.g,k,78)}</div>`).join('')}</div>
<p><button id="go" class="big" ${st.name?'':'disabled'} onclick="if(st.name){st.o=sh([S[0].n,...S[0].o]);go('street')}">Start Shopping</button></p></div>`}
function v_street(){const s=S[st.i];if(!st.o)st.o=sh([s.n,...s.o]);
return hud()+`<div class="card"><div class="street"><div class="sin">${S.map((_,k)=>shopShow(k)).join('')}<div class="walker" id="wk" style="left:${Math.max(st.i-1,0)*96+14}px">${av(st.g,st.v,66)}</div></div></div>
<h3>Shop ${st.i+1} of 10: Which shop is this?</h3><p style="font-size:1.2em;margin:4px 0">“${s.clue}”</p><div class="opts" id="op">${st.o.map(o=>`<button onclick="pickShop(this,'${o.replace("’","&rsquo;")}')">${o}</button>`).join('')}</div><div class="hint" id="ht"></div></div>`}
function shopShow(k){let h=shopSVG(k,k==st.i);if(k>=st.i)h=h.replace(/(<text x="48" y="46"[^>]*>)[^<]*(<\/text>)/,'$1SHOP$2').replace(/(<text x="32" y="86"[^>]*>)[^<]*(<\/text>)/,'$1?$2').replace(/font-size="[\d.]+" fill="#fff" text-anchor="middle" font-weight="700">SHOP/,'font-size="10" fill="#fff" text-anchor="middle" font-weight="700">SHOP');return h}
function walk(){const w=$('#wk');if(!w)return;w.classList.add('walk');const sc=$('.street');requestAnimationFrame(()=>requestAnimationFrame(()=>{w.style.left=st.i*96+14+'px';sc.scrollTo({left:Math.max(0,st.i*96-200),behavior:'smooth'})}));setTimeout(()=>w.classList.remove('walk'),1300)}
function pickShop(b,name){const s=S[st.i];st.att++;if(name===s.n){if(st.sf[st.i]===undefined)st.sf[st.i]=true;$('#ht').className='hint ok';$('#ht').textContent='Correct! Let’s go in.';document.querySelectorAll('#op button').forEach(x=>x.disabled=true);$('#wk').classList.add('in');setTimeout(()=>{st.mo=s.b.map(x=>sh(x));st.bd=s.b.map(()=>null);go('msg')},900)}else{if(st.sf[st.i]===undefined)st.sf[st.i]=false;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);$('#ht').textContent='Not quite. Try again. Hint: '+s.hint}}
function v_msg(){const s=S[st.i],done=st.bd.every(x=>x);let t=esc(s.t.replace('{n}',st.name)).replace(/\{(\d)\}/g,(m,j)=>`<span class="bl ${st.bd[j]?'f':''}">${st.bd[j]||'&nbsp;'+(+j+1)+'&nbsp;'}</span>`);
return hud()+`<div class="card c"><h3>${s.n}: Message from ${s.from}</h3><div class="phone"><div class="scr"><div class="from">📱 ${s.from} · now</div><div class="bub" style="text-align:left">${t}</div></div></div>
<p>Choose the right word for each blank.</p>${s.b.map((_,j)=>st.bd[j]?'':`<div class="bg"><b>Blank ${j+1}</b><div class="row">${st.mo[j].map(o=>`<button class="alt" onclick="pickBl(this,${j},'${o}')">${o}</button>`).join('')}</div></div>`).join('')}
<div class="hint ${done?'ok':''}" id="ht">${done?'Great! You’ve got it.':''}</div>${done?`<button class="big" onclick="st.pr=sh([...S[st.i].p,...S[st.i].x]);st.got=[];go('shop')">Go shopping</button>`:''}</div>`}
function pickBl(b,j,o){const s=S[st.i];st.att++;if(o===s.b[j][0]){if(st.bf[st.i][j]===undefined)st.bf[st.i][j]=true;st.bd[j]=o;render()}else{if(st.bf[st.i][j]===undefined)st.bf[st.i][j]=false;b.classList.add('shake');$('#ht').textContent='Not quite. Try again.'}}
function v_shop(){const s=S[st.i],all=st.got.length==s.p.length;
return hud()+`<div class="card"><h3>${s.n}: ${s.from}’s list</h3><div class="list">${s.p.map(p=>`<span class="${st.got.includes(p[0])?'x':''}">${p[0].toLowerCase()}</span>`).join('')}</div>
<div class="grid">${st.pr.map(p=>`<button class="prod ${st.got.includes(p[0])?'got':''}" onclick="pickProd(this,'${p[0]}')"><div class="pic">${p[2]}</div><b>${p[0]}</b><br>${M(p[1])}${st.got.includes(p[0])?'<br>✓':''}</button>`).join('')}</div>
<div class="hint ${all?'ok':''}" id="ht">${all?(st.i<9?'Everything is in the basket! One more shop to go!':'Everything is in the basket!'):st.hint}</div>${all?`<div class="c"><button class="big" onclick="nextShop()">${st.i<9?'Next shop →':'Go home 🏠'}</button></div>`:''}</div>`}
function pickProd(b,n){const s=S[st.i],p=s.p.find(x=>x[0]==n);if(st.got.includes(n))return;if(p){st.got.push(n);st.basket.push({n,c:p[1]});st.spent+=p[1];st.hint='';render();const e=[...document.querySelectorAll('.prod')].find(x=>x.querySelector('b').textContent==n);e&&e.classList.add('pop')}else{b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);$('#ht').textContent='Not in the message. Read it again.'}}
function nextShop(){if(st.i<9){st.i++;st.o=null;go('street')}else{st.done=true;go('home')}}
function v_home(){const who=S[9].from=='Dad'?'Dad':'Mum';return hud()+`<div class="card c"><h3>🏠 Home</h3><div class="row">${av(st.g,st.v,80)}<div class="phone" style="margin:0"><div class="scr"><div class="bub" style="text-align:left">Thank you, ${esc(st.name)}! You’ve got everything!</div></div></div></div>
${st.twist?`<h2>And look! You brought back the change!</h2>${money()}<button class="big" onclick="go('final')">See my report</button>`:`<p><button class="big" onclick="st.twist=1;render()">Give the shopping</button></p>`}</div>`}
function money(){return `<table>${st.basket.map(b=>`<tr><td>${b.n}</td><td>${M(b.c)}</td></tr>`).join('')}</table><div class="stat"><span>Budget</span><b>${M(BUDGET)}</b></div><div class="stat"><span>Spent</span><b>${M(st.spent)}</b></div><div class="stat"><span>Change</span><b style="color:#2a9d5c">${M(BUDGET-st.spent)}</b></div>`}
function report(){const sc=st.sf.filter(x=>x).length,bc=st.bf.flat().filter(x=>x).length,bt=S.reduce((a,s)=>a+s.b.length,0);
return `<div class="rep"><div class="top">${av(st.g,st.v,90)}<div><h2 style="margin:0;color:#e8543a">SHOPPING MISSION REPORT</h2><h3 style="margin:2px 0">${esc(st.name)}</h3></div></div><div class="cols"><div>
<div class="stat"><span>Shops completed</span><b>10/10</b></div><div class="stat"><span>Shops found first time</span><b>${sc}/10</b></div><div class="stat"><span>Container words right first time</span><b>${bc}/${bt}</b></div><div class="stat"><span>Total attempts</span><b>${st.att}</b></div><div class="stat"><span>Items collected</span><b>${st.basket.length}</b></div>
<div class="stat"><span>Budget</span><b>${M(BUDGET)}</b></div><div class="stat"><span>Spent</span><b>${M(st.spent)}</b></div><div class="stat"><span>Change</span><b>${M(BUDGET-st.spent)}</b></div></div>
<div><b>Shopping basket</b><div class="list" style="font-size:.85em">${st.basket.map(b=>`<span>${b.n}</span>`).join('')}</div></div></div></div>`}
function v_final(){return `<div class="card">${report()}<p class="c"><button class="big" onclick="go('send')">SEND TO YOUR TEACHER</button> <button class="alt" onclick="if(confirm('Play again? Everything will be reset.')){init();render()}">Play again</button></p></div>`}
function v_send(){return `<div class="card"><p class="c"><b>Take a screenshot of your report and send it to your teacher.</b></p>${report()}<p class="c noprint"><button onclick="print()">Print / Save as PDF</button> <button class="alt" onclick="go('final')">Back to Results</button></p></div>`}
init();render();
</script></body></html>
