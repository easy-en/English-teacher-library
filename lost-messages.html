TASKS[12].options=['Olivia said that she worked there at that moment.','Olivia said that she was working there at that moment.','Olivia said that she works here now.'];TASKS[12].answer=TASKS[12].options[0];TASKS[12].hint='“I work” is Present Simple → worked. at the moment → at that moment.';TASKS[12].why='work → worked (not was working), even though “at the moment” sounds unusual here.';

// Reconfigure the whole quest: one mechanic per world, no repeated four-type cycle.
TASKS.forEach((t,i)=>{const n=i%4,world=t.loc,entry=WORLD_PUZZLES[world][n];delete t.answers;delete t.answer;delete t.words;delete t.options;
 if(world===0){t.type='fill';t.prompt=entry[0];t.answer=entry[1];t.hint='Change the Present Simple verb into Past Simple; check negatives.';t.why='The missing grammar code is '+entry[1]+'.';}
 if(world===1){t.type='rewrite';t.prompt='ERROR HUNT: The intercepted report contains a mistake. Rewrite the WHOLE report correctly.';t.badReport=entry[0];t.answers=[entry[1]];t.hint='Look carefully at the verb or the pronoun in the intercepted report.';t.why='Correct repair: '+entry[1];}
 if(world===2){t.type='order';t.prompt='REBUILD THE SIGNAL: Put every block in the correct order.';t.answer=entry[0];t.words=entry[0].replace(/\.$/,'').split(' ');t.words=[...t.words].sort((a,b)=>((a.length*17+a.charCodeAt(0))%31)-((b.length*17+b.charCodeAt(0))%31));t.hint='Begin with the speaker and said that, then build the reported message.';t.why='Recovered sentence: '+entry[0];}

const STORAGE='lostMessagesB1v2';const initial=()=>({name:'',screen:'welcome',idx:0,completed:{},responses:{},writing:'',writingChecks:0,writingStatus:'Not checked',startedAt:new Date().toISOString(),finishedAt:null,teacherSkips:[]});let state;try{state={...initial(),...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch{state=initial()}let draft='',attempt=0,selected='',order=[],bank=[],notice='',noticeType='',revealed=false,teacherOpen=false;
const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/\bdo not\b/g,"don't").replace(/\bdoes not\b/g,"doesn't").replace(/\bwas not\b/g,"wasn't").replace(/\bwere not\b/g,"weren't").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();const save=()=>localStorage.setItem(STORAGE,JSON.stringify(state));const doneCount=()=>Object.keys(state.completed).length;const locDone=n=>TASKS.every((t,i)=>t.loc!==n||state.completed[i]);const img=(id)=>'lost-messages-assets/'+id+'.png';
function topUpdate(){document.getElementById('playerBadge').textContent='Agent: '+(state.name||'—');document.getElementById('progressBadge').textContent=doneCount()+' / 20';}
function hero(id,title){return `<div class="hero"><img src="${img(id)}" alt="Detailed neon voxel-style ${esc(title)} landscape"><div class="heroTitle">${esc(title)}</div></div>`}
const MISSIONS=['VILLAGE · Fill the missing code','CRYSTAL MINE · Find and fix errors','FOREST · Arrange the message blocks','CYBER CITY · Write the full report','FORTRESS · Spot the true transmission'];
let scenePhase='mission';
function sceneShell(id,body,extra=''){return `<div class="scene"><img class="sceneBack" src="${img(id)}" alt="Voxel adventure world"><div class="sceneShade"></div>${extra}${body}</div>`}
function sceneHeader(title,subtitle){return `<div class="sceneHud"><div><div class="sceneMissionLabel">THE LOST MESSAGES · B1 QUEST</div><h1>${esc(title)}</h1><span class="tag">${esc(subtitle)}</span></div><span class="pill">${doneCount()} / 20 restored</span></div>`}
function render(){topUpdate();let out='';if(state.screen==='welcome')out=sceneShell('village',`<div class="introOverlay"><div class="tag">CINEMATIC VOXEL ADVENTURE</div><h1>THE LOST MESSAGES</h1><p>Five worlds. Five unique challenge types. Watch your actions change the world and unlock the final portal.</p><input id="name" class="field" maxlength="40" autocomplete="off" placeholder="Agent name" value="${esc(state.name)}"><br><button class="primary" onclick="startGame()">ENTER THE ADVENTURE →</button></div>`);
else if(state.screen==='rules')out=`<div class="rulesScreen">${rulesHTML().replace(/^<div class="hero">[\s\S]*?<\/div>/,'')}</div>`;
else if(state.screen==='map')out=mapHTML();
else if(state.screen==='task')out=taskHTML();
else if(state.screen==='final')out=sceneShell('fortress',`<div class="missionOverlay"><div class="missionPanel">${finalHTML().replace(/^<div class="hero">[\s\S]*?<\/div>/,'')}</div></div>`,sceneHeader('PORTAL FORTRESS','Final writing mission'));
else if(state.screen==='report')out=`<div style="max-width:1100px;margin:85px auto 30px;padding:12px">${reportHTML()}</div>`;
app.innerHTML=out;if(state.screen==='task'&&scenePhase==='mission')setupTask();if(state.screen==='final')setupFinal()}
function startGame(){let v=document.getElementById('name').value.trim();if(!v){document.getElementById('name').focus();return}state.name=v;state.screen='rules';save();render()}
function rulesHTML(){return hero('village','MISSION BRIEFING')+`<section class="card"><h2>Quick Grammar Guide</h2><p class="muted">Imagine you're telling someone later what another person said. Use <strong>said (that)</strong>. These exercises practise statements only.</p><div class="grid"><div class="rule"><strong>Present Simple → Past Simple</strong><p>“I play games.”<br>He said (that) he <b>played</b> games.</p><p>“I don’t play.” → He said he <b>didn’t play</b>.</p></div><div class="rule"><strong>Present Continuous → Past Continuous</strong><p>“I am playing.”<br>She said (that) she <b>was playing</b>.</p><p>“We are playing.” → They said they <b>were playing</b>.</p></div><div class="rule"><strong>Pronouns</strong><p>I → he / she<br>my → his / her<br>we → they</p><p class="small">Change them according to who is speaking.</p></div></div><h3>Time and place changes</h3><div class="grid">${[['today','that day'],['tomorrow','the next day'],['yesterday','the day before / the previous day'],['now','then'],['at the moment','at that moment'],['last week','the week before / the previous week'],['next week','the following week / the next week'],['here','there']].map(x=>`<div class="rule"><b>${x[0]}</b> → ${x[1]}</div>`).join('')}</div><p class="muted small">These changes depend on the reporting context. In this quest, you report the messages later, from a different time or place.</p><div class="row spaced"><button class="primary" onclick="state.screen='map';save();render()">ENTER THE WORLD →</button></div></section>`}
function showRules(){let old=state.screen;openModal(`<h2>Grammar Reminder</h2><div class="rule">Present Simple → Past Simple<br>“I like it.” → She said she liked it.</div><div class="rule spaced">Present Continuous → Past Continuous<br>“I am working.” → He said he was working.</div><p>today → that day · tomorrow → the next day · yesterday → the day before · now → then · at the moment → at that moment · last week → the week before · next week → the following week</p><p>Remember pronouns: I → he/she; my → his/her; we → they.</p><button onclick="closeModal()">Close</button>`)}
function mapHTML(){let open=LOC.findIndex((l,i)=>!locDone(i));let tiles=LOC.map((l,i)=>`<button class="worldTile ${i>open&&open!==-1?'locked':''} ${i===open?'current':''} ${locDone(i)?'done':''}" ${i>open&&open!==-1?'disabled':''} onclick="goLocation(${i})"><img src="${img(l.id)}" alt="${esc(l.name)}"><strong>${i+1}. ${esc(l.name)}</strong><small>${locDone(i)?'✓ COMPLETED':i===open?'▶ ENTER MISSION':'🔒 LOCKED'}</small></button>`).join('');return sceneShell('city',`<div class="mapTitle"><div class="sceneMissionLabel">SELECT A PORTAL</div><h1>THE FIVE WORLDS</h1><p>Each world has a different type of challenge. Complete four missions to unlock the next.</p>${doneCount()===20?`<button class="primary" onclick="state.screen='final';save();render()">✨ OPEN FINAL PORTAL</button>`:''}</div><div class="sceneWorlds">${tiles}</div>`)}
function goLocation(n){scenePhase='mission';let i=TASKS.findIndex((t,j)=>t.loc===n&&!state.completed[j]);if(i<0){state.screen='map'}else{state.idx=i;state.screen='task';resetTask()}save();render()}
function resetTask(){draft='';selected='';order=[];bank=[];notice='';noticeType='';revealed=false;attempt=0}
function taskHTML(){let t=TASKS[state.idx],loc=LOC[t.loc],head=sceneHeader(loc.name,MISSIONS[t.loc]);if(scenePhase==='restored'){let expected=t.answer||t.answers[0];return sceneShell(loc.id,`<div class="scenePulse"></div><div class="worldEvent event${t.loc}"><span class="eventHero">${['🧑‍🚀','⛏️','🦊','🤖','🧙'][t.loc]}</span><span class="eventThing">${['⚽','💎','✉️','📡','🔑'][t.loc]}</span><span class="eventSpark">✦ ✧ ✦</span></div><div class="transmission"><div class="sceneMissionLabel">✦ MESSAGE RESTORED · ${state.idx+1}/20</div><p><b>${esc(t.speaker)}</b> ${esc(t.quote)}</p><p style="color:#a7ffdf">${esc(expected)}</p></div><div class="sceneAction"><div class="sceneToast">✓ Signal repaired! Your action has changed the world!</div><button class="primary spaced" onclick="finishTask()">${state.idx%4===3?'UNLOCK NEXT WORLD →':'CONTINUE THE ADVENTURE →'}</button></div>`,head)}return sceneShell(loc.id,`<div class="missionOverlay"><div class="missionPanel"><div class="row between"><span class="tag">MISSION ${state.idx+1} / 20</span><span class="pill">${esc(MISSIONS[t.loc])}</span></div><p class="muted">${esc(t.speaker)}</p><div class="example"><div class="prompt">${esc(t.quote)}</div></div><h2>${esc(t.prompt)}</h2>${t.badReport?`<div class="intercepted">⚠ CORRUPTED MESSAGE: <b>${esc(t.badReport)}</b></div>`:""}<div id="taskInput"></div><div id="taskNotice"></div><div class="row spaced"><button class="primary" id="checkBtn" onclick="checkTask()">RESTORE MESSAGE</button><button class="ghost" onclick="showRules()">📖 Rules</button></div></div></div>`,head)}
function setupTask(){let t=TASKS[state.idx],el=document.getElementById('taskInput');if(t.type==='choice')el.innerHTML=t.options.map((o,i)=>`<button class="choice" data-choice="${i}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('');if(t.type==='fill'||t.type==='rewrite'){el.innerHTML=`<input class="field" id="answer" autocomplete="off" spellcheck="false" placeholder="${t.type==='fill'?'Type the missing word':'Type the complete corrected report'}" aria-label="Your answer">`;antiPaste(document.getElementById('answer'));document.getElementById('answer').addEventListener('keydown',e=>{if(e.key==='Enter')checkTask()})}if(t.type==='order'){bank=t.words.map((w,i)=>({w,i}));el.innerHTML=`<div class="answerLine" id="orderLine">Tap the words in the correct order</div><div class="bank" id="bank"></div><button class="ghost spaced" onclick="order=[];paintOrder()">Clear words</button>`;paintOrder()}}
function choose(i){selected=TASKS[state.idx].options[i];document.querySelectorAll('[data-choice]').forEach((b,j)=>b.classList.toggle('selected',j===i))}
function paintOrder(){let t=TASKS[state.idx];document.getElementById('orderLine').textContent=order.length?order.map(i=>t.words[i]).join(' '):'Tap the words in the correct order';document.getElementById('bank').innerHTML=t.words.map((w,i)=>`<button class="word ${order.includes(i)?'used':''}" ${order.includes(i)?'disabled':''} onclick="order.push(${i});paintOrder()">${esc(w)}</button>`).join('')}
function taskAnswer(){let t=TASKS[state.idx];if(t.type==='choice')return selected;if(t.type==='order')return order.map(i=>t.words[i]).join(' ');return document.getElementById('answer')?.value.trim()||''}
function taskCorrect(ans,t){let expected=t.answers||[t.answer];return expected.some(x=>norm(ans)===norm(x))}
function checkTask(){if(revealed){finishTask();return}let t=TASKS[state.idx],ans=taskAnswer();if(!ans){notify('Enter or select an answer first.','warn');return}attempt++;let correct=taskCorrect(ans,t);let rec=state.responses[state.idx]||{first:ans,attempts:0};rec.last=ans;rec.attempts=attempt;rec.correct=correct;rec.status=correct?'Correct':attempt>=2?'Completed after help':'Try again';state.responses[state.idx]=rec;save();if(correct){revealed=true;notify('✓ Transmission restored! '+t.why,'success');nextButton()}else if(attempt===1){notify('Not quite. Hint: '+t.hint,'warn')}else{revealed=true;notify('Answer explained: '+(t.answer||t.answers[0])+' — '+t.why,'warn');nextButton()}}
function nextButton(){scenePhase='restored';render()}
function notify(msg,type){let el=document.getElementById('taskNotice');el.innerHTML=`<div class="feedback ${type}">${esc(msg)}</div>`}
function finishTask(){scenePhase='mission';state.completed[state.idx]=true;let next=TASKS.findIndex((t,i)=>!state.completed[i]&&t.loc===TASKS[state.idx].loc);if(next<0){state.screen='map'}else{state.idx=next;resetTask();state.screen='task'}save();render()}
const CHAT=[['Max','I play in the village every day.'],['Mia','I am looking for the crystal now.'],['Ben','We need help today.'],['Lily','My friends are building a bridge at the moment.']];
function finalHTML(){return hero('fortress','THE LAST LETTER')+`<section class="card"><span class="tag">FINAL LETTER MISSION</span><h2>Write the final secret letter</h2><p>Write a short <b>letter to the commander</b> of <b>4–5 sentences</b>. Tell the commander what the characters said. Use <b>Past Simple</b> and <b>Past Continuous</b>, and change pronouns and time expressions.</p><div class="grid">${CHAT.map(([n,s])=>`<div class="rule"><strong>${n}:</strong><p>“${s}”</p></div>`).join('')}</div><div class="example spaced"><b>One worked example (different message):</b><p>Direct: <i>“I am fixing the portal now,” Tom said.</i></p><p>Reported: <b>Tom said that he was fixing the portal then.</b></p></div><label for="writing" class="spaced" style="display:block">Your final letter to the commander (4–5 sentences)</label><textarea id="writing" class="field" placeholder="Max said that ..." spellcheck="false"></textarea><p class="muted small">Type your own work. Pasting and drag-and-drop are disabled in this writing field.</p><div id="writingFeedback"></div><div class="row spaced"><button class="primary" onclick="checkWriting()">CHECK MY REPORT</button><button onclick="finishWriting()">FINISH & VIEW TEACHER REPORT →</button></div></section>`}
function setupFinal(){let ta=document.getElementById('writing');ta.value=state.writing||'';antiPaste(ta);ta.addEventListener('input',()=>{state.writing=ta.value;state.writingStatus='Not checked';save()})}
function antiPaste(el){el.addEventListener('paste',e=>{e.preventDefault();showAntiPaste(el)});el.addEventListener('drop',e=>{e.preventDefault();showAntiPaste(el)});el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'){e.preventDefault();showAntiPaste(el)} });el.addEventListener('beforeinput',e=>{if(['insertFromPaste','insertFromDrop'].includes(e.inputType))e.preventDefault()});el.addEventListener('contextmenu',e=>e.preventDefault())}
function showAntiPaste(el){el.title='Please type your answer yourself';el.style.borderColor='#ff8bac';setTimeout(()=>el.style.borderColor='',1100)}
function writingAnalysis(s){let text=s.trim();let sentences=text.split(/[.!?]+/).map(x=>x.trim()).filter(Boolean);let checks=[{name:'Max: played',ok:/\bmax\s+said\s+(?:that\s+)?he\s+played\b/i.test(text)},{name:'Mia: was looking; now → then',ok:/\bmia\s+said\s+(?:that\s+)?she\s+was\s+looking\b[^.!?]*\bthen\b/i.test(text)},{name:'Ben: needed; today → that day',ok:/\bben\s+said\s+(?:that\s+)?they\s+needed\b[^.!?]*\bthat\s+day\b/i.test(text)},{name:'Lily: were building; my → her',ok:/\blily\s+said\s+(?:that\s+)?her\s+friends\s+were\s+building\b[^.!?]*\bat\s+that\s+moment\b/i.test(text)}];return{sentences:sentences.length,checks,matched:checks.filter(x=>x.ok).length}}

function finishWriting(){let text=document.getElementById('writing').value.trim();let r=writingAnalysis(text);if(r.sentences<4){document.getElementById('writingFeedback').innerHTML='<div class="feedback warn">Please write at least four sentences before finishing.</div>';return}state.writing=text;state.writingStatus=state.writingStatus==='Not checked'?'Needs teacher review':state.writingStatus;state.finishedAt=new Date().toISOString();state.screen='report';save();render()}
function reportHTML(){let count=doneCount(),first=Object.values(state.responses).filter(r=>r.correct&&r.attempts===1).length,second=Object.values(state.responses).filter(r=>r.correct&&r.attempts===2).length,help=Object.values(state.responses).filter(r=>!r.correct&&r.attempts>=2).length;return `<section class="card"><h1>TEACHER REPORT</h1><p><b>Agent:</b> ${esc(state.name)} · <b>Date:</b> ${new Date().toLocaleDateString('en-GB')} · <b>Completed:</b> ${count}/20</p><div class="grid"><div class="rule"><b>First try:</b> ${first}</div><div class="rule"><b>Second try:</b> ${second}</div><div class="rule"><b>After help:</b> ${help}</div><div class="rule"><b>Teacher skipped:</b> ${state.teacherSkips.length}</div></div><h2>Progress by location</h2><div class="grid">${LOC.map((l,i)=>`<div class="rule"><b>${esc(l.name)}</b><br>${TASKS.filter((t,j)=>t.loc===i&&state.completed[j]).length}/4 completed</div>`).join('')}</div><h2>All 20 responses</h2><div style="overflow-x:auto"><table class="reportTable"><thead><tr><th># / Location</th><th>Original message / task</th><th>First answer</th><th>Final answer</th><th>Expected answer</th><th>Attempts / status</th></tr></thead><tbody>${TASKS.map((t,i)=>{let r=state.responses[i]||{};return `<tr><td>${i+1}. ${LOC[t.loc].name}</td><td>${esc(t.quote)}<br>${esc(t.prompt)}</td><td>${esc(r.first||'—')}</td><td>${esc(r.last||'—')}</td><td>${esc(t.answer||t.answers[0])}</td><td>${esc(r.attempts??'—')} / ${esc(r.status||'Not completed')}</td></tr>`}).join('')}</tbody></table></div><h2>Final writing</h2><p><b>Automated status:</b> ${esc(state.writingStatus)} · <b>Checks:</b> ${state.writingChecks}</p><div class="rule" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(state.writing||'Not submitted')}</div><p class="muted">Free writing must be reviewed by the teacher. Pattern checks do not guarantee grammatical correctness.</p><div class="row spaced noPrint"><button class="primary" onclick="window.print()">🖨 Print / Save as PDF</button><button onclick="exportReport()">⬇ Download report (.txt)</button><button class="danger" onclick="restart()">↻ Teacher: Start Again</button><button class="ghost" onclick="state.screen='map';save();render()">World map</button></div></section>`}
function exportReport(){let lines=['THE LOST MESSAGES — TEACHER REPORT','Agent: '+state.name,'Date: '+new Date().toLocaleString(),'Completed: '+doneCount()+'/20',''];TASKS.forEach((t,i)=>{let r=state.responses[i]||{};lines.push((i+1)+'. '+t.quote+' '+t.prompt,'First: '+(r.first||'—'),'Final: '+(r.last||'—'),'Correct: '+(t.answer||t.answers[0]),'Status: '+(r.status||'Not completed'),'')});lines.push('FINAL WRITING:',state.writing||'Not submitted','Status: '+state.writingStatus);let blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Lost_Messages_Report_'+state.name.replace(/[^a-z0-9_-]/gi,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function openModal(html){document.getElementById('modalRoot').innerHTML=`<div class="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function teacherGate(){teacherPanel()}
function teacherPanel(){openModal(`<h2>⚙ Teacher controls</h2><p class="muted">Skipped tasks are recorded as teacher-skipped, never as correct.</p><div class="grid"><button onclick="skipTask()">⏭ Skip current task</button><button onclick="skipLocation()">⏭ Skip location</button><button onclick="goFinalTeacher()">✨ Go to final</button><button onclick="state.screen='report';save();closeModal();render()">📋 View report</button><button class="danger" onclick="restart()">↻ Start Again</button><button onclick="closeModal()">Close</button></div>`)}
function skipOne(i){if(state.completed[i])return;state.completed[i]=true;state.responses[i]={first:'—',last:'—',attempts:0,correct:false,status:'Skipped by teacher'};state.teacherSkips.push(i)}
function skipTask(){scenePhase='mission';if(state.screen!=='task'){closeModal();alert('Open a task first.');return}let i=state.idx,loc=TASKS[i].loc;skipOne(i);let next=TASKS.findIndex((t,j)=>t.loc===loc&&!state.completed[j]);if(next<0)state.screen='map';else{state.idx=next;state.screen='task';resetTask()}save();closeModal();render()}
function skipLocation(){scenePhase='mission';let loc=state.screen==='task'?TASKS[state.idx].loc:LOC.findIndex((l,i)=>!locDone(i));if(loc<0){closeModal();return}TASKS.forEach((t,i)=>{if(t.loc===loc)skipOne(i)});state.screen='map';save();closeModal();render()}
function goFinalTeacher(){state.screen='final';save();closeModal();render()}
function restart(){scenePhase='mission';if(!confirm('Teacher: erase this student’s saved progress and start again?'))return;state=initial();save();closeModal();resetTask();render()}
render();
